<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Kluby · App</title>
    <link rel="stylesheet" href="/kluby.css" />
    <link rel="stylesheet" href="/kluby-public.css" />
    <link rel="stylesheet" href="/kluby-app.css" />
    <style>
      /* Mapa 2D de mesas */
      .floor {
        position: relative; width: 100%; min-width: 640px; height: 360px;
        background:
          linear-gradient(180deg, #10101a, #0c0c14);
        border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
        background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.04) 1px, transparent 0);
        background-size: 22px 22px;
      }
      .floor-wrap { overflow-x: auto; padding-bottom: 8px; }
      .stage-label {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        background: var(--surface-3); color: var(--muted); padding: 4px 18px;
        border-radius: 999px; font-size: 11px; letter-spacing: 2px; font-weight: 700;
      }
      .table-node {
        position: absolute; width: 78px; height: 60px; border-radius: 12px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-size: 11px; font-weight: 700; cursor: pointer; padding: 4px; text-align: center;
        border: 1.5px solid transparent; transition: transform 0.1s; color: #fff;
      }
      .table-node small { font-weight: 600; opacity: 0.85; font-size: 10px; }
      .table-node:hover { transform: scale(1.06); }
      .table-node.available { background: rgba(45,226,198,0.14); border-color: var(--accent); color: var(--accent); }
      .table-node.reserved { background: rgba(255,92,108,0.13); border-color: var(--red); color: #ff9aa3; cursor: not-allowed; }
      .table-node.reserved:hover { transform: none; }
      .legend { display: flex; gap: 18px; margin: 14px 0; font-size: 13px; color: var(--muted); }
      .legend .dot { width: 11px; height: 11px; border-radius: 4px; display: inline-block; margin-right: 6px; vertical-align: middle; }

      /* Mapa con imagen de fondo (plano del salon) */
      .floor-map { position: relative; width: 100%; max-width: 560px; margin: 0 auto; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); background: #0c0c14; }
      .floor-map.default-canvas {
        aspect-ratio: 1725 / 2490;
        background: linear-gradient(180deg, #14141f, #0c0c14);
        border: 2px dashed var(--border);
        min-height: 200px;
      }
      .floor-map img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
      .canvas-label {
        position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
        font-size: 11px; color: var(--muted); pointer-events: none; z-index: 1;
        background: rgba(0,0,0,0.35); padding: 4px 10px; border-radius: 6px;
      }
      .table-pin {
        position: absolute; transform: translate(-50%, -50%);
        min-width: 26px; height: 26px; padding: 0 5px; border-radius: 7px;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 800; border: 2px solid; cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,0.5); transition: transform 0.1s;
      }
      .table-pin.available { background: rgba(45,226,198,0.92); border-color: #ffffff; color: #04201c; }
      .table-pin.reserved { background: rgba(255,92,108,0.88); border-color: rgba(255,255,255,0.6); color: #fff; cursor: not-allowed; }
      .table-pin.available:hover { transform: translate(-50%, -50%) scale(1.18); z-index: 3; }
      .sector-legend { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 0; font-size: 12px; color: var(--muted); justify-content: center; }

      .bottles-section { margin-top: 28px; }
      .bottles-section h3 { margin: 0 0 6px; font-size: 18px; }
      .bottles-section .section-sub { margin-bottom: 14px; }
      .bottles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
      .bottle-item {
        background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px;
        padding: 14px; display: flex; flex-direction: column; gap: 6px;
      }
      .bottle-item .bi-name { font-weight: 700; font-size: 14px; }
      .bottle-item .bi-cat { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
      .bottle-item .bi-desc { font-size: 12px; color: var(--muted); line-height: 1.4; flex: 1; }
      .bottle-item .bi-price { font-size: 17px; font-weight: 800; color: var(--accent); margin-top: 4px; }

      .k-finance-block {
        background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px;
        padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
      }
      .k-fin-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; gap: 10px; }
      .k-fin-row span { color: var(--muted); }
      .k-fin-row b { font-size: 15px; }
      .k-fin-row.highlight span { color: var(--text); font-weight: 600; }
      .k-fin-row.highlight b { color: var(--amber); font-size: 17px; }
      .k-fin-row.ok b { color: var(--green); }
      .k-fin-note { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 2px; }

      .k-calc-budget { margin: 14px 0; }
      .k-calc-budget label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
      .k-calc-budget input { width: 100%; padding: 12px 14px; border-radius: 10px; background: var(--surface-3); border: 1px solid var(--border); color: var(--text); font-size: 16px; font-weight: 700; }
      .k-calc-lines { display: flex; flex-direction: column; gap: 10px; max-height: 340px; overflow-y: auto; margin: 12px 0; padding-right: 4px; }
      .k-calc-line {
        display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
        padding: 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border);
      }
      .k-calc-line .name { font-weight: 700; font-size: 14px; }
      .k-calc-line .price { font-size: 12px; color: var(--muted); }
      .k-calc-qty { display: flex; align-items: center; gap: 8px; }
      .k-calc-qty button {
        width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
        background: var(--surface-3); color: var(--text); font-size: 18px; cursor: pointer; line-height: 1;
      }
      .k-calc-qty span { min-width: 24px; text-align: center; font-weight: 800; }
      .k-calc-line-total { font-weight: 800; color: var(--accent); font-size: 14px; white-space: nowrap; }
      .k-calc-summary {
        padding: 14px; border-radius: 12px; background: rgba(124,92,255,0.08);
        border: 1px solid rgba(124,92,255,0.25); font-size: 14px; line-height: 1.5;
      }
      .k-calc-summary b { font-size: 16px; }
      .k-calc-summary.over { background: rgba(255,92,108,0.08); border-color: rgba(255,92,108,0.3); }
      .k-calc-summary.ok { background: rgba(45,226,198,0.08); border-color: rgba(45,226,198,0.25); }

      .reserve-info { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
      .reserve-info .stat { background: var(--surface-3); border-radius: 10px; padding: 10px 14px; }
      .reserve-info .stat small { display: block; color: var(--muted); font-size: 11px; }
      .reserve-info .stat b { font-size: 16px; }
      .pay-opt { display: flex; gap: 10px; margin-top: 8px; }
      .pay-opt .opt {
        flex: 1; border: 1.5px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer;
      }
      .pay-opt .opt.sel { border-color: var(--primary); background: rgba(124,92,255,0.08); }
      .pay-opt .opt b { display: block; font-size: 15px; }
      .pay-opt .opt small { color: var(--muted); }

      .ticket {
        text-align: center; padding: 10px;
      }
      .ticket .qr { background: #fff; padding: 12px; border-radius: 14px; display: inline-block; margin: 8px 0; }
      .ticket .code { font-family: monospace; font-size: 13px; color: var(--muted); word-break: break-all; }

      .list-card { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
      .list-card .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
      .list-card .title { font-size: 16px; font-weight: 700; }

      .contact-card {
        margin: 18px 0 24px; padding: 18px 20px;
        background: linear-gradient(135deg, rgba(45,226,198,0.08), rgba(45,226,198,0.02));
        border: 1px solid rgba(45,226,198,0.25);
      }
      .contact-card h4 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .3px; }
      .contact-card .contact-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 14px; }
      .contact-card .contact-row:last-child { margin-bottom: 0; }
      .contact-card .contact-row a { color: var(--text); text-decoration: none; }
      .contact-card .contact-row a:hover { color: var(--accent); text-decoration: underline; }
      .contact-card .contact-icon { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
      .meta { color: var(--muted); font-size: 13px; line-height: 1.6; }
      .amount-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; }
      .amount-row b { color: var(--text); }

      .user-avatar { border-radius: 50%; object-fit: cover; border: 2px solid var(--border); flex-shrink: 0; display: block; }
      .user-avatar.placeholder {
        display: inline-flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #2a1d5e, #3a1d52); font-weight: 800; color: #fff;
      }
      .profile-card { max-width: 480px; margin: 0 auto; padding: 28px; }
      .profile-avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 22px; }
      .profile-avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid var(--border); }
      .profile-avatar.placeholder { display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #2a1d5e, #3a1d52); color: #fff; }
      input.readonly-field { opacity: 0.7; cursor: not-allowed; background: var(--surface-3); }

      .profile-crop-modal { max-width: 420px !important; }
      .profile-crop-layout { display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
      .profile-crop-viewport {
        width: 280px; height: 280px; position: relative; overflow: hidden;
        background: #0a0a12; border-radius: 14px; border: 1px solid var(--border);
        cursor: grab; touch-action: none; flex-shrink: 0;
      }
      .profile-crop-viewport.dragging { cursor: grabbing; }
      .profile-crop-viewport img {
        position: absolute; left: 50%; top: 50%; transform-origin: center center;
        max-width: none; pointer-events: none; user-select: none; -webkit-user-drag: none;
      }
      .profile-crop-frame {
        position: absolute; inset: 16px; border: 2px solid var(--accent);
        box-shadow: 0 0 0 9999px rgba(0,0,0,0.58); border-radius: 12px;
        pointer-events: none; z-index: 2;
      }
      .profile-crop-side { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .profile-crop-preview {
        width: 88px; height: 88px; border-radius: 50%; overflow: hidden;
        border: 3px solid var(--border); background: var(--surface-3);
      }
      .profile-crop-preview canvas { display: block; width: 100%; height: 100%; }
      .profile-crop-zoom-row { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
      .profile-crop-zoom-row input[type=range] { flex: 1; accent-color: var(--accent); }
      .profile-crop-zoom-row span { font-size: 12px; color: var(--muted); min-width: 36px; text-align: right; }
      .k-loyalty-block {
        margin-top: 16px; padding: 14px 16px; border-radius: 12px;
        background: linear-gradient(135deg, rgba(124,92,255,0.12), rgba(45,226,198,0.08));
        border: 1px solid rgba(124,92,255,0.35);
      }
      .k-loyalty-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
      .k-loyalty-head span { font-size: 13px; color: var(--muted); }
      .k-loyalty-head b { font-size: 18px; color: var(--accent); }
      .k-loyalty-toggle { display: flex; align-items: center; gap: 8px; margin: 10px 0 6px; font-size: 14px; cursor: pointer; }
      .k-loyalty-slider { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
      .k-loyalty-slider input[type=range] { flex: 1; accent-color: var(--accent); }
      .k-loyalty-slider.hidden { display: none; }
      .k-loyalty-card { margin-top: 20px; }
      .k-loyalty-club { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
      .k-loyalty-club:last-child { border-bottom: none; }
      .k-loyalty-txn { font-size: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); color: var(--muted); }
      .k-loyalty-txn b { color: var(--text); }
      .k-loyalty-txn.earn b { color: var(--accent); }
      .k-loyalty-txn.redeem b { color: var(--pink); }
    </style>
  </head>
  <body class="kluby-public kluby-app">
    <div id="k-bg"></div>
    <div id="root"></div>
    <div class="modal-overlay" id="modal"><div class="card modal" id="modal-content"></div></div>
    <div class="toast" id="toast"></div>

    <script src="/kluby-ui.js"></script>
    <script>
      const API = "/api";
      const state = {
        token: localStorage.getItem("kluby_token") || "",
        user: JSON.parse(localStorage.getItem("kluby_user") || "null"),
        view: "home",
        params: {},
      };

      // ---------- utils ----------
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const attr = (s) => esc(s).replace(/[\r\n]+/g, " ");
      function imgFallback(img) {
        img.style.display = "none";
        const fb = img.dataset.fallback;
        if (fb && img.parentElement) {
          img.parentElement.classList.remove("has-img");
          if (!img.parentElement.textContent.trim()) img.parentElement.appendChild(document.createTextNode(fb));
        }
      }
      const money = (n) => new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 }).format(Number(n) || 0);
      const num = (n) => Number(n) || 0;

      function reservationRemaining(r) {
        return Math.max(0, num(r.totalAmount) - num(r.amountPaid));
      }

      function reservationMinConsumption(r) {
        const t = r.table;
        if (!t) return 0;
        if (t.consumptionPercent != null && t.price != null) {
          return Math.round(num(t.price) * num(t.consumptionPercent) / 100);
        }
        return num(t.minConsumption);
      }

      function consumptionBudgetDefault(r) {
        const minCons = reservationMinConsumption(r);
        if (minCons > 0) return minCons;
        return reservationRemaining(r);
      }

      function reservationFinanceHtml(r, compact) {
        const remaining = reservationRemaining(r);
        const minCons = reservationMinConsumption(r);
        const paid = num(r.amountPaid);
        const total = num(r.totalAmount);
        const loyaltyDisc = num(r.loyaltyDiscount);
        const rows = [
          `<div class="k-fin-row"><span>Total mesa</span><b>${money(total)}</b></div>`,
        ];
        if (loyaltyDisc > 0) {
          rows.push(`<div class="k-fin-row"><span>Descuento Kluby Points</span><b>-${money(loyaltyDisc)}</b></div>`);
          if (r.loyaltyPointsRedeemed) {
            rows.push(`<div class="k-fin-row"><span>Puntos usados</span><b>${r.loyaltyPointsRedeemed} pts</b></div>`);
          }
        }
        rows.push(`<div class="k-fin-row"><span>Pagado</span><b>${money(paid)}</b></div>`);
        if (remaining > 0) {
          rows.push(`<div class="k-fin-row highlight"><span>Saldo pendiente</span><b>${money(remaining)}</b></div>`);
          rows.push(`<p class="k-fin-note">${r.paymentOption === "FULL_PAYMENT" ? "Completá el pago de la mesa." : "Resto de la mesa a abonar en el boliche (después de la seña)."}</p>`);
        } else if (r.status !== "PENDING_PAYMENT") {
          rows.push(`<div class="k-fin-row ok"><span>Saldo mesa</span><b>¡Pagada!</b></div>`);
        }
        if (minCons > 0 && !compact) {
          rows.push(`<div class="k-fin-row"><span>Consumición mínima</span><b>${money(minCons)}</b></div>`);
          rows.push(`<p class="k-fin-note">Monto mínimo en botellas/combos en el local (podés planificarlo con la calculadora).</p>`);
        }
        return `<div class="k-finance-block">${rows.join("")}</div>`;
      }

      let _loyaltyRules = null;
      let _wizardLoyalty = null;

      async function loadLoyaltyRules() {
        if (!_loyaltyRules) _loyaltyRules = await api("/loyalty/config");
        return _loyaltyRules;
      }

      function maxRedeemPoints(balance, payAmount, pointValue, rules) {
        if (!balance || balance < rules.minRedeemPoints) return 0;
        const pv = Number(pointValue) || 1;
        const maxDiscount = payAmount * (rules.maxRedeemPercent / 100);
        return Math.min(balance, Math.max(0, Math.floor(maxDiscount / pv)));
      }

      function wizardPayPreviewHtml(t) {
        const total = num(t.price);
        const deposit = Math.round(total * (t.depositPercent / 100));
        const minCons = num(t.minConsumption);
        const isFull = _reserveSel === "FULL_PAYMENT";
        let payNow = isFull ? total : deposit;
        const remaining = Math.max(0, total - (isFull ? total : deposit));
        let loyaltyLine = "";
        if (_wizardLoyalty?.pointsToUse > 0) {
          const disc = _wizardLoyalty.pointsToUse * (_wizardLoyalty.pointValue || 1);
          payNow = Math.max(0, payNow - disc);
          loyaltyLine = `<div class="k-fin-row"><span>Kluby Points</span><b>-${money(disc)}</b></div>`;
        }
        return `
          <div class="k-finance-block" style="margin-top:14px">
            <div class="k-fin-row"><span>Pagás ahora</span><b>${money(payNow)}</b></div>
            ${loyaltyLine}
            <div class="k-fin-row highlight"><span>Saldo en el boliche</span><b>${money(remaining)}</b></div>
            ${minCons ? `<div class="k-fin-row"><span>Consumición mínima</span><b>${money(minCons)}</b></div>` : ""}
          </div>`;
      }

      function wizardLoyaltyHtml(balance, maxPts, rules) {
        return `
          <div class="k-loyalty-block" id="wizard-loyalty">
            <div class="k-loyalty-head"><span>⭐ Kluby Points en este boliche</span><b>${balance} pts</b></div>
            <p class="hint" style="margin:0">Canjeá hasta ${rules.maxRedeemPercent}% del pago · mínimo ${rules.minRedeemPoints} pts</p>
            <label class="k-loyalty-toggle"><input type="checkbox" id="wizard-loyalty-use" onchange="toggleWizardLoyalty()" /> Usar puntos en esta reserva</label>
            <div class="k-loyalty-slider hidden" id="wizard-loyalty-slider">
              <input type="range" id="wizard-loyalty-range" min="${rules.minRedeemPoints}" max="${maxPts}" step="1" value="${maxPts}" oninput="onWizardLoyaltyChange()" />
              <span id="wizard-loyalty-val">${maxPts} pts</span>
            </div>
          </div>`;
      }

      function refreshWizardLoyaltyUi() {
        if (!_wizardLoyalty || !window._wizardTable) return;
        const t = window._wizardTable;
        const total = num(t.price);
        const deposit = Math.round(total * (t.depositPercent / 100));
        const payBase = _reserveSel === "FULL_PAYMENT" ? total : deposit;
        _wizardLoyalty.payBase = payBase;
        const maxPts = maxRedeemPoints(_wizardLoyalty.balance, payBase, _wizardLoyalty.pointValue, _wizardLoyalty.rules);
        const range = document.getElementById("wizard-loyalty-range");
        const useCb = document.getElementById("wizard-loyalty-use");
        if (!range || !useCb?.checked) {
          _wizardLoyalty.pointsToUse = 0;
        } else {
          range.max = String(Math.max(maxPts, _wizardLoyalty.rules.minRedeemPoints));
          if (Number(range.value) > maxPts) range.value = String(maxPts);
          if (Number(range.value) < _wizardLoyalty.rules.minRedeemPoints) range.value = String(_wizardLoyalty.rules.minRedeemPoints);
          _wizardLoyalty.pointsToUse = maxPts >= _wizardLoyalty.rules.minRedeemPoints ? Number(range.value) : 0;
          onWizardLoyaltyChange();
        }
        const preview = $("wizard-pay-preview");
        if (preview) preview.innerHTML = wizardPayPreviewHtml(t);
      }

      function toggleWizardLoyalty() {
        const slider = document.getElementById("wizard-loyalty-slider");
        const useCb = document.getElementById("wizard-loyalty-use");
        if (!slider || !_wizardLoyalty) return;
        if (useCb?.checked) {
          slider.classList.remove("hidden");
          _wizardLoyalty.pointsToUse = Number(document.getElementById("wizard-loyalty-range")?.value || 0);
        } else {
          slider.classList.add("hidden");
          _wizardLoyalty.pointsToUse = 0;
        }
        refreshWizardLoyaltyUi();
      }

      function onWizardLoyaltyChange() {
        if (!_wizardLoyalty) return;
        const range = document.getElementById("wizard-loyalty-range");
        const valEl = document.getElementById("wizard-loyalty-val");
        const pts = Number(range?.value || 0);
        _wizardLoyalty.pointsToUse = pts;
        const disc = pts * (_wizardLoyalty.pointValue || 1);
        if (valEl) valEl.textContent = `${pts} pts (-${money(disc)})`;
        const preview = $("wizard-pay-preview");
        if (preview && window._wizardTable) preview.innerHTML = wizardPayPreviewHtml(window._wizardTable);
      }

      function guestFinanceHtml({ shareAmount, prepaid, minConsumption, status }) {
        const share = num(shareAmount);
        const minCons = num(minConsumption);
        const rows = [];
        if (prepaid || share === 0) {
          rows.push(`<div class="k-fin-row ok"><span>Tu parte de la mesa</span><b>Sin costo</b></div>`);
          rows.push(`<p class="k-fin-note">El anfitrión ya pagó la mesa entera.</p>`);
        } else if (status === "ACCEPTED_PENDING_PAYMENT") {
          rows.push(`<div class="k-fin-row highlight"><span>Te falta pagar</span><b>${money(share)}</b></div>`);
          rows.push(`<p class="k-fin-note">Pagá tu parte para confirmar el ingreso a la mesa.</p>`);
        } else {
          rows.push(`<div class="k-fin-row"><span>Tu parte de la mesa</span><b>${money(share)}</b></div>`);
          rows.push(`<p class="k-fin-note">Si te aceptan, abonás esta parte de la reserva.</p>`);
        }
        if (minCons > 0) {
          rows.push(`<div class="k-fin-row"><span>Consumición mínima</span><b>${money(minCons)}</b></div>`);
          rows.push(`<p class="k-fin-note">Mínimo en botellas/combos en el local (planificá con la calculadora).</p>`);
        }
        return `<div class="k-finance-block">${rows.join("")}</div>`;
      }

      function guestBudgetDefault({ shareAmount, prepaid, minConsumption, status }) {
        const minCons = num(minConsumption);
        if (minCons > 0) return minCons;
        if (!prepaid && status === "ACCEPTED_PENDING_PAYMENT") return num(shareAmount);
        if (!prepaid) return num(shareAmount);
        return 0;
      }
      const fdate = (d) => new Date(d).toLocaleDateString("es-AR", { weekday: "short", day: "numeric", month: "short" });
      const fdatetime = (d) => new Date(d).toLocaleString("es-AR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

      let toastTimer;
      function toast(msg, kind = "") {
        const t = $("toast");
        t.textContent = msg;
        t.className = "toast show " + kind;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (t.className = "toast " + kind), 3200);
      }
      function openModal(html) { $("modal-content").innerHTML = html; $("modal").classList.add("open"); }
      function closeModal() {
        if (_pc?.blobUrl) URL.revokeObjectURL(_pc.blobUrl);
        _pc = null;
        $("modal-content").classList.remove("profile-crop-modal");
        $("modal").classList.remove("open");
      }
      $("modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });

      async function api(path, options = {}) {
        const res = await fetch(API + path, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(state.token ? { Authorization: "Bearer " + state.token } : {}),
            ...(options.headers || {}),
          },
        });
        const json = await res.json().catch(() => ({ success: false, error: "Respuesta invalida" }));
        if (res.status === 401 && state.token) { doLogout(); throw new Error("Sesion expirada"); }
        if (!res.ok || !json.success) throw new Error(json.error || "Error " + res.status);
        return json.data;
      }

      const statusBadge = (s) => {
        const map = {
          PENDING_PAYMENT: ["amber", "Pago pendiente"], CONFIRMED: ["green", "Confirmada"],
          CHECKED_IN: ["violet", "Ingresado"], COMPLETED: ["muted", "Finalizada"],
          CANCELLED: ["red", "Cancelada"], EXPIRED: ["muted", "Expirada"],
          REQUESTED: ["amber", "Pendiente aprobacion"], ACCEPTED_PENDING_PAYMENT: ["violet", "Aceptado · a pagar"],
          REJECTED: ["red", "Rechazado"],
        };
        const [cls, label] = map[s] || ["muted", s];
        return `<span class="badge ${cls}">${label}</span>`;
      };

      function avatarHtml(user, size = 36, cls = "user-avatar") {
        const initial = esc((user?.fullName || "U").charAt(0).toUpperCase());
        if (user?.profileImageUrl) {
          return `<img class="${cls}" style="width:${size}px;height:${size}px" src="${esc(user.profileImageUrl)}" alt="${attr(user.fullName)}" onerror="this.outerHTML='<span class=\\'${cls} placeholder\\' style=\\'width:${size}px;height:${size}px\\'>${initial}</span>'" />`;
        }
        return `<span class="${cls} placeholder" style="width:${size}px;height:${size}px">${initial}</span>`;
      }

      // ---------- auth ----------
      function saveSession(data) {
        state.token = data.token; state.user = data.user;
        localStorage.setItem("kluby_token", data.token);
        localStorage.setItem("kluby_user", JSON.stringify(data.user));
      }
      function captureInviteFromUrl() {
        const p = new URLSearchParams(location.search);
        const inv = p.get("invitacion");
        const eq = p.get("equipo");
        if (inv) localStorage.setItem("kluby_pending_event", inv.trim());
        if (eq) localStorage.setItem("kluby_pending_equipo", eq.trim());
        if (inv || eq) history.replaceState({}, "", location.pathname);
      }
      async function redeemPendingInvites() {
        const eventCode = localStorage.getItem("kluby_pending_event");
        const teamCode = localStorage.getItem("kluby_pending_equipo");
        if (eventCode && state.user?.role === "CLIENT") {
          try {
            const r = await api("/invites/event/redeem", { method: "POST", body: JSON.stringify({ code: eventCode }) });
            localStorage.removeItem("kluby_pending_event");
            toast(r.message, "ok");
            if (r.club?.id && r.event?.id) go("event", { id: r.event.id, club: r.club.id });
            return;
          } catch (e) { toast(e.message, "err"); }
        }
        if (teamCode && state.token) {
          try {
            const r = await api("/invites/club/redeem", { method: "POST", body: JSON.stringify({ code: teamCode }) });
            localStorage.removeItem("kluby_pending_equipo");
            if (r.token && r.user) {
              saveSession({ token: r.token, user: r.user });
            }
            toast(r.message, "ok");
            if (r.user?.role === "STAFF") { location.href = "/publi.html"; return; }
            if (r.user?.role === "PUERTA") { location.href = "/staff.html"; return; }
          } catch (e) { toast(e.message, "err"); }
        }
      }
      async function redeemEventCode(code) {
        const r = await api("/invites/event/redeem", { method: "POST", body: JSON.stringify({ code: code.trim() }) });
        toast(r.message, "ok");
        if (r.club?.id && r.event?.id) go("event", { id: r.event.id, club: r.club.id });
      }
      async function redeemTeamCode(code) {
        const r = await api("/invites/club/redeem", { method: "POST", body: JSON.stringify({ code: code.trim() }) });
        if (r.token && r.user) saveSession({ token: r.token, user: r.user });
        toast(r.message, "ok");
        if (r.user?.role === "STAFF") { location.href = "/publi.html"; return; }
        if (r.user?.role === "PUERTA") { location.href = "/staff.html"; return; }
        render();
      }
      function doLogout() {
        state.token = ""; state.user = null;
        KlubyUI.clearClientAppVisit();
        localStorage.removeItem("kluby_token"); localStorage.removeItem("kluby_user");
        location.href = "/login.html";
      }

      function requireAuth() {
        if (!state.token || !state.user) {
          location.href = "/login.html?next=" + encodeURIComponent("/app.html" + location.search);
          return false;
        }
        const away = KlubyUI.resolveAppEntry(state.user);
        if (away) {
          location.href = away;
          return false;
        }
        return true;
      }

      function go(view, params = {}) {
        clearTimeout(homeTimer);
        clearTimeout(wzClubsTimer);
        state.view = view;
        state.params = params;
        render();
        window.scrollTo(0, 0);
      }
      function stillOn(view) { return state.view === view; }
      function livePage(view) {
        if (!stillOn(view)) return null;
        return document.getElementById("page");
      }

      // ---------- Fase 2: wizard, QR, timeline, alertas ----------
      const WIZARD_LABELS = ["Boliche", "Fecha", "Mesa", "Pago"];
      let _wizardTables = null;
      let _alertsCache = null;
      let _alertsAt = 0;
      let _reserveSel = "DEPOSIT_ONLY";

      function wizardGo(step, extra = {}) {
        const p = { ...state.params, ...extra, step: Number(step) || 1 };
        const clean = { step: p.step };
        if (p.step >= 2 && p.clubId) clean.clubId = p.clubId;
        if (p.step >= 3 && p.eventId) clean.eventId = p.eventId;
        if (p.step >= 4 && p.tableId) clean.tableId = p.tableId;
        go("wizard", clean);
      }

      function wizardChrome(step) {
        const pct = ((step - 1) / (WIZARD_LABELS.length - 1)) * 100;
        const steps = WIZARD_LABELS.map((lbl, i) => {
          const n = i + 1;
          const cls = n < step ? "done" : n === step ? "active" : "";
          return `<div class="k-wizard-step ${cls}"><span class="dot">${n < step ? "✓" : n}</span><span class="lbl">${lbl}</span></div>`;
        }).join("");
        return `<div class="k-wizard-steps">${steps}</div><div class="k-wizard-bar"><div class="k-wizard-bar-fill" style="width:${pct}%"></div></div>`;
      }

      function reservationTimelineHtml(r) {
        if (r.status === "CANCELLED" || r.status === "EXPIRED") {
          return `<div class="k-timeline cancelled"><div class="k-timeline-step done"><span>${r.status === "CANCELLED" ? "Cancelada" : "Expirada"}</span></div></div>`;
        }
        const paid = r.status !== "PENDING_PAYMENT" && (Number(r.amountPaid) > 0 || r.status === "CONFIRMED" || r.status === "CHECKED_IN" || r.status === "COMPLETED");
        const checked = r.status === "CHECKED_IN" || r.status === "COMPLETED";
        const done = r.status === "COMPLETED";
        const steps = [
          { label: "Reservada", state: "done" },
          { label: "Pagada", state: paid ? (r.status === "PENDING_PAYMENT" ? "current" : "done") : (r.status === "PENDING_PAYMENT" ? "current" : "") },
          { label: "Ingreso", state: checked ? "done" : paid ? "current" : "" },
          { label: "Finalizada", state: done ? "done" : checked ? "current" : "" },
        ];
        if (r.status === "PENDING_PAYMENT") steps[1].state = "current";
        else if (r.status === "CONFIRMED") steps[2].state = steps[2].state || "current";
        return `<div class="k-timeline">${steps.map((s) => `<div class="k-timeline-step ${s.state}"><span>${s.label}</span></div>`).join("")}</div>`;
      }

      function buildEventMapHtml(event, tables, onPick) {
        window._tables = tables;
        _wizardTables = tables;
        const pinHtml = (t) => {
          const short = String(t.label).split(" ").pop();
          const av = t.status === "AVAILABLE";
          return `<div class="table-pin ${av ? "available" : "reserved"}"
               style="left:${t.posX}%;top:${t.posY}%"
               title="${esc(t.label)} · ${t.capacity}p · ${money(t.price)}${av ? "" : " · Reservada"}"
               ${av ? `onclick="${onPick(t.id)}"` : ""}>${esc(short)}</div>`;
        };
        const pins = tables.map(pinHtml).join("");
        const sectors = [...new Set(tables.map((t) => t.sector).filter(Boolean))];
        const mapBlock = event.backgroundImage
          ? `<div class="floor-map"><img src="${esc(event.backgroundImage)}" alt="Plano del salón" onerror="this.style.display='none'" />${pins}</div>`
          : `<div class="floor-map default-canvas"><span class="canvas-label">Plano del salón</span>${pins}</div>`;
        const emptyHint = tables.length === 0
          ? `<div class="empty" style="margin-top:14px">Todavía no hay mesas en este evento.</div>`
          : `<div class="sector-legend">${sectors.map((s) => `<span>📍 ${esc(s)}</span>`).join("")}</div>`;
        return { mapBlock, emptyHint };
      }

      async function fetchAlertsData() {
        const alerts = [];
        try {
          const [rs, joins] = await Promise.all([
            api("/users/" + state.user.id + "/reservations"),
            api("/users/" + state.user.id + "/guest-entries"),
          ]);
          const now = Date.now();
          for (const r of rs) {
            if (r.status === "PENDING_PAYMENT" && new Date(r.event.date).getTime() >= now) {
              alerts.push({
                kind: "amber",
                text: `Pago pendiente · ${r.table.label} · ${r.club.name}`,
                action: `payReservation('${r.id}')`,
                label: "Pagar ahora",
              });
            }
          }
          for (const g of joins) {
            if (g.status === "ACCEPTED_PENDING_PAYMENT" && g.reservation?.paymentOption !== "FULL_PAYMENT") {
              alerts.push({
                kind: "green",
                text: `¡Te aceptaron! Pagá tu parte en ${g.reservation.table.label}`,
                action: `payShare('${g.id}')`,
                label: "Pagar parte",
              });
            }
          }
        } catch { /* sin alertas */ }
        return alerts;
      }

      async function refreshAlerts() {
        const el = document.getElementById("app-alerts");
        if (!el || !state.user) return;
        const now = Date.now();
        if (!_alertsCache || now - _alertsAt > 12000) {
          _alertsCache = await fetchAlertsData();
          _alertsAt = now;
        }
        el.innerHTML = _alertsCache.length
          ? _alertsCache.map((a) => `
              <div class="k-alert ${a.kind}">
                <span>${esc(a.text)}</span>
                <button type="button" class="btn-sm ${a.kind === "green" ? "btn-accent" : ""}" onclick="${a.action}">${esc(a.label)}</button>
              </div>`).join("")
          : "";
      }

      function maybeOnboard(key, html, continueFn) {
        if (localStorage.getItem(key)) {
          continueFn();
          return;
        }
        window._onboardContinue = () => { localStorage.setItem(key, "1"); closeModal(); continueFn(); };
        openModal(`<div class="k-onboard-box">${html}</div><button type="button" class="btn-full" onclick="_onboardContinue()">Entendido, continuar</button>`);
      }

      async function renderWizard(page) {
        const step = Number(state.params.step) || 1;
        page.innerHTML = wizardChrome(step) + `<div class="k-wizard-body" id="wizard-body"><div class="empty">Cargando...</div></div>`;
        const body = page.querySelector("#wizard-body");
        try {
          if (step === 1) {
            body.innerHTML = `
              <div class="k-page-head"><h1>Elegí el boliche</h1><p>Paso 1 de 4 · Seleccioná dónde querés salir.</p></div>
              ${KlubyUI.exploreFiltersHtml("wz-", { tab: "clubs" })}
              <div class="k-clubs-grid" id="wz-clubs"><div class="empty">Cargando...</div></div>`;
            body.querySelectorAll("#wz-q, #wz-genre, #wz-zone, #wz-upcoming").forEach((el) => {
              el.addEventListener("input", debouncedWizardClubs);
              el.addEventListener("change", debouncedWizardClubs);
            });
            loadWizardClubs();
            return;
          }
          if (step === 2) {
            if (!state.params.clubId) { wizardGo(1); return; }
            const club = await api("/clubs/" + state.params.clubId);
            if (!stillOn("wizard")) return;
            const events = (club.events || []).filter((e) => e.isActive);
            const fut = events.filter((e) => new Date(e.date) >= new Date(Date.now() - 6 * 3600 * 1000)).sort((a, b) => new Date(a.date) - new Date(b.date));
            const list = fut.length ? fut : events;
            body.innerHTML = `
              <button type="button" class="ghost btn-sm k-back" onclick="wizardGo(1)">← Cambiar boliche</button>
              <div class="k-page-head"><h1>${esc(club.name)}</h1><p>Paso 2 de 4 · Elegí la fecha del evento.</p></div>
              <div class="k-events-list" id="wz-events">${list.length
                ? list.map((e) => KlubyUI.eventRowAppHtml(e, club.id, "wizard")).join("")
                : `<div class="empty">No hay fechas publicadas.</div>`}</div>`;
            return;
          }
          if (step === 3) {
            if (!state.params.clubId || !state.params.eventId) { wizardGo(2, { clubId: state.params.clubId }); return; }
            const [data, products] = await Promise.all([
              api("/events/" + state.params.eventId + "/availability"),
              api("/events/" + state.params.eventId + "/products").catch(() => []),
            ]);
            if (!stillOn("wizard")) return;
            const cid = state.params.clubId;
            const eid = state.params.eventId;
            const onPick = (tid) => `wizardGo(4,{clubId:'${cid}',eventId:'${eid}',tableId:'${tid}'})`;
            const { mapBlock, emptyHint } = buildEventMapHtml(data.event, data.tables, onPick);
            body.innerHTML = `
              <button type="button" class="ghost btn-sm k-back" onclick="wizardGo(2,{clubId:'${cid}'})">← Cambiar fecha</button>
              <div class="k-page-head"><h1>${esc(data.event.name)}</h1><p>Paso 3 de 4 · Tocá una mesa disponible.</p></div>
              <div class="legend">
                <span><span class="dot" style="background:var(--accent)"></span>Disponible</span>
                <span><span class="dot" style="background:var(--red)"></span>Reservada</span>
              </div>
              ${mapBlock}${emptyHint}${renderBottlesSection(products)}`;
            return;
          }
          if (step === 4) {
            const { clubId, eventId, tableId } = state.params;
            if (!clubId || !eventId || !tableId) { wizardGo(3, { clubId, eventId }); return; }
            if (!_wizardTables) {
              const data = await api("/events/" + eventId + "/availability");
              if (!stillOn("wizard")) return;
              _wizardTables = data.tables;
            }
            const t = (_wizardTables || []).find((x) => x.id === tableId);
            if (!t) { body.innerHTML = `<div class="empty">Mesa no encontrada.</div>`; return; }
            const deposit = Math.round(Number(t.price) * (t.depositPercent / 100));
            const minCons = num(t.minConsumption);
            _reserveSel = "DEPOSIT_ONLY";
            window._wizardTable = t;
            _wizardLoyalty = null;
            let loyaltySection = "";
            try {
              const bal = await api("/loyalty/clubs/" + clubId + "/balance");
              if (!stillOn("wizard")) return;
              const rules = bal.rules || await loadLoyaltyRules();
              const payBase = deposit;
              const maxPts = maxRedeemPoints(bal.balance, payBase, bal.pointValue, rules);
              _wizardLoyalty = {
                balance: bal.balance,
                pointValue: Number(bal.pointValue) || 1,
                rules,
                pointsToUse: 0,
                payBase,
              };
              if (maxPts >= rules.minRedeemPoints) {
                loyaltySection = wizardLoyaltyHtml(bal.balance, maxPts, rules);
              }
            } catch { _wizardLoyalty = null; }
            body.innerHTML = `
              <button type="button" class="ghost btn-sm k-back" onclick="wizardGo(3,{clubId:'${clubId}',eventId:'${eventId}'})">← Cambiar mesa</button>
              <div class="k-page-head"><h1>Confirmá tu reserva</h1><p>Paso 4 de 4 · ${esc(t.label)} · ${esc(t.sector || "")}</p></div>
              <div class="k-wizard-pay-card">
                <div class="reserve-info">
                  <div class="stat"><small>Mesa</small><b>${esc(t.label)}</b></div>
                  <div class="stat"><small>Capacidad</small><b>${t.capacity} personas</b></div>
                  <div class="stat"><small>Total mesa</small><b>${money(t.price)}</b></div>
                  <div class="stat"><small>Seña (${t.depositPercent}%)</small><b>${money(deposit)}</b></div>
                  ${minCons ? `<div class="stat"><small>Consumición mín.</small><b>${money(minCons)}</b></div>` : ""}
                </div>
                <label>¿Cómo querés pagar?</label>
                <div class="pay-opt">
                  <div class="opt sel" id="opt-dep" onclick="selPay('DEPOSIT_ONLY')"><b>Seña</b><small>${money(deposit)} ahora</small></div>
                  <div class="opt" id="opt-full" onclick="selPay('FULL_PAYMENT')"><b>Total</b><small>${money(t.price)} ahora</small></div>
                </div>
                ${loyaltySection}
                <div id="wizard-pay-preview">${wizardPayPreviewHtml(t)}</div>
                <button type="button" class="ghost btn-sm" style="margin-top:12px" onclick="openConsumptionPlanner({ eventId: '${eventId}', minConsumption: ${minCons}, tablePrice: ${num(t.price)}, depositPercent: ${t.depositPercent} })">🍾 Planificá tu consumo antes de ir</button>
                <button type="button" class="btn-full btn-accent" id="reserve-btn" style="margin-top:22px" onclick="confirmWizardReserve('${tableId}','${eventId}')">Confirmar y pagar</button>
                <div class="error" id="reserve-err"></div>
              </div>`;
          }
        } catch (e) {
          if (stillOn("wizard") && body) body.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
        }
      }

      let wzClubsTimer;
      function debouncedWizardClubs() { clearTimeout(wzClubsTimer); wzClubsTimer = setTimeout(loadWizardClubs, 300); }
      async function loadWizardClubs() {
        if (!stillOn("wizard") || Number(state.params.step) !== 1) return;
        const f = KlubyUI.readExploreFilters("wz-");
        const qs = KlubyUI.clubsQueryString(f);
        try {
          const clubs = await api("/clubs" + (qs ? "?" + qs : ""));
          if (!stillOn("wizard")) return;
          const el = document.getElementById("wz-clubs"); if (!el) return;
          if (!clubs.length) { el.innerHTML = `<div class="empty">No se encontraron boliches.</div>`; return; }
          el.innerHTML = clubs.map((c) => KlubyUI.clubCardAppHtml(c, "wizard")).join("");
        } catch (e) {
          if (stillOn("wizard")) toast(e.message, "err");
        }
      }

      async function confirmWizardReserve(tableId, eventId) {
        const btn = $("reserve-btn");
        if (btn) { btn.disabled = true; btn.textContent = "Procesando..."; }
        try {
          const r = await api("/reservations", { method: "POST", body: JSON.stringify({
            eventId, tableId, hostId: state.user.id, paymentOption: _reserveSel, mode: "STANDARD",
          }) });
          const payBody = { provider: "demo" };
          if (_wizardLoyalty?.pointsToUse > 0) payBody.loyaltyPointsToRedeem = _wizardLoyalty.pointsToUse;
          const paid = await api("/reservations/" + r.id + "/pay", { method: "POST", body: JSON.stringify(payBody) });
          _alertsCache = null;
          go("ticket", { id: paid.id });
        } catch (e) {
          const err = document.getElementById("reserve-err");
          if (err) err.textContent = e.message;
          if (btn) { btn.disabled = false; btn.textContent = "Confirmar y pagar"; }
        }
      }

      async function renderTicket(page) {
        page.innerHTML = `<div class="empty">Cargando tu QR...</div>`;
        try {
          const r = await api("/reservations/" + state.params.id);
          if (!stillOn("ticket")) return;
          const live = livePage("ticket"); if (!live) return;
          const qr = "https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=" + encodeURIComponent(r.code);
          live.innerHTML = `
            <div class="k-ticket-page">
              <div class="k-hero-badge" style="margin-bottom:20px"><span class="pulse"></span> Reserva confirmada</div>
              <h1>¡Listo para salir! 🎉</h1>
              <p class="k-ticket-meta">${esc(r.club.name)}<br/><b>${esc(r.event.name)}</b><br/>${esc(r.table.label)} · ${fdatetime(r.event.date)}</p>
              <div class="k-ticket-qr"><img src="${qr}" alt="QR ${attr(r.code)}" width="280" height="280" /></div>
              <p class="k-ticket-code">${esc(r.code)}</p>
              ${reservationFinanceHtml(r)}
              <p class="hint" style="margin-top:10px">Mostrá este código en puerta para ingresar.</p>
              <button type="button" class="ghost btn-sm" style="margin-top:12px" onclick="openConsumptionPlanner({ reservationId: '${r.id}' })">🍾 Calculadora de consumo</button>
              ${reservationTimelineHtml(r)}
              <div class="btn-row" style="justify-content:center;margin-top:28px">
                <button type="button" class="ghost" onclick="go('home')">Explorar más</button>
                <button type="button" onclick="go('mine')">Mis reservas</button>
              </div>
            </div>`;
        } catch (e) {
          const live = livePage("ticket");
          if (live) live.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
        }
      }

      // ---------- render shell ----------
      function render() {
        if (!requireAuth()) return;

      async function openConsumptionPlanner(opts = {}) {
        openModal('<div class="empty">Cargando...</div>');
        try {
          if (opts.guestView && !opts.reservationId) {
            throw new Error("Solo podés usar la calculadora si formás parte de la mesa.");
          }
          let r = null;
          if (opts.reservationId) {
            r = await api("/reservations/" + opts.reservationId);
            const uid = state.user?.id;
            if (uid) {
              const isHost = r.hostId === uid || r.host?.id === uid;
              const isGuest = (r.guests || []).some(
                (g) => g.userId === uid && (g.status === "CONFIRMED" || g.status === "ACCEPTED_PENDING_PAYMENT")
              );
              if (!isHost && !isGuest) {
                throw new Error("Solo podés usar la calculadora si sos anfitrión o invitado confirmado de esta mesa.");
              }
            }
          }
          const eventId = r?.eventId || r?.event?.id || opts.eventId;
          let eventName = r?.event?.name || opts.eventName || "";
          if (!eventId) throw new Error("No se encontró el evento");
          if (!eventName) {
            const av = await api("/events/" + eventId + "/availability");
            eventName = av.event?.name || "Evento";
          }
          const products = await api("/events/" + eventId + "/products");
          const defaultBudget = opts.defaultBudget ?? (opts.guestView
            ? guestBudgetDefault(opts.guestView)
            : (r ? consumptionBudgetDefault(r) : (opts.minConsumption > 0 ? opts.minConsumption : Math.max(0, num(opts.tablePrice) - Math.round(num(opts.tablePrice) * (opts.depositPercent || 10) / 100)))));
          window._calcCtx = { r, eventId, eventName, products, budget: defaultBudget, qty: {}, guestView: opts.guestView || null };
          paintConsumptionPlanner();
        } catch (e) {
          openModal(`<div class="empty">${esc(e.message)}</div><button class="btn-full ghost" style="margin-top:16px" onclick="closeModal()">Cerrar</button>`);
        }
      }

      function calcLineTotal(productId) {
        const ctx = window._calcCtx;
        if (!ctx) return 0;
        const p = ctx.products.find((x) => x.id === productId);
        const q = ctx.qty[productId] || 0;
        return p ? num(p.price) * q : 0;
      }

      function calcCartTotal() {
        const ctx = window._calcCtx;
        if (!ctx) return 0;
        return ctx.products.reduce((acc, p) => acc + calcLineTotal(p.id), 0);
      }

      function setCalcQty(productId, delta) {
        const ctx = window._calcCtx;
        if (!ctx) return;
        const next = Math.max(0, (ctx.qty[productId] || 0) + delta);
        if (next === 0) delete ctx.qty[productId];
        else ctx.qty[productId] = next;
        paintConsumptionPlanner();
      }

      function setCalcBudget(val) {
        const ctx = window._calcCtx;
        if (!ctx) return;
        ctx.budget = Math.max(0, num(val));
        paintConsumptionPlanner();
      }

      function calcSummaryHtml(cartTotal, budget) {
        const diff = budget - cartTotal;
        if (!budget && !cartTotal) {
          return `<div class="k-calc-summary">Elegí un presupuesto y agregá botellas para ver cuánto podés llevar.</div>`;
        }
        if (cartTotal === 0) {
          return `<div class="k-calc-summary">Presupuesto: <b>${money(budget)}</b><br/>Agregá productos de la carta para armar tu noche.</div>`;
        }
        if (diff >= 0) {
          return `<div class="k-calc-summary ok">Armado: <b>${money(cartTotal)}</b> · Presupuesto: <b>${money(budget)}</b><br/>Te sobran <b>${money(diff)}</b> dentro de tu presupuesto.</div>`;
        }
        return `<div class="k-calc-summary over">Armado: <b>${money(cartTotal)}</b> · Presupuesto: <b>${money(budget)}</b><br/>Te faltan <b>${money(-diff)}</b> para cubrir lo seleccionado.</div>`;
      }

      function paintConsumptionPlanner() {
        const ctx = window._calcCtx;
        if (!ctx) return;
        const { r, eventName, products, budget, guestView } = ctx;
        const cartTotal = calcCartTotal();
        const financeBlock = guestView
          ? guestFinanceHtml(guestView)
          : (r ? reservationFinanceHtml(r) : "");
        const lines = products.length
          ? products.map((p) => {
              const q = ctx.qty[p.id] || 0;
              const lineTotal = calcLineTotal(p.id);
              return `<div class="k-calc-line">
                <div>
                  <div class="name">${esc(p.name)}</div>
                  <div class="price">${esc(p.category || "General")} · ${money(p.price)} c/u</div>
                </div>
                <div class="k-calc-qty">
                  <button type="button" onclick="setCalcQty('${p.id}', -1)">−</button>
                  <span>${q}</span>
                  <button type="button" onclick="setCalcQty('${p.id}', 1)">+</button>
                </div>
                <div class="k-calc-line-total">${q ? money(lineTotal) : "—"}</div>
              </div>`;
            }).join("")
          : `<div class="empty">Todavía no hay botellas cargadas para este evento.</div>`;

        openModal(`
          <h3>Calculadora de consumo</h3>
          <p class="sub">${esc(eventName)} · Planificá antes de ir al boliche</p>
          ${financeBlock}
          <div class="k-calc-budget">
            <label>Presupuesto para botellas / combos</label>
            <input type="number" min="0" step="1000" value="${budget || ""}" oninput="setCalcBudget(this.value)" placeholder="Ej. consumición mínima" />
            <p class="k-fin-note" style="margin-top:6px">Por defecto usamos la consumición mínima de la mesa, si está definida.</p>
          </div>
          <div class="k-calc-lines">${lines}</div>
          ${calcSummaryHtml(cartTotal, budget)}
          <button class="btn-full ghost" style="margin-top:16px" onclick="closeModal()">Cerrar</button>`);
      }

      async function openBottleMenu(eventId, eventName) {
        openConsumptionPlanner({ eventId, eventName });
      }

      // ---------- MY RESERVATIONS ----------
      async function renderMine(page) {
        page.innerHTML = `<div class="k-page-head"><h1>Mis reservas</h1><p>Gestioná tus mesas, abrilas a la comunidad o mostrá tu QR.</p></div><div id="list"><div class="empty">Cargando...</div></div><div id="past-wrap"></div>`;

      function upcomingCard(r) {
        const actions = [];
        if (r.status === "PENDING_PAYMENT") actions.push(`<button class="btn-sm" onclick="payReservation('${r.id}')">Pagar seña</button>`);
        if (r.status === "CONFIRMED" && r.mode === "STANDARD") actions.push(`<button class="btn-sm btn-accent" onclick="openTableModal('${r.id}',${r.table.capacity})">Abrir mesa 👥</button>`);

        if (r.status === "CONFIRMED" || r.status === "CHECKED_IN") actions.push(`<button class="btn-sm btn-accent" onclick="go('ticket',{id:'${r.id}'})">Ver QR</button>`);
        actions.push(`<button class="btn-sm ghost" onclick="openConsumptionPlanner({ reservationId: '${r.id}' })">Calculadora 🍾</button>`);
        if (r.status === "PENDING_PAYMENT" || r.status === "CONFIRMED") actions.push(`<button class="btn-sm btn-danger" onclick="cancelReservation('${r.id}')">Cancelar</button>`);

      // ---------- MI PERFIL ----------
      let _profileImage = null;
      const PROFILE_CROP = { size: 280, output: 400, frame: 248, zoomMin: 1, zoomMax: 3 };
      let _pc = null;

      function profileCropClamp() {
        if (!_pc) return;
        const s = _pc.baseScale * _pc.zoom;
        const dw = _pc.nw * s;
        const dh = _pc.nh * s;
        const maxX = Math.max(0, (dw - _pc.frame) / 2);
        const maxY = Math.max(0, (dh - _pc.frame) / 2);
        _pc.panX = Math.min(maxX, Math.max(-maxX, _pc.panX));
        _pc.panY = Math.min(maxY, Math.max(-maxY, _pc.panY));
      }

      function profileCropDraw(ctx, destSize) {
        const s = _pc.baseScale * _pc.zoom;
        const srcSize = _pc.frame / s;
        const srcX = _pc.nw / 2 - srcSize / 2 - _pc.panX / s;
        const srcY = _pc.nh / 2 - srcSize / 2 - _pc.panY / s;
        ctx.drawImage(_pc.image, srcX, srcY, srcSize, srcSize, 0, 0, destSize, destSize);
      }

      function profileCropUpdate() {
        if (!_pc?.imgEl) return;
        const s = _pc.baseScale * _pc.zoom;
        _pc.imgEl.style.transform = `translate(calc(-50% + ${_pc.panX}px), calc(-50% + ${_pc.panY}px)) scale(${s})`;
        const prev = document.getElementById("profile-crop-preview-cv");
        if (prev) {
          const pctx = prev.getContext("2d");
          pctx.clearRect(0, 0, prev.width, prev.height);
          profileCropDraw(pctx, prev.width);
        }
        const zoomLbl = document.getElementById("profile-crop-zoom-val");
        if (zoomLbl) zoomLbl.textContent = Math.round(_pc.zoom * 100) + "%";
      }

      function profileCropExportDataUrl() {
        const canvas = document.createElement("canvas");
        canvas.width = PROFILE_CROP.output;
        canvas.height = PROFILE_CROP.output;
        profileCropDraw(canvas.getContext("2d"), PROFILE_CROP.output);
        return canvas.toDataURL("image/jpeg", 0.92);
      }

      function profileCropBindEvents() {
        const vp = document.getElementById("profile-crop-vp");
        const zoomEl = document.getElementById("profile-crop-zoom");
        if (!vp || !zoomEl) return;
        let startX = 0, startY = 0, startPanX = 0, startPanY = 0, dragging = false;

        vp.onpointerdown = (e) => {
          dragging = true;
          vp.setPointerCapture(e.pointerId);
          vp.classList.add("dragging");
          startX = e.clientX;
          startY = e.clientY;
          startPanX = _pc.panX;
          startPanY = _pc.panY;
        };
        vp.onpointermove = (e) => {
          if (!dragging) return;
          _pc.panX = startPanX + (e.clientX - startX);
          _pc.panY = startPanY + (e.clientY - startY);
          profileCropClamp();
          profileCropUpdate();
        };
        const endDrag = () => { dragging = false; vp.classList.remove("dragging"); };
        vp.onpointerup = endDrag;
        vp.onpointercancel = endDrag;
        vp.onwheel = (e) => {
          e.preventDefault();
          _pc.zoom = Math.min(PROFILE_CROP.zoomMax, Math.max(PROFILE_CROP.zoomMin, _pc.zoom - e.deltaY * 0.002));
          zoomEl.value = String(_pc.zoom);
          profileCropClamp();
          profileCropUpdate();
        };
        zoomEl.oninput = () => {
          _pc.zoom = Number(zoomEl.value);
          profileCropClamp();
          profileCropUpdate();
        };
      }

      function openProfileCropper(file) {
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          const frame = PROFILE_CROP.frame;
          const baseScale = Math.max(frame / image.width, frame / image.height);
          _pc = {
            image,
            imgEl: null,
            nw: image.width,
            nh: image.height,
            baseScale,
            zoom: 1,
            panX: 0,
            panY: 0,
            frame,
            blobUrl: url,
          };
          openModal(`
            <div class="profile-crop-modal">
              <h3>Ajustar foto de perfil</h3>
              <p class="sub">Arrastrá la imagen para moverla · usá el zoom o la rueda del mouse</p>
              <div class="profile-crop-layout">
                <div class="profile-crop-viewport" id="profile-crop-vp">
                  <img id="profile-crop-img" src="${esc(url)}" alt="" draggable="false" />
                  <div class="profile-crop-frame" title="Área visible"></div>
                </div>
                <div class="profile-crop-side">
                  <span class="hint" style="margin:0">Vista previa</span>
                  <div class="profile-crop-preview">
                    <canvas id="profile-crop-preview-cv" width="176" height="176"></canvas>
                  </div>
                </div>
              </div>
              <div class="profile-crop-zoom-row">
                <span class="hint" style="margin:0">Zoom</span>
                <input type="range" id="profile-crop-zoom" min="${PROFILE_CROP.zoomMin}" max="${PROFILE_CROP.zoomMax}" step="0.01" value="1" />
                <span id="profile-crop-zoom-val">100%</span>
              </div>
              <div class="btn-row" style="margin-top:18px">
                <button type="button" class="ghost" onclick="cancelProfileCrop()">Cancelar</button>
                <button type="button" style="flex:1" id="profile-crop-ok" onclick="confirmProfileCrop()">Usar esta foto</button>
              </div>
              <div class="error" id="profile-crop-err"></div>
            </div>`);
          $("modal-content").classList.add("profile-crop-modal");
          _pc.imgEl = document.getElementById("profile-crop-img");
          _pc.imgEl.style.width = image.width + "px";
          _pc.imgEl.style.height = image.height + "px";
          profileCropBindEvents();
          profileCropUpdate();
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          toast("No se pudo leer la imagen", "err");
        };
        image.src = url;
      }

      function cancelProfileCrop() {
        closeModal();
      }

      async function confirmProfileCrop() {
        const errEl = document.getElementById("profile-crop-err");
        const btn = document.getElementById("profile-crop-ok");
        if (!_pc) return;
        btn.disabled = true;
        btn.textContent = "Subiendo...";
        errEl.textContent = "";
        try {
          const dataUrl = profileCropExportDataUrl();
          const res = await api("/uploads/profile", { method: "POST", body: JSON.stringify({ image: dataUrl }) });

          const av = document.getElementById("profile-av");

          const hint = document.getElementById("profile-photo-hint");
          if (hint) {
            hint.textContent = "Foto lista. Guardá para aplicar.";
            hint.style.color = "var(--accent)";
          }
          cancelProfileCrop();
          toast("Foto recortada y lista", "ok");
        } catch (err) {
          errEl.textContent = err.message;
          btn.disabled = false;
          btn.textContent = "Usar esta foto";

      }

      captureInviteFromUrl();
      if (!state.token || !state.user) {
        location.href = "/login.html?next=" + encodeURIComponent("/app.html" + location.search);
      } else {
        const away = KlubyUI.resolveAppEntry(state.user);
        if (away) {
          location.href = away;
        } else {
        const p = new URLSearchParams(location.search);
        const clubId = p.get("clubId");
        const eventId = p.get("eventId");
        if (clubId && eventId) {
          history.replaceState({}, "", "/app.html");
          go("wizard", { step: 3, clubId, eventId });
        } else if (clubId) {
          history.replaceState({}, "", "/app.html");
          go("wizard", { step: 2, clubId });
        } else {
          render();
        }
        }
      }
    </script>
  </body>
</html>
