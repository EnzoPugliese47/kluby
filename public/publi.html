<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Kluby · Publi</title>
    <link rel="stylesheet" href="/kluby.css" />
    <link rel="stylesheet" href="/ops-mobile.css" />
    <link rel="stylesheet" href="/kluby-public.css" />
    <script src="/ops-native.js"></script>
    <script src="/kluby-offline.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <div class="toast" id="toast"></div>
    <script>
      const API = "/api";
      let token = localStorage.getItem("kluby_token") || "";
      let user = JSON.parse(localStorage.getItem("kluby_user") || "null");
      let memberships = [];
      let events = [];
      let selectedEventId = "";
      let invitesForSelected = [];
      let inviteGuestsForSelected = [];
      let loadingInvites = false;

      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const fdt = (d) => new Date(d).toLocaleString("es-AR", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      let tt;
      function toast(m, k = "") { const t = $("toast"); t.textContent = m; t.className = "toast show " + k; clearTimeout(tt); tt = setTimeout(() => (t.className = "toast " + k), 3000); }

      async function api(path, options = {}) {
        const res = await fetch(API + path, { ...options, headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}), ...(options.headers || {}) } });
        const json = await res.json().catch(() => ({ success: false, error: "Respuesta invalida" }));
        if (!res.ok || !json.success) throw new Error(json.error || "Error " + res.status);
        return json.data;
      }

      function inviteLink(code) {
        return location.origin + "/login.html?invitacion=" + encodeURIComponent(code);
      }

      function qrUrl(link) {
        return "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" + encodeURIComponent(link);
      }

      function selectedEvent() {
        return events.find((ev) => ev.id === selectedEventId) || null;
      }

      function inviteGuestsHtml(guests, { showPubli = false } = {}) {
        if (!guests.length) {
          return '<p class="hint" style="margin:10px 0 0;text-align:center">Nadie canjeó esta invitación todavía.</p>';
        }
        return `<ul class="ops-history" style="margin-top:12px">${guests.map((g) => `
          <li>
            <div>
              <div class="name">${esc(g.user.fullName)}</div>
              <div class="meta">${esc(g.user.email)}${g.user.phone ? " · " + esc(g.user.phone) : ""}${showPubli && g.invite?.creator ? " · publi: " + esc(g.invite.creator.fullName) : ""}</div>
            </div>
            <div class="time">${fdt(g.redeemedAt)}</div>
          </li>`).join("")}</ul>`;
      }

      function inviteCardHtml(inv, eventName, guests) {
        const link = inviteLink(inv.code);
        const uses = inv._count?.guests ?? guests.length;
        const max = inv.maxUses ? ` / ${inv.maxUses}` : "";
        const codeAttr = esc(inv.code);
        const nameAttr = esc(eventName);
        const invGuests = guests.filter((g) => g.invite?.id === inv.id);
        return `
          <div class="ops-invite-card">
            <img class="ops-invite-qr" src="${qrUrl(link)}" alt="QR invitación" width="168" height="168" />
            <div class="ops-invite-code">${codeAttr}</div>
            <div class="ops-invite-link">${esc(link)}</div>
            <div class="ops-btn-row">
              <button type="button" class="ops-btn-lg secondary" data-copy="${codeAttr}">Copiar</button>
              <button type="button" class="ops-btn-lg" data-share="${codeAttr}" data-event-name="${nameAttr}">Compartir</button>
            </div>
            <p class="hint" style="text-align:center;margin-top:10px">${uses}${max} usos · ${inv.expiresAt ? "vence " + fdt(inv.expiresAt) : "sin vencimiento"}</p>
            <div class="section-title" style="margin-top:14px;font-size:14px">Canjeados (${invGuests.length})</div>
            ${inviteGuestsHtml(invGuests)}
          </div>`;
      }

      function logout() {
        token = ""; user = null; memberships = []; events = []; selectedEventId = ""; invitesForSelected = []; inviteGuestsForSelected = [];
        localStorage.removeItem("kluby_token");
        localStorage.removeItem("kluby_user");
        location.href = "/login.html";
      }

      async function bootstrap() {
        if (user.role === "STAFF") {
          memberships = await api("/users/me/memberships");
          if (!memberships.length) {
            toast("No tenés boliche asignado. Pedile un código al dueño.", "err");
            logout();
            return;
          }
        } else {
          const clubs = await api("/clubs");
          memberships = clubs.map((c) => ({ club: c, clubId: c.id }));
        }
        await loadEvents(memberships[0].club?.id || memberships[0].clubId);
        render();
      }

      async function loadEvents(clubId) {
        events = await api("/clubs/" + clubId + "/staff-events");
        selectedEventId = "";
        invitesForSelected = [];
        inviteGuestsForSelected = [];
      }

      async function loadInvitesForSelected() {
        if (!selectedEventId) {
          invitesForSelected = [];
          inviteGuestsForSelected = [];
          return;
        }
        loadingInvites = true;
        renderInviteSection();
        try {
          const [invites, guests] = await Promise.all([
            api("/events/" + selectedEventId + "/invites"),
            api("/events/" + selectedEventId + "/invite-guests"),
          ]);
          invitesForSelected = invites;
          inviteGuestsForSelected = guests;
        } catch {
          invitesForSelected = [];
          inviteGuestsForSelected = [];
        } finally {
          loadingInvites = false;
          renderInviteSection();
        }
      }

      function render() {
        const clubId = memberships[0]?.club?.id || memberships[0]?.clubId;
        const clubName = memberships[0]?.club?.name || "Boliche";
        const clubSelect = memberships.length > 1
          ? `<label>Boliche</label><select id="club-sel" onchange="onClubChange()">${memberships.map((m) => `<option value="${m.club.id}">${esc(m.club.name)}</option>`).join("")}</select>`
          : `<p class="role-pill">${esc(clubName)}</p>`;

        const eventOptions = events.length
          ? `<option value="">— Elegí un evento —</option>${events.map((ev) => `<option value="${ev.id}">${esc(ev.name)} · ${fdt(ev.date)}</option>`).join("")}`
          : `<option value="">No hay eventos próximos</option>`;

        $("root").innerHTML = `
          <div class="topbar ops-topbar">
            <div class="brand"><img class="logo" src="/brand/kluby-logo.png" width="48" height="48" alt="Kluby" /><div><h1>KLUBY</h1><span>Publi</span></div></div>
            <div class="right">
              <div class="who"><b>${esc(user.fullName)}</b><small>${user.role}</small></div>
              <button class="ghost btn-sm" onclick="logout()">Salir</button>
            </div>
          </div>
          <div class="ops-shell">
            ${clubSelect}
            <div class="section-title" style="margin-top:18px;font-size:20px">Invitar clientes</div>
            <div class="section-sub">Elegí el evento y generá un link con QR para compartir.</div>
            <label style="margin-top:16px">Evento</label>
            <select id="event-sel" onchange="onEventChange()">${eventOptions}</select>
            <div id="event-summary"></div>
            <button type="button" class="ops-btn-lg" id="create-invite-btn" style="margin-top:16px" onclick="createInvite()" disabled>Generar invitación</button>
            <div id="invites-wrap"></div>
          </div>`;
        if ($("club-sel")) $("club-sel").value = clubId;
        if ($("event-sel") && selectedEventId) $("event-sel").value = selectedEventId;
        renderInviteSection();
      }

      async function onClubChange() {
        selectedEventId = "";
        invitesForSelected = [];
        inviteGuestsForSelected = [];
        if ($("event-sel")) $("event-sel").innerHTML = `<option value="">Cargando eventos…</option>`;
        if ($("invites-wrap")) $("invites-wrap").innerHTML = "";
        if ($("event-summary")) $("event-summary").innerHTML = "";
        await loadEvents($("club-sel").value);
        render();
      }

      async function onEventChange() {
        selectedEventId = $("event-sel")?.value || "";
        await loadInvitesForSelected();
        renderInviteSection();
      }

      function renderInviteSection() {
        const ev = selectedEvent();
        const summary = $("event-summary");
        const btn = $("create-invite-btn");
        const wrap = $("invites-wrap");

        if (summary) {
          summary.innerHTML = ev
            ? `<div class="ops-event-card" style="margin-top:12px;margin-bottom:0">
                <div class="ops-event-head">
                  <b>${esc(ev.name)}</b>
                  <small>${fdt(ev.date)}${ev.musicGenre ? " · " + esc(ev.musicGenre) : ""}</small>
                </div>
              </div>`
            : "";
        }

        if (btn) btn.disabled = !selectedEventId || loadingInvites;

        if (!wrap) return;

        if (!selectedEventId) {
          wrap.innerHTML = '<div class="empty" style="margin-top:18px">Seleccioná un evento para ver o crear invitaciones.</div>';
          return;
        }

        if (loadingInvites) {
          wrap.innerHTML = '<div class="empty" style="margin-top:18px">Cargando invitaciones…</div>';
          return;
        }

        const cards = invitesForSelected.slice(0, 5).map((inv) => inviteCardHtml(inv, ev.name, inviteGuestsForSelected)).join("");
        const totalGuests = inviteGuestsForSelected.length;
        wrap.innerHTML = `
          <div class="section-title" style="margin-top:22px;font-size:16px">Invitaciones de este evento</div>
          ${cards || '<div class="empty">Todavía no hay invitaciones para este evento. Tocá «Generar invitación».</div>'}
          ${totalGuests ? `
            <div class="section-title" style="margin-top:24px;font-size:16px">Todos los canjeados (${totalGuests})</div>
            <div class="section-sub">Clientes que ingresaron con tu link de invitación.</div>
            ${inviteGuestsHtml(inviteGuestsForSelected)}` : ""}`;

        wrap.querySelectorAll("[data-copy]").forEach((el) => {
          el.addEventListener("click", () => copyInvite(el.getAttribute("data-copy")));
        });
        wrap.querySelectorAll("[data-share]").forEach((el) => {
          el.addEventListener("click", () => shareInvite(el.getAttribute("data-share"), el.getAttribute("data-event-name")));
        });
      }

      async function createInvite() {
        const ev = selectedEvent();
        if (!ev) {
          toast("Elegí un evento primero", "err");
          return;
        }
        const btn = $("create-invite-btn");
        if (btn) btn.disabled = true;
        try {
          const inv = await api("/events/" + ev.id + "/invites", { method: "POST", body: JSON.stringify({ maxUses: 50, expiresInHours: 336 }) });
          invitesForSelected.unshift(inv);
          renderInviteSection();
          toast("Invitación creada. Podés copiarla o compartirla cuando quieras.", "ok");
        } catch (e) {
          toast(e.message, "err");
          if (btn) btn.disabled = false;
        }
      }

      function copyInvite(code) {
        const link = inviteLink(code);
        navigator.clipboard?.writeText(link).then(() => toast("Link copiado", "ok")).catch(() => toast(link, "ok"));
      }

      async function shareInvite(code, eventName) {
        const link = inviteLink(code);
        const text = `Te invito a ${eventName} — reservá tu mesa en Kluby:\n${link}`;
        if (navigator.share) {
          try {
            await navigator.share({ title: "Invitación Kluby", text, url: link });
            return;
          } catch (e) {
            if (e.name === "AbortError") return;
          }
        }
        const wa = "https://wa.me/?text=" + encodeURIComponent(text);
        window.open(wa, "_blank", "noopener,noreferrer");
      }

      window.onClubChange = onClubChange;
      window.onEventChange = onEventChange;
      window.createInvite = createInvite;
      window.logout = logout;

      if (token && user) {
        if (!["STAFF", "CLUB_ADMIN", "SUPER_ADMIN"].includes(user.role)) {
          location.href = user.role === "PUERTA" ? "/staff.html" : "/app.html";
        } else {
          bootstrap().catch(() => logout());
        }
      } else {
        location.href = "/login.html?next=" + encodeURIComponent("/publi.html");
      }
    </script>
  </body>
</html>
