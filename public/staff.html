<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Kluby · Puerta</title>
    <link rel="stylesheet" href="/kluby.css" />
    <link rel="stylesheet" href="/ops-mobile.css" />
    <link rel="stylesheet" href="/kluby-public.css" />
    <script src="/ops-native.js"></script>
    <script src="/kluby-ui.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <div class="toast" id="toast"></div>
    <script>
      const API = "/api";
      let token = localStorage.getItem("kluby_token") || "";
      let user = JSON.parse(localStorage.getItem("kluby_user") || "null");
      let memberships = JSON.parse(localStorage.getItem("kluby_staff_clubs") || "[]");
      let staffClubId = null;
      let currentEventId = null;
      let staffTab = "scan";
      let qrScanner = null;
      let checkInsTimer = null;

      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const money = (n) => new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 }).format(Number(n) || 0);
      const fdt = (d) => new Date(d).toLocaleString("es-AR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      const ft = (d) => new Date(d).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
      let tt;
      function toast(m, k = "") { const t = $("toast"); t.textContent = m; t.className = "toast show " + k; clearTimeout(tt); tt = setTimeout(() => (t.className = "toast " + k), 3000); }

      async function api(path, options = {}) {
        const res = await fetch(API + path, { ...options, headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}), ...(options.headers || {}) } });
        const json = await res.json().catch(() => ({ success: false, error: "Respuesta invalida" }));
        if (!res.ok || !json.success) throw new Error(KlubyUI.friendlyError(json.error || "Error " + res.status, res.status));
        return json.data;
      }

      const badge = (s) => {
        const map = { CONFIRMED: ["green", "Confirmada"], CHECKED_IN: ["violet", "Ingresado"], COMPLETED: ["muted", "Finalizada"], PENDING_PAYMENT: ["amber", "Sin pagar"], CANCELLED: ["red", "Cancelada"], EXPIRED: ["muted", "Expirada"], NO_SHOW: ["red", "No-show"] };
        const [c, l] = map[s] || ["muted", s]; return `<span class="badge ${c}">${l}</span>`;
      };

      function activeClubIds() {
        return memberships.map((m) => m.club?.id || m.clubId).filter(Boolean);
      }

      function primaryClubId() {
        if (memberships.length) return memberships[0].club?.id || memberships[0].clubId;
        return staffClubId;
      }

      function clubLabel() {
        if (!memberships.length) return staffClubId ? "Admin" : "Sin boliche asignado";
        return memberships.map((m) => m.club?.name || "Boliche").join(", ");
      }

      function normalizeCode(raw) {
        let t = String(raw || "").trim();
        if (!t) return "";
        try {
          const u = new URL(t);
          const last = u.pathname.split("/").filter(Boolean).pop();
          return last || t;
        } catch {
          return t.split("/").pop() || t;
        }
      }

      function setTab(tab) {
        staffTab = tab;
        document.querySelectorAll(".ops-tab").forEach((el) => el.classList.toggle("active", el.dataset.tab === tab));
        document.querySelectorAll(".ops-panel").forEach((el) => el.classList.toggle("active", el.dataset.panel === tab));
        if (tab === "scan") startScanner();
        else {
          stopScanner();
          clearScanStatus();
        }
        if (tab === "history") loadCheckIns();
      }

      function showScanStatus(message, isError, showRetry) {
        const panel = document.querySelector('[data-panel="scan"]');
        if (!panel) return;
        let el = $("scan-status");
        if (!el) {
          el = document.createElement("div");
          el.id = "scan-status";
          el.className = "ops-scan-status" + (isError ? " err" : "");
          const reader = $("qr-reader");
          if (reader) panel.insertBefore(el, reader);
        }
        el.className = "ops-scan-status" + (isError ? " err" : "");
        el.innerHTML =
          esc(message) +
          (showRetry
            ? `<button type="button" class="ops-btn-lg secondary ops-scan-retry" onclick="retryScanner()">Permitir cámara / reintentar</button>`
            : "");
      }

      function clearScanStatus() {
        $("scan-status")?.remove();
      }

      async function ensureCameraPermission() {
        const cap = window.Capacitor;
        if (cap?.isNativePlatform?.() && cap.Plugins?.Camera?.requestPermissions) {
          try {
            const cur = await cap.Plugins.Camera.checkPermissions();
            if (cur.camera === "granted") return true;
            const req = await cap.Plugins.Camera.requestPermissions({ permissions: ["camera"] });
            return req.camera === "granted";
          } catch (e) {
            console.warn("Capacitor camera permission", e);
          }
        }
        if (!navigator.mediaDevices?.getUserMedia) return false;
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false,
          });
          stream.getTracks().forEach((t) => t.stop());
          return true;
        } catch (e) {
          console.warn("getUserMedia", e);
          return false;
        }
      }

      async function startScanner() {
        if (typeof Html5Qrcode === "undefined") {
          showScanStatus("No se cargó el lector QR. Revisá tu conexión e intentá de nuevo.", true, true);
          return;
        }
        if (qrScanner) return;
        const box = $("qr-reader");
        if (!box) return;
        clearScanStatus();
        box.innerHTML = "";

        const permitted = await ensureCameraPermission();
        if (!permitted) {
          showScanStatus(
            "Necesitamos acceso a la cámara para escanear QR. Tocá abajo para permitir, o andá a Ajustes → Apps → Kluby → Permisos → Cámara.",
            true,
            true
          );
          return;
        }

        qrScanner = new Html5Qrcode("qr-reader");
        const cameraConfigs = [{ facingMode: "environment" }, { facingMode: "user" }, { facingMode: { exact: "environment" } }];
        let lastErr = null;
        for (const cam of cameraConfigs) {
          try {
            await qrScanner.start(
              cam,
              { fps: 10, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0, disableFlip: false },
              (decoded) => {
                stopScanner();
                const code = normalizeCode(decoded);
                if ($("code")) $("code").value = code;
                lookup(code);
                setTab("manual");
              },
              () => {}
            );
            clearScanStatus();
            return;
          } catch (e) {
            lastErr = e;
            try {
              await qrScanner.stop();
            } catch {}
            try {
              qrScanner.clear();
            } catch {}
            qrScanner = null;
            box.innerHTML = "";
          }
        }
        showScanStatus(
          "No se pudo abrir la cámara" + (lastErr?.message ? ": " + lastErr.message : "") + ". Reintentá o usá código manual.",
          true,
          true
        );
      }

      function retryScanner() {
        stopScanner().finally(() => startScanner());
      }

      async function stopScanner() {
        if (!qrScanner) return;
        try {
          await qrScanner.stop();
          qrScanner.clear();
        } catch {}
        qrScanner = null;
      }

      function render() {
        if (!token || !user) {
          location.href = "/login.html?next=" + encodeURIComponent("/staff.html");
          return;
        }
        const isOwnerOrAdmin = ["CLUB_ADMIN", "SUPER_ADMIN"].includes(user.role);
        $("root").innerHTML = `
          <div class="topbar ops-topbar">
            <div class="brand"><div class="logo">K</div><div><h1>KLUBY</h1><span>Puerta</span></div></div>
            <div class="right">
              <div class="who"><b>${esc(user.fullName)}</b><small>${esc(clubLabel())}</small></div>
              ${isOwnerOrAdmin ? `<a class="ghost btn-sm ops-link-panel" href="/panel.html" style="padding:8px 12px;border-radius:8px;border:1px solid var(--border);text-decoration:none">Gestión</a>` : ""}
              <button class="ghost btn-sm" onclick="logout()">Salir</button>
            </div>
          </div>
          <div class="ops-shell">
            <div class="ops-tabs">
              <button type="button" class="ops-tab ${staffTab === "scan" ? "active" : ""}" data-tab="scan" onclick="setTab('scan')">Escanear</button>
              <button type="button" class="ops-tab ${staffTab === "manual" ? "active" : ""}" data-tab="manual" onclick="setTab('manual')">Manual</button>
              <button type="button" class="ops-tab ${staffTab === "history" ? "active" : ""}" data-tab="history" onclick="setTab('history')">Ingresos</button>
            </div>

            <div class="ops-panel ${staffTab === "scan" ? "active" : ""}" data-panel="scan">
              <p class="ops-scan-hint">Apuntá la cámara al QR del cliente</p>
              <div id="qr-reader"></div>
              <button type="button" class="ops-btn-lg secondary" style="margin-top:14px" onclick="setTab('manual')">Ingresar código a mano</button>
            </div>

            <div class="ops-panel ${staffTab === "manual" ? "active" : ""}" data-panel="manual">
              <label>Código de reserva</label>
              <input id="code" placeholder="Pegá o escribí el código" onkeydown="if(event.key==='Enter')lookup()" />
              <button type="button" class="ops-btn-lg" style="margin-top:12px" onclick="lookup()">Buscar reserva</button>
              <div id="result" style="margin-top:16px"></div>
            </div>

            <div class="ops-panel ${staffTab === "history" ? "active" : ""}" data-panel="history">
              <div class="ops-kpi-row">
                <div class="ops-kpi" id="checkins-kpi">Cargando…</div>
                <button type="button" class="ghost btn-sm" onclick="loadCheckIns()">↻</button>
              </div>
              <div id="checkins-list"><div class="empty">Cargando ingresos…</div></div>
            </div>
          </div>`;

        clearInterval(checkInsTimer);
        checkInsTimer = setInterval(() => { if (staffTab === "history") loadCheckIns(true); }, 30000);

        if (staffTab === "scan") setTimeout(() => startScanner(), 100);
        else if (staffTab === "manual") setTimeout(() => $("code")?.focus(), 50);
        else loadCheckIns();
      }

      async function loadMemberships() {
        if (user.role === "PUERTA" || user.role === "STAFF") {
          memberships = await api("/users/me/memberships");
          localStorage.setItem("kluby_staff_clubs", JSON.stringify(memberships));
        } else {
          memberships = [];
          localStorage.removeItem("kluby_staff_clubs");
          const clubs = await api("/clubs");
          if (clubs.length) staffClubId = clubs[0].id;
        }
      }

      async function loadCheckIns(silent) {
        const clubId = primaryClubId();
        const list = $("checkins-list");
        const kpi = $("checkins-kpi");
        if (!clubId || !list) return;
        if (!silent) list.innerHTML = `<div class="empty">Cargando ingresos…</div>`;
        try {
          const q = currentEventId ? "?eventId=" + encodeURIComponent(currentEventId) : "";
          const data = await api("/clubs/" + clubId + "/check-ins" + q);
          if (data.event) currentEventId = data.event.id;
          const rows = data.checkIns || [];
          if (kpi) {
            kpi.innerHTML = `<span>Ingresos${data.event ? " · " + esc(data.event.name) : ""}</span><b>${rows.length}</b>`;
          }
          if (!rows.length) {
            list.innerHTML = KlubyUI.emptyStateHtml({
              title: "Sin ingresos esta noche",
              hint: "Cuando escanees un QR o registres un ingreso manual, aparece acá.",
            });
            return;
          }
          list.innerHTML = `<ul class="ops-history">${rows.map((r) => `
            <li>
              <div>
                <div class="name">${esc(r.host?.fullName || "—")}</div>
                <div class="meta">${esc(r.table?.label || "Mesa")}${r.table?.sector ? " · " + esc(r.table.sector) : ""}</div>
              </div>
              <div class="time">${r.checkedInAt ? ft(r.checkedInAt) : "—"}</div>
            </li>`).join("")}</ul>`;
        } catch (e) {
          if (!silent) list.innerHTML = `<div class="empty" style="color:var(--red)">${esc(e.message)}</div>`;
        }
      }

      function logout() {
        stopScanner();
        clearInterval(checkInsTimer);
        token = ""; user = null; memberships = [];
        localStorage.removeItem("kluby_token");
        localStorage.removeItem("kluby_user");
        localStorage.removeItem("kluby_staff_clubs");
        location.href = "/login.html?next=" + encodeURIComponent("/staff.html");
      }

      async function lookup(codeArg) {
        const code = normalizeCode(codeArg || $("code")?.value);
        if (!code) return;
        if ($("code")) $("code").value = code;
        $("result").innerHTML = `<div class="empty">Buscando...</div>`;
        try {
          const r = await api("/reservations/by-code/" + encodeURIComponent(code));
          staffClubId = r.club.id;
          currentEventId = r.event?.id || currentEventId;
          const allowed = activeClubIds();
          if (user.role === "PUERTA" && allowed.length && !allowed.includes(r.club.id)) {
            throw new Error(`Esta reserva es de ${r.club.name}. Solo podés operar en: ${clubLabel()}.`);
          }
          const guests = (r.guests || []).filter((g) => g.status === "CONFIRMED");
          $("result").innerHTML = `
            <div class="card" style="padding:20px">
              <div class="row-between"><div style="font-size:18px;font-weight:800">${esc(r.table.label)}</div>${badge(r.status)}</div>
              <div class="meta" style="margin:10px 0">
                🏢 ${esc(r.club.name)}<br/>🗓️ ${fdt(r.event.date)}<br/>
                👤 Anfitrión: ${esc(r.host.fullName)}<br/>
                💳 Pagado: ${money(r.amountPaid)} de ${money(r.totalAmount)}
                ${r.mode === "OPEN_TABLE" ? `<br/>👥 Mesa abierta · ${guests.length + 1} confirmados` : ""}
              </div>
              <div class="btn-row">
                ${r.status === "CONFIRMED" ? `<button class="ops-btn-lg" onclick="act('${r.id}','check-in')">Registrar ingreso</button>` : ""}
                ${r.status === "CHECKED_IN" ? `<button class="ops-btn-lg secondary" onclick="act('${r.id}','checkout')">Cerrar mesa</button>` : ""}
                ${["COMPLETED","CANCELLED","EXPIRED","NO_SHOW","PENDING_PAYMENT"].includes(r.status) ? `<span class="hint">Sin acciones para este estado.</span>` : ""}
              </div>
            </div>`;
        } catch (e) { $("result").innerHTML = `<div class="card" style="padding:20px;border-color:var(--red)"><b style="color:var(--red)">${esc(e.message)}</b></div>`; }
      }

      async function act(id, action) {
        try {
          const res = await api("/reservations/" + id + "/" + action, { method: "POST" });
          if (action === "check-in") toast("Ingreso registrado", "ok");
          else if (action === "checkout") {
            const pts = res.earnedPoints || 0;
            toast(pts > 0 ? `Mesa cerrada · +${pts} Kluby Points al anfitrión` : "Mesa cerrada", "ok");
          } else toast("Listo", "ok");
          lookup();
          loadCheckIns(true);
        } catch (e) { toast(e.message, "err"); }
      }

      window.setTab = setTab;
      window.lookup = lookup;
      window.act = act;
      window.logout = logout;
      window.loadCheckIns = loadCheckIns;
      window.retryScanner = retryScanner;

      if (token && user) {
        if (!["PUERTA", "CLUB_ADMIN", "SUPER_ADMIN"].includes(user.role)) {
          location.href = user.role === "STAFF" ? "/publi.html" : "/app.html";
        } else {
          loadMemberships()
            .then(() => {
              if (user.role === "PUERTA" && !memberships.length) {
                alert("Tu cuenta no tiene un boliche asignado. Pedile al dueño que te dé acceso.");
                logout();
                return;
              }
              render();
            })
            .catch(() => logout());
        }
      } else {
        location.href = "/login.html?next=" + encodeURIComponent("/staff.html");
      }

      window.addEventListener("pagehide", () => { stopScanner(); clearInterval(checkInsTimer); });
    </script>
  </body>
</html>
