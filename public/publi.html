<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kluby · Publi</title>
    <link rel="stylesheet" href="/kluby.css" />
  </head>
  <body>
    <div id="root"></div>
    <div class="toast" id="toast"></div>
    <script>
      const API = "/api";
      let token = localStorage.getItem("kluby_publi_token") || localStorage.getItem("kluby_token") || "";
      let user = JSON.parse(localStorage.getItem("kluby_publi_user") || localStorage.getItem("kluby_user") || "null");
      let memberships = [];
      let events = [];
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const fdt = (d) => new Date(d).toLocaleString("es-AR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      let tt;
      function toast(m, k = "") { const t = $("toast"); t.textContent = m; t.className = "toast show " + k; clearTimeout(tt); tt = setTimeout(() => (t.className = "toast " + k), 3000); }

      async function api(path, options = {}) {
        const res = await fetch(API + path, { ...options, headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}), ...(options.headers || {}) } });
        const json = await res.json().catch(() => ({ success: false, error: "Respuesta invalida" }));
        if (!res.ok || !json.success) throw new Error(json.error || "Error " + res.status);
        return json.data;
      }

      function inviteLink(code) {
        const base = location.origin + "/index.html";
        return `${base}?invitacion=${encodeURIComponent(code)}`;
      }

      function renderLogin() {
        $("root").innerHTML = `
          <div style="min-height:100vh;display:grid;place-items:center;padding:20px">
            <div class="card" style="width:100%;max-width:400px;padding:32px">
              <div class="brand" style="justify-content:center;margin-bottom:20px"><div class="logo">K</div><div><h1>KLUBY</h1><span>Panel Publi</span></div></div>
              <label>Email</label><input id="email" />
              <label>Contraseña</label><input id="pass" type="password" />
              <button class="btn-full" onclick="login()">Ingresar</button>
              <div class="error" id="err"></div>
              <p class="hint" style="text-align:center;margin-top:14px">¿Tenés un código de equipo? <a href="/index.html" style="color:var(--accent)">Canjealo en la app</a></p>
            </div>
          </div>`;
      }

      async function login() {
        try {
          const d = await api("/users/login", { method: "POST", body: JSON.stringify({ email: $("email").value.trim(), password: $("pass").value }) });
          if (!["STAFF", "CLUB_ADMIN", "SUPER_ADMIN"].includes(d.user.role)) {
            $("err").textContent = "Esta pantalla es para publis del boliche.";
            return;
          }
          token = d.token; user = d.user;
          localStorage.setItem("kluby_publi_token", token);
          localStorage.setItem("kluby_publi_user", JSON.stringify(user));
          await bootstrap();
        } catch (e) { $("err").textContent = e.message; }
      }

      function logout() {
        token = ""; user = null; memberships = []; events = [];
        localStorage.removeItem("kluby_publi_token");
        localStorage.removeItem("kluby_publi_user");
        renderLogin();
      }

      async function bootstrap() {
        if (user.role === "STAFF") {
          memberships = await api("/users/me/memberships");
          if (!memberships.length) {
            toast("No tenés boliche asignado. Pedile un código al dueño.", "err");
            logout();
            return;
          }
        } else {
          const clubs = await api("/clubs");
          memberships = clubs.map((c) => ({ club: c, clubId: c.id }));
        }
        await loadEvents(memberships[0].club?.id || memberships[0].clubId);
        render();
      }

      async function loadEvents(clubId) {
        events = await api("/clubs/" + clubId + "/staff-events");
      }

      function render() {
        const clubId = memberships[0]?.club?.id || memberships[0]?.clubId;
        const clubName = memberships[0]?.club?.name || "Boliche";
        const clubSelect = memberships.length > 1
          ? `<label>Boliche</label><select id="club-sel" onchange="onClubChange()">${memberships.map((m) => `<option value="${m.club.id}">${esc(m.club.name)}</option>`).join("")}</select>`
          : `<p class="role-pill">${esc(clubName)}</p>`;

        $("root").innerHTML = `
          <div class="topbar">
            <div class="brand"><div class="logo">K</div><div><h1>KLUBY</h1><span>Invitaciones · Publi</span></div></div>
            <div class="right">
              <div class="who"><b>${esc(user.fullName)}</b><small>${user.role}</small></div>
              <a class="ghost btn-sm" href="/index.html" style="padding:8px 12px;border-radius:8px;border:1px solid var(--border);text-decoration:none">App cliente</a>
              <button class="ghost btn-sm" onclick="logout()">Salir</button>
            </div>
          </div>
          <div class="container" style="max-width:640px">
            ${clubSelect}
            <div class="section-title" style="margin-top:18px">Eventos</div>
            <div class="section-sub">Generá un link o código para invitar clientes a una noche.</div>
            <div id="events-list"><div class="empty">Cargando...</div></div>
          </div>`;
        if ($("club-sel")) $("club-sel").value = clubId;
        renderEvents(clubId);
      }

      async function onClubChange() {
        await loadEvents($("club-sel").value);
        renderEvents($("club-sel").value);
      }

      function renderEvents(clubId) {
        const el = $("events-list");
        if (!events.length) { el.innerHTML = '<div class="empty">No hay eventos próximos en este boliche.</div>'; return; }
        el.innerHTML = events.map((ev) => `
          <div class="card" style="padding:18px;margin-bottom:12px">
            <div class="row-between">
              <div><b>${esc(ev.name)}</b><br/><small>${fdt(ev.date)}${ev.musicGenre ? " · " + esc(ev.musicGenre) : ""}</small></div>
              <button type="button" class="btn-sm btn-accent" onclick="createInvite('${ev.id}')">Invitar</button>
            </div>
            <div id="inv-${ev.id}" style="margin-top:10px"></div>
          </div>`).join("");
      }

      async function createInvite(eventId) {
        try {
          const inv = await api("/events/" + eventId + "/invites", { method: "POST", body: JSON.stringify({ maxUses: 50, expiresInHours: 336 }) });
          const link = inviteLink(inv.code);
          const slot = document.getElementById("inv-" + eventId);
          if (slot) slot.innerHTML = `
            <div class="pick-row" style="margin-top:8px">
              <div style="min-width:0">
                <b>${esc(inv.code)}</b>
                <small style="display:block;word-break:break-all">${esc(link)}</small>
              </div>
              <button type="button" class="btn-sm ghost" onclick="copyInvite('${esc(inv.code)}','${esc(link)}')">Copiar link</button>
            </div>`;
          toast("Invitación creada", "ok");
        } catch (e) { toast(e.message, "err"); }
      }

      function copyInvite(code, link) {
        const text = link || code;
        navigator.clipboard?.writeText(text).then(() => toast("Link copiado", "ok")).catch(() => toast(text, "ok"));
      }

      if (token && user) bootstrap().catch(() => renderLogin());
      else renderLogin();
    </script>
  </body>
</html>
