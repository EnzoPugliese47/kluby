<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050508" />
    <title>Kluby · Ingresar</title>
    <link rel="stylesheet" href="/kluby.css" />
    <link rel="stylesheet" href="/kluby-public.css" />
  </head>
  <body>
    <div id="k-bg"></div>
    <div class="k-wrap">
      <div id="k-nav"></div>
      <main class="k-main">
        <div class="k-login-wrap">
          <div class="card k-login-card">
            <div class="brand">
              <img class="logo logo-lg" src="/brand/kluby-logo.png" width="72" height="72" alt="Kluby" />
              <div><h1 class="logo-text">KLUBY</h1><span>Acceso</span></div>
            </div>
            <p class="k-login-sub" id="login-sub">Un solo ingreso para clientes, dueños y equipo.</p>
            <div id="invite-banner" style="display:none" class="k-invite-banner"></div>
            <div id="plan-banner" style="display:none" class="k-invite-banner"></div>
            <div class="k-auth-tabs">
              <button type="button" id="tab-login" class="active" onclick="switchTab('login')">Ingresar</button>
              <button type="button" id="tab-reg" onclick="switchTab('reg')">Crear cuenta</button>
            </div>
            <div id="auth-form"></div>
            <div class="error" id="auth-err"></div>
            <details class="k-demo-box" id="demo-box">
              <summary>Acceso rápido</summary>
              <p class="k-demo-pass">Contraseña: <b>password123</b></p>
              <div class="k-demo-grid" id="demo-grid"></div>
            </details>
          </div>
          <p style="text-align:center;margin-top:20px;font-size:13px">
            <a href="/" style="color:var(--muted)">← Volver al inicio</a>
          </p>
        </div>
      </main>
      <div id="k-footer"></div>
    </div>
    <script src="/kluby-ui.js"></script>
    <script src="/kluby-offline.js"></script>
    <script>
      KlubyUI.mountPublicPage("");
      const UI = KlubyUI;
      const API = "/api";
      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const nextUrl = params.get("next") || "";
      const PLAN_LABELS = { BASIC: "Básico", PREMIUM: "Premium" };
      const PREMIUM_PRICE = 29900;

      function normalizeOwnerPlan(raw) {
        const v = (raw || "").trim().toUpperCase();
        return v === "PREMIUM" ? "PREMIUM" : "BASIC";
      }

      function getPendingOwnerPlan() {
        return normalizeOwnerPlan(localStorage.getItem("kluby_pending_owner_plan") || "BASIC");
      }

      function isOwnerSignup() {
        return localStorage.getItem("kluby_pending_owner_plan") !== null
          || params.get("owner") === "1";
      }

      function captureOwnerSignupFromUrl() {
        const owner = params.get("owner");
        const plan = params.get("plan");
        if (owner === "1" || plan) {
          localStorage.setItem("kluby_pending_owner_plan", normalizeOwnerPlan(plan));
          const q = new URLSearchParams();
          if (nextUrl) q.set("next", nextUrl);
          q.set("tab", "reg");
          history.replaceState({}, "", location.pathname + (q.toString() ? "?" + q : ""));
        }
      }

      function captureInviteFromUrl() {
        const inv = params.get("invitacion");
        const eq = params.get("equipo");
        if (inv) localStorage.setItem("kluby_pending_event", inv.trim());
        if (eq) localStorage.setItem("kluby_pending_equipo", eq.trim());
        if (inv || eq) {
          const q = new URLSearchParams();
          if (nextUrl) q.set("next", nextUrl);
          history.replaceState({}, "", location.pathname + (q.toString() ? "?" + q : ""));
        }
      }

      function renderPlanBanner() {
        const el = $("plan-banner");
        if (!isOwnerSignup()) { el.style.display = "none"; return; }
        const plan = getPendingOwnerPlan();
        const isPremium = plan === "PREMIUM";
        el.style.display = "block";
        el.innerHTML = `<b>Registro dueño de boliche</b><br/>Plan elegido: <b>${PLAN_LABELS[plan]}</b>${isPremium ? ` · $${PREMIUM_PRICE.toLocaleString("es-AR")}/mes + 2% comisión` : " · sin cuota · 4% comisión por mesa"}<br/><span class="hint">Completá el formulario para crear tu cuenta de dueño.</span>`;
        const sub = $("login-sub");
        if (sub) sub.textContent = "Creá tu cuenta de dueño y configurá tu boliche en el panel.";
      }

      function clearOwnerSignupIntent() {
        localStorage.removeItem("kluby_pending_owner_plan");
        renderPlanBanner();
      }

      function saveSession(data) {
        UI.clearRoleSessionData();
        localStorage.setItem("kluby_token", data.token);
        localStorage.setItem("kluby_user", JSON.stringify(data.user));
      }

      async function api(path, options = {}) {
        const token = localStorage.getItem("kluby_token") || "";
        const res = await fetch(API + path, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(token ? { Authorization: "Bearer " + token } : {}),
            ...(options.headers || {}),
          },
        });
        const json = await res.json().catch(() => ({ success: false, error: "Respuesta inválida" }));
        if (!res.ok || !json.success) throw new Error(UI.friendlyError(json.error || "Error " + res.status, res.status));
        return json.data;
      }

      function redirectAfterLogin(user) {
        location.href = UI.redirectAfterAuth(user, nextUrl);
      }

      async function redeemPendingInvites(user) {
        const eventCode = localStorage.getItem("kluby_pending_event");
        const teamCode = localStorage.getItem("kluby_pending_equipo");
        if (eventCode && user.role === "CLIENT") {
          try {
            await api("/invites/event/redeem", { method: "POST", body: JSON.stringify({ code: eventCode }) });
            localStorage.removeItem("kluby_pending_event");
          } catch { /* ignore */ }
        }
        if (teamCode) {
          try {
            const r = await api("/invites/club/redeem", { method: "POST", body: JSON.stringify({ code: teamCode }) });
            localStorage.removeItem("kluby_pending_equipo");
            if (r.token && r.user) {
              saveSession({ token: r.token, user: r.user });
              redirectAfterLogin(r.user);
              return true;
            }
          } catch { /* ignore */ }
        }
        return false;
      }

      async function renderInviteBanner() {
        const el = $("invite-banner");
        const eventCode = localStorage.getItem("kluby_pending_event");
        const teamCode = localStorage.getItem("kluby_pending_equipo");
        if (!eventCode && !teamCode) { el.style.display = "none"; return; }
        el.style.display = "block";
        if (eventCode) {
          try {
            const p = await fetch(API + "/invites/event/preview?code=" + encodeURIComponent(eventCode)).then((r) => r.json());
            if (p.success) {
              el.innerHTML = `<b>Te invitaron a un evento</b><br/>${UI.esc(p.data.club.name)} · ${UI.esc(p.data.event.name)} · ${UI.fdatetime(p.data.event.date)}<br/><span class="hint">Ingresá o creá cuenta para confirmar.</span>`;
              return;
            }
          } catch { /* ignore */ }
        }
        el.innerHTML = "<b>Tenés un código pendiente</b><br/>Ingresá o registrate para canjearlo.";
      }

      const DEMO_PASSWORD = "password123";
      const DEMO_ACCOUNTS = [
        { label: "Cliente", email: "anfitrion@kluby.com", hint: "Reservar mesa · Kluby Points" },
        { label: "Invitado 1", email: "invitado1@kluby.com", hint: "Mesa abierta / invitaciones" },
        { label: "Invitado 2", email: "invitado2@kluby.com", hint: "Mesa abierta / invitaciones" },
        { label: "Dueño Kora", email: "duenokluby1@kluby.com", hint: "Panel · estadísticas" },
        { label: "Puerta / QR", email: "puerta@kluby.com", hint: "Check-in y cierre de mesa" },
        { label: "Super admin", email: "admin@kluby.com", hint: "Todos los boliches" },
      ];

      function renderDemoAccounts() {
        const grid = $("demo-grid");
        if (!grid) return;
        grid.innerHTML = DEMO_ACCOUNTS.map((a) => `
          <button type="button" class="k-demo-btn" onclick="demoFill('${a.email.replace(/'/g, "\\'")}')">
            <span><b>${UI.esc(a.label)}</b><small>${UI.esc(a.email)} · ${UI.esc(a.hint)}</small></span>
            <span>Ingresar →</span>
          </button>`).join("");
      }

      async function demoFill(email) {
        $("auth-err").textContent = "";
        if ($("tab-reg")?.classList.contains("active")) switchTab("login");
        const emailEl = $("l-email");
        const passEl = $("l-pass");
        if (emailEl) emailEl.value = email;
        if (passEl) passEl.value = DEMO_PASSWORD;
        await submitLogin();
      }

      function switchTab(tab) {
        $("auth-err").textContent = "";
        $("auth-err").style.color = "";
        $("tab-login").classList.toggle("active", tab === "login");
        $("tab-reg").classList.toggle("active", tab === "reg");
        if (tab === "login") {
          $("auth-form").innerHTML = `
            <label>Email</label>
            <input id="l-email" type="email" placeholder="tu@email.com" autocomplete="email" />
            <label>Contraseña</label>
            <input id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password" />
            <button class="btn-full" onclick="submitLogin()">Ingresar</button>
            <div style="text-align:center;margin-top:12px">
              <a onclick="switchTab('forgot')" style="cursor:pointer;font-size:13px;color:var(--muted)">¿Olvidaste tu contraseña?</a>
            </div>`;
        } else if (tab === "forgot") {
          $("tab-login").classList.remove("active");
          $("tab-reg").classList.remove("active");
          $("auth-form").innerHTML = `
            <p class="hint" style="margin-bottom:8px">Te enviamos un enlace para restablecer la contraseña.</p>
            <label>Email</label>
            <input id="f-email" type="email" placeholder="tu@email.com" />
            <button class="btn-full" onclick="submitForgot()">Enviar enlace</button>
            <div id="reset-step" style="display:none;margin-top:16px">
              <div class="card" style="padding:14px;background:var(--surface-3)"><div class="hint" id="reset-note"></div></div>
              <label>Token de recuperación</label>
              <input id="r-token" placeholder="Pegá el token" />
              <label>Nueva contraseña (mín. 8)</label>
              <input id="r-newpass" type="password" />
              <button class="btn-full btn-accent" onclick="submitReset()">Cambiar contraseña</button>
            </div>
            <div style="text-align:center;margin-top:14px">
              <a onclick="switchTab('login')" style="cursor:pointer;font-size:13px">← Volver</a>
            </div>`;
        } else {
          const ownerReg = isOwnerSignup();
          $("auth-form").innerHTML = `
            ${ownerReg ? `<p class="hint" style="margin-bottom:12px">Te registrás como <b>dueño de boliche</b> con plan <b>${PLAN_LABELS[getPendingOwnerPlan()]}</b>.</p>` : ""}
            <label>Nombre completo</label>
            <input id="r-name" placeholder="Tu nombre" />
            <label>Email</label>
            <input id="r-email" type="email" placeholder="tu@email.com" />
            <label>Teléfono / celular</label>
            <input id="r-phone" type="tel" inputmode="tel" placeholder="11 1234 5678" />
            <p class="hint" style="margin-top:-4px">10 dígitos (ej. 11…) o +54 9 11… · Para contacto del boliche.</p>
            <label>Contraseña</label>
            <input id="r-pass" type="password" placeholder="Mín. 8 · letra y número" autocomplete="new-password" />
            <p class="hint" style="margin-top:-4px">Al menos 8 caracteres, una letra y un número.</p>
            <button class="btn-full btn-accent" onclick="submitRegister()">${ownerReg ? "Crear cuenta de dueño" : "Crear cuenta"}</button>
            ${ownerReg ? `<div style="text-align:center;margin-top:12px"><a onclick="clearOwnerSignupIntent();switchTab('reg')" style="cursor:pointer;font-size:13px;color:var(--muted)">Quiero registrarme como cliente</a></div>` : ""}`;
        }
      }

      async function submitLogin() {
        $("auth-err").textContent = "";
        try {
          const data = await api("/users/login", {
            method: "POST",
            body: JSON.stringify({ email: $("l-email").value.trim(), password: $("l-pass").value }),
          });
          saveSession(data);
          const redirected = await redeemPendingInvites(data.user);
          if (!redirected) redirectAfterLogin(data.user);
        } catch (e) { $("auth-err").textContent = UI.friendlyError(e.message); }
      }

      async function submitRegister() {
        $("auth-err").textContent = "";
        const phone = $("r-phone").value.trim();
        const pass = $("r-pass").value;
        const phoneErr = UI.validatePhone(phone);
        if (phoneErr) { $("auth-err").textContent = phoneErr; return; }
        const passErr = UI.validatePassword(pass);
        if (passErr) { $("auth-err").textContent = passErr; return; }
        try {
          const ownerReg = isOwnerSignup();
          const endpoint = ownerReg ? "/users/register-owner" : "/users/register";
          const payload = {
            fullName: $("r-name").value.trim(),
            email: $("r-email").value.trim(),
            phone,
            password: pass,
          };
          if (ownerReg) payload.clubPlan = getPendingOwnerPlan();
          const data = await api(endpoint, {
            method: "POST",
            body: JSON.stringify(payload),
          });
          if (ownerReg) localStorage.removeItem("kluby_pending_owner_plan");
          saveSession(data);
          const redirected = await redeemPendingInvites(data.user);
          if (!redirected) redirectAfterLogin(data.user);
        } catch (e) { $("auth-err").textContent = UI.friendlyError(e.message); }
      }

      async function submitForgot() {
        $("auth-err").textContent = "";
        try {
          const r = await api("/users/forgot-password", { method: "POST", body: JSON.stringify({ email: $("f-email").value.trim() }) });
          $("reset-step").style.display = "block";
          if (r.token) {
            $("r-token").value = r.token;
            $("reset-note").innerHTML = "Token de recuperación (vence en " + (r.expiresInMinutes || 60) + " min).";
          } else {
            $("reset-note").textContent = r.message;
          }
        } catch (e) { $("auth-err").textContent = UI.friendlyError(e.message); }
      }

      async function submitReset() {
        $("auth-err").textContent = "";
        const passErr = UI.validatePassword($("r-newpass").value);
        if (passErr) { $("auth-err").textContent = passErr; return; }
        try {
          await api("/users/reset-password", {
            method: "POST",
            body: JSON.stringify({ token: $("r-token").value.trim(), newPassword: $("r-newpass").value }),
          });
          switchTab("login");
          $("auth-err").style.color = "var(--accent)";
          $("auth-err").textContent = "Contraseña actualizada. Ya podés ingresar.";
        } catch (e) { $("auth-err").textContent = UI.friendlyError(e.message); }
      }

      captureInviteFromUrl();
      captureOwnerSignupFromUrl();
      const session = UI.getSession();
      if (session) {
        if (isOwnerSignup() && session.user.role === "CLIENT") {
          UI.clearSession();
          switchTab("reg");
          renderInviteBanner();
          renderPlanBanner();
          renderDemoAccounts();
        } else {
          redirectAfterLogin(session.user);
        }
      } else {
        if (params.get("tab") === "reg" || isOwnerSignup()) switchTab("reg");
        else switchTab("login");
        renderInviteBanner();
        renderPlanBanner();
        renderDemoAccounts();
      }
    </script>
  </body>
</html>
