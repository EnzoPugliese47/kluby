<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kluby · Reservá tu mesa VIP</title>
    <link rel="stylesheet" href="/kluby.css" />
    <style>
      /* Mapa 2D de mesas */
      .floor {
        position: relative; width: 100%; min-width: 640px; height: 360px;
        background:
          linear-gradient(180deg, #10101a, #0c0c14);
        border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
        background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.04) 1px, transparent 0);
        background-size: 22px 22px;
      }
      .floor-wrap { overflow-x: auto; padding-bottom: 8px; }
      .stage-label {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        background: var(--surface-3); color: var(--muted); padding: 4px 18px;
        border-radius: 999px; font-size: 11px; letter-spacing: 2px; font-weight: 700;
      }
      .table-node {
        position: absolute; width: 78px; height: 60px; border-radius: 12px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-size: 11px; font-weight: 700; cursor: pointer; padding: 4px; text-align: center;
        border: 1.5px solid transparent; transition: transform 0.1s; color: #fff;
      }
      .table-node small { font-weight: 600; opacity: 0.85; font-size: 10px; }
      .table-node:hover { transform: scale(1.06); }
      .table-node.available { background: rgba(45,226,198,0.14); border-color: var(--accent); color: var(--accent); }
      .table-node.reserved { background: rgba(255,92,108,0.13); border-color: var(--red); color: #ff9aa3; cursor: not-allowed; }
      .table-node.reserved:hover { transform: none; }
      .legend { display: flex; gap: 18px; margin: 14px 0; font-size: 13px; color: var(--muted); }
      .legend .dot { width: 11px; height: 11px; border-radius: 4px; display: inline-block; margin-right: 6px; vertical-align: middle; }

      /* Mapa con imagen de fondo (plano del salon) */
      .floor-map { position: relative; width: 100%; max-width: 560px; margin: 0 auto; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); background: #0c0c14; }
      .floor-map.default-canvas {
        aspect-ratio: 1725 / 2490;
        background: linear-gradient(180deg, #14141f, #0c0c14);
        border: 2px dashed var(--border);
        min-height: 200px;
      }
      .floor-map img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
      .canvas-label {
        position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
        font-size: 11px; color: var(--muted); pointer-events: none; z-index: 1;
        background: rgba(0,0,0,0.35); padding: 4px 10px; border-radius: 6px;
      }
      .table-pin {
        position: absolute; transform: translate(-50%, -50%);
        min-width: 26px; height: 26px; padding: 0 5px; border-radius: 7px;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 800; border: 2px solid; cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,0.5); transition: transform 0.1s;
      }
      .table-pin.available { background: rgba(45,226,198,0.92); border-color: #ffffff; color: #04201c; }
      .table-pin.reserved { background: rgba(255,92,108,0.88); border-color: rgba(255,255,255,0.6); color: #fff; cursor: not-allowed; }
      .table-pin.available:hover { transform: translate(-50%, -50%) scale(1.18); z-index: 3; }
      .sector-legend { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 0; font-size: 12px; color: var(--muted); justify-content: center; }

      .bottles-section { margin-top: 28px; }
      .bottles-section h3 { margin: 0 0 6px; font-size: 18px; }
      .bottles-section .section-sub { margin-bottom: 14px; }
      .bottles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
      .bottle-item {
        background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px;
        padding: 14px; display: flex; flex-direction: column; gap: 6px;
      }
      .bottle-item .bi-name { font-weight: 700; font-size: 14px; }
      .bottle-item .bi-cat { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
      .bottle-item .bi-desc { font-size: 12px; color: var(--muted); line-height: 1.4; flex: 1; }
      .bottle-item .bi-price { font-size: 17px; font-weight: 800; color: var(--accent); margin-top: 4px; }

      .reserve-info { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
      .reserve-info .stat { background: var(--surface-3); border-radius: 10px; padding: 10px 14px; }
      .reserve-info .stat small { display: block; color: var(--muted); font-size: 11px; }
      .reserve-info .stat b { font-size: 16px; }
      .pay-opt { display: flex; gap: 10px; margin-top: 8px; }
      .pay-opt .opt {
        flex: 1; border: 1.5px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer;
      }
      .pay-opt .opt.sel { border-color: var(--primary); background: rgba(124,92,255,0.08); }
      .pay-opt .opt b { display: block; font-size: 15px; }
      .pay-opt .opt small { color: var(--muted); }

      .ticket {
        text-align: center; padding: 10px;
      }
      .ticket .qr { background: #fff; padding: 12px; border-radius: 14px; display: inline-block; margin: 8px 0; }
      .ticket .code { font-family: monospace; font-size: 13px; color: var(--muted); word-break: break-all; }

      .list-card { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
      .list-card .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
      .list-card .title { font-size: 16px; font-weight: 700; }

      .contact-card {
        margin: 18px 0 24px; padding: 18px 20px;
        background: linear-gradient(135deg, rgba(45,226,198,0.08), rgba(45,226,198,0.02));
        border: 1px solid rgba(45,226,198,0.25);
      }
      .contact-card h4 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .3px; }
      .contact-card .contact-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 14px; }
      .contact-card .contact-row:last-child { margin-bottom: 0; }
      .contact-card .contact-row a { color: var(--text); text-decoration: none; }
      .contact-card .contact-row a:hover { color: var(--accent); text-decoration: underline; }
      .contact-card .contact-icon { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
      .meta { color: var(--muted); font-size: 13px; line-height: 1.6; }
      .amount-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; }
      .amount-row b { color: var(--text); }

      .club-card { overflow: hidden; cursor: pointer; }
      .club-cover {
        height: 110px; background: linear-gradient(135deg, #2a1d5e, #3a1d52);
        display: flex; align-items: flex-end; padding: 14px; font-size: 22px; font-weight: 800;
        overflow: hidden;
      }
      .club-cover.has-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .club-body { padding: 16px; }

      .user-avatar { border-radius: 50%; object-fit: cover; border: 2px solid var(--border); flex-shrink: 0; display: block; }
      .user-avatar.placeholder {
        display: inline-flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #2a1d5e, #3a1d52); font-weight: 800; color: #fff;
      }
      .profile-card { max-width: 480px; margin: 0 auto; padding: 28px; }
      .profile-avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 22px; }
      .profile-avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid var(--border); }
      .profile-avatar.placeholder { display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #2a1d5e, #3a1d52); color: #fff; }
      input.readonly-field { opacity: 0.7; cursor: not-allowed; background: var(--surface-3); }
      .topbar .right.profile-link { cursor: pointer; border-radius: 12px; padding: 4px 8px; transition: background .15s; }
      .topbar .right.profile-link:hover { background: var(--surface-3); }

      .profile-crop-modal { max-width: 420px !important; }
      .profile-crop-layout { display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
      .profile-crop-viewport {
        width: 280px; height: 280px; position: relative; overflow: hidden;
        background: #0a0a12; border-radius: 14px; border: 1px solid var(--border);
        cursor: grab; touch-action: none; flex-shrink: 0;
      }
      .profile-crop-viewport.dragging { cursor: grabbing; }
      .profile-crop-viewport img {
        position: absolute; left: 50%; top: 50%; transform-origin: center center;
        max-width: none; pointer-events: none; user-select: none; -webkit-user-drag: none;
      }
      .profile-crop-frame {
        position: absolute; inset: 16px; border: 2px solid var(--accent);
        box-shadow: 0 0 0 9999px rgba(0,0,0,0.58); border-radius: 12px;
        pointer-events: none; z-index: 2;
      }
      .profile-crop-side { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .profile-crop-preview {
        width: 88px; height: 88px; border-radius: 50%; overflow: hidden;
        border: 3px solid var(--border); background: var(--surface-3);
      }
      .profile-crop-preview canvas { display: block; width: 100%; height: 100%; }
      .profile-crop-zoom-row { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
      .profile-crop-zoom-row input[type=range] { flex: 1; accent-color: var(--accent); }
      .profile-crop-zoom-row span { font-size: 12px; color: var(--muted); min-width: 36px; text-align: right; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="modal-overlay" id="modal"><div class="card modal" id="modal-content"></div></div>
    <div class="toast" id="toast"></div>

    <script>
      const API = "/api";
      const state = {
        token: localStorage.getItem("kluby_token") || "",
        user: JSON.parse(localStorage.getItem("kluby_user") || "null"),
        view: "home",
        params: {},
      };

      // ---------- utils ----------
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const attr = (s) => esc(s).replace(/[\r\n]+/g, " ");
      function imgFallback(img) {
        img.style.display = "none";
        const fb = img.dataset.fallback;
        if (fb && img.parentElement) {
          img.parentElement.classList.remove("has-img");
          if (!img.parentElement.textContent.trim()) img.parentElement.appendChild(document.createTextNode(fb));
        }
      }
      const money = (n) => new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 }).format(Number(n) || 0);
      const fdate = (d) => new Date(d).toLocaleDateString("es-AR", { weekday: "short", day: "numeric", month: "short" });
      const fdatetime = (d) => new Date(d).toLocaleString("es-AR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

      let toastTimer;
      function toast(msg, kind = "") {
        const t = $("toast");
        t.textContent = msg;
        t.className = "toast show " + kind;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (t.className = "toast " + kind), 3200);
      }
      function openModal(html) { $("modal-content").innerHTML = html; $("modal").classList.add("open"); }
      function closeModal() {
        if (_pc?.blobUrl) URL.revokeObjectURL(_pc.blobUrl);
        _pc = null;
        $("modal-content").classList.remove("profile-crop-modal");
        $("modal").classList.remove("open");
      }
      $("modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });

      async function api(path, options = {}) {
        const res = await fetch(API + path, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(state.token ? { Authorization: "Bearer " + state.token } : {}),
            ...(options.headers || {}),
          },
        });
        const json = await res.json().catch(() => ({ success: false, error: "Respuesta invalida" }));
        if (res.status === 401 && state.token) { doLogout(); throw new Error("Sesion expirada"); }
        if (!res.ok || !json.success) throw new Error(json.error || "Error " + res.status);
        return json.data;
      }

      const statusBadge = (s) => {
        const map = {
          PENDING_PAYMENT: ["amber", "Pago pendiente"], CONFIRMED: ["green", "Confirmada"],
          CHECKED_IN: ["violet", "Ingresado"], COMPLETED: ["muted", "Finalizada"],
          CANCELLED: ["red", "Cancelada"], EXPIRED: ["muted", "Expirada"],
          REQUESTED: ["amber", "Pendiente aprobacion"], ACCEPTED_PENDING_PAYMENT: ["violet", "Aceptado · a pagar"],
          REJECTED: ["red", "Rechazado"],
        };
        const [cls, label] = map[s] || ["muted", s];
        return `<span class="badge ${cls}">${label}</span>`;
      };

      function avatarHtml(user, size = 36, cls = "user-avatar") {
        const initial = esc((user?.fullName || "U").charAt(0).toUpperCase());
        if (user?.profileImageUrl) {
          return `<img class="${cls}" style="width:${size}px;height:${size}px" src="${esc(user.profileImageUrl)}" alt="${attr(user.fullName)}" onerror="this.outerHTML='<span class=\\'${cls} placeholder\\' style=\\'width:${size}px;height:${size}px\\'>${initial}</span>'" />`;
        }
        return `<span class="${cls} placeholder" style="width:${size}px;height:${size}px">${initial}</span>`;
      }

      // ---------- auth ----------
      function saveSession(data) {
        state.token = data.token; state.user = data.user;
        localStorage.setItem("kluby_token", data.token);
        localStorage.setItem("kluby_user", JSON.stringify(data.user));
      }
      function captureInviteFromUrl() {
        const p = new URLSearchParams(location.search);
        const inv = p.get("invitacion");
        const eq = p.get("equipo");
        if (inv) localStorage.setItem("kluby_pending_event", inv.trim());
        if (eq) localStorage.setItem("kluby_pending_equipo", eq.trim());
        if (inv || eq) history.replaceState({}, "", location.pathname);
      }
      async function redeemPendingInvites() {
        const eventCode = localStorage.getItem("kluby_pending_event");
        const teamCode = localStorage.getItem("kluby_pending_equipo");
        if (eventCode && state.user?.role === "CLIENT") {
          try {
            const r = await api("/invites/event/redeem", { method: "POST", body: JSON.stringify({ code: eventCode }) });
            localStorage.removeItem("kluby_pending_event");
            toast(r.message, "ok");
            if (r.club?.id && r.event?.id) go("club", { clubId: r.club.id, eventId: r.event.id });
            return;
          } catch (e) { toast(e.message, "err"); }
        }
        if (teamCode && state.token) {
          try {
            const r = await api("/invites/club/redeem", { method: "POST", body: JSON.stringify({ code: teamCode }) });
            localStorage.removeItem("kluby_pending_equipo");
            if (r.token && r.user) {
              saveSession({ token: r.token, user: r.user });
            }
            toast(r.message, "ok");
            if (r.user?.role === "STAFF") { location.href = "/publi.html"; return; }
            if (r.user?.role === "PUERTA") { location.href = "/staff.html"; return; }
          } catch (e) { toast(e.message, "err"); }
        }
      }
      async function redeemEventCode(code) {
        const r = await api("/invites/event/redeem", { method: "POST", body: JSON.stringify({ code: code.trim() }) });
        toast(r.message, "ok");
        if (r.club?.id && r.event?.id) go("club", { clubId: r.club.id, eventId: r.event.id });
      }
      async function redeemTeamCode(code) {
        const r = await api("/invites/club/redeem", { method: "POST", body: JSON.stringify({ code: code.trim() }) });
        if (r.token && r.user) saveSession({ token: r.token, user: r.user });
        toast(r.message, "ok");
        if (r.user?.role === "STAFF") { location.href = "/publi.html"; return; }
        if (r.user?.role === "PUERTA") { location.href = "/staff.html"; return; }
        render();
      }
      function doLogout() {
        state.token = ""; state.user = null;
        localStorage.removeItem("kluby_token"); localStorage.removeItem("kluby_user");
        go("home");
      }

      function go(view, params = {}) { state.view = view; state.params = params; render(); window.scrollTo(0, 0); }

      // ---------- render shell ----------
      function render() {
        if (!state.token || !state.user) return renderAuth();
        const nav = [
          ["home", "Explorar"],
          ["invites", "Mis invitaciones"],
          ["open", "Mesas abiertas"],
          ["mine", "Mis reservas"],
          ["joins", "Mis postulaciones"],
          ["profile", "Mi perfil"],
        ].filter(([v]) => state.user.role === "CLIENT" || v !== "invites");
        const staffLinks = state.user.role === "STAFF"
          ? `<a class="ghost btn-sm" href="/publi.html" style="padding:8px 12px;border-radius:8px;border:1px solid var(--border);text-decoration:none;margin-right:8px">Panel publi</a>`
          : state.user.role === "PUERTA"
            ? `<a class="ghost btn-sm" href="/staff.html" style="padding:8px 12px;border-radius:8px;border:1px solid var(--border);text-decoration:none;margin-right:8px">Puerta</a>`
            : "";
        $("root").innerHTML = `
          <div class="topbar">
            <div class="brand"><div class="logo">K</div><div><h1>KLUBY</h1><span>Tu noche, tu mesa</span></div></div>
            <div class="nav">
              ${nav.map(([v, l]) => `<button class="navlink ${state.view === v ? "active" : ""}" onclick="go('${v}')">${l}</button>`).join("")}
            </div>
            <div class="right profile-link" onclick="go('profile')" title="Mi perfil">
              ${staffLinks}
              ${avatarHtml(state.user, 40)}
              <div class="who"><b>${esc(state.user.fullName)}</b><small>${esc(state.user.email)}</small></div>
              <button class="ghost btn-sm" onclick="event.stopPropagation();doLogout()">Salir</button>
            </div>
          </div>
          <div class="container" id="page"></div>`;
        const page = $("page");
        if (state.view === "home") renderHome(page);
        else if (state.view === "club") renderClub(page);
        else if (state.view === "event") renderEvent(page);
        else if (state.view === "mine") renderMine(page);
        else if (state.view === "open") renderOpen(page);
        else if (state.view === "joins") renderJoins(page);
        else if (state.view === "profile") renderProfile(page);
        else if (state.view === "invites") renderInvites(page);
        else if (state.view === "detail") renderDetail(page);
      }

      // ---------- AUTH view ----------
      function renderAuth() {
        $("root").innerHTML = `
          <div style="min-height:100vh;display:grid;place-items:center;padding:20px">
            <div class="card" style="width:100%;max-width:400px;padding:32px">
              <div class="brand" style="justify-content:center;margin-bottom:8px"><div class="logo">K</div><div><h1>KLUBY</h1><span>Reservá tu mesa VIP</span></div></div>
              <div class="nav" style="justify-content:center;margin:18px 0">
                <button class="navlink active" id="tab-login" onclick="switchTab('login')">Ingresar</button>
                <button class="navlink" id="tab-reg" onclick="switchTab('reg')">Crear cuenta</button>
              </div>
              <div id="auth-form"></div>
              <div id="invite-banner" style="margin-top:16px"></div>
            </div>
          </div>`;
        switchTab("login");
        renderInviteBanner();
      }
      async function renderInviteBanner() {
        const el = document.getElementById("invite-banner");
        if (!el) return;
        const eventCode = localStorage.getItem("kluby_pending_event");
        const teamCode = localStorage.getItem("kluby_pending_equipo");
        if (!eventCode && !teamCode) { el.innerHTML = ""; return; }
        if (eventCode) {
          try {
            const p = await fetch(API + "/invites/event/preview?code=" + encodeURIComponent(eventCode)).then((r) => r.json());
            if (p.success) {
              el.innerHTML = `<div class="card" style="padding:14px;background:var(--surface-3);border-color:var(--accent)"><b>Te invitaron a un evento</b><br/><small>${esc(p.data.club.name)} · ${esc(p.data.event.name)} · ${fdatetime(p.data.event.date)}</small><br/><span class="hint">Ingresá o creá cuenta para confirmar.</span></div>`;
              return;
            }
          } catch { /* ignore */ }
        }
        el.innerHTML = `<div class="card" style="padding:14px;background:var(--surface-3)"><b>Tenés un código pendiente</b><br/><span class="hint">Ingresá o registrate para canjearlo.</span></div>`;
      }
      function switchTab(tab) {
        $("tab-login").classList.toggle("active", tab === "login");
        $("tab-reg").classList.toggle("active", tab === "reg");
        if (tab === "login") {
          $("auth-form").innerHTML = `
            <label>Email</label><input id="l-email" type="email" value="anfitrion@kluby.com" />
            <label>Contraseña</label><input id="l-pass" type="password" value="password123" />
            <button class="btn-full" onclick="submitLogin()">Ingresar</button>
            <div style="text-align:center;margin-top:12px"><a onclick="switchTab('forgot')" style="cursor:pointer;font-size:13px">¿Olvidaste tu contraseña?</a></div>
            <div class="error" id="auth-err"></div>
            <p class="hint" style="text-align:center;margin-top:16px">Demo cliente: anfitrion@kluby.com / password123<br/>Admin: <a href="/panel.html">panel de estadísticas</a></p>`;
        } else if (tab === "forgot") {
          $("tab-login").classList.remove("active"); $("tab-reg").classList.remove("active");
          $("auth-form").innerHTML = `
            <p class="hint" style="margin-bottom:6px">Ingresá tu email y te daremos un enlace para crear una nueva contraseña.</p>
            <label>Email</label><input id="f-email" type="email" placeholder="vos@email.com" value="anfitrion@kluby.com" />
            <button class="btn-full" onclick="submitForgot()">Enviar enlace</button>
            <div id="reset-step" style="display:none">
              <div class="spacer"></div>
              <div class="card" style="padding:14px;background:var(--surface-3)"><div class="hint" id="reset-note"></div></div>
              <label>Token de recuperación</label><input id="r-token" placeholder="Pegá el token" />
              <label>Nueva contraseña (mín. 8)</label><input id="r-newpass" type="password" placeholder="••••••••" />
              <button class="btn-full btn-accent" onclick="submitReset()">Cambiar contraseña</button>
            </div>
            <div style="text-align:center;margin-top:14px"><a onclick="switchTab('login')" style="cursor:pointer;font-size:13px">← Volver a ingresar</a></div>
            <div class="error" id="auth-err"></div>`;
        } else {
          $("auth-form").innerHTML = `
            <label>Nombre completo</label><input id="r-name" placeholder="Tu nombre" />
            <label>Email</label><input id="r-email" type="email" placeholder="vos@email.com" />
            <label>Teléfono</label><input id="r-phone" placeholder="11 1234 5678" />
            <p class="hint" style="margin-top:-4px">Lo compartís con el anfitrión y la mesa cuando pedís sumarte a una Mesa Abierta.</p>
            <label>Contraseña (mín. 8)</label><input id="r-pass" type="password" placeholder="••••••••" />

            <div class="error" id="auth-err"></div>`;
        }
      }
      async function submitLogin() {
        try {
          const data = await api("/users/login", { method: "POST", body: JSON.stringify({ email: $("l-email").value.trim(), password: $("l-pass").value }) });
          saveSession(data);
          await redeemPendingInvites();
          go("home");
        } catch (e) { $("auth-err").textContent = e.message; }
      }
      async function submitForgot() {
        try {
          const r = await api("/users/forgot-password", { method: "POST", body: JSON.stringify({ email: $("f-email").value.trim() }) });
          $("reset-step").style.display = "block";
          if (r.token) {
            $("r-token").value = r.token;
            $("reset-note").innerHTML = "🔐 <b>Modo demo:</b> normalmente este token llega por email. Te lo autocompletamos para que pruebes (vence en " + (r.expiresInMinutes || 60) + " min).";
          } else {
            $("reset-note").textContent = r.message;
          }
          toast("Revisá el enlace de recuperación", "ok");
        } catch (e) { $("auth-err").textContent = e.message; }
      }
      async function submitReset() {
        try {
          await api("/users/reset-password", { method: "POST", body: JSON.stringify({ token: $("r-token").value.trim(), newPassword: $("r-newpass").value }) });
          toast("¡Contraseña actualizada! Ya podés ingresar.", "ok");
          switchTab("login");
        } catch (e) { $("auth-err").textContent = e.message; }
      }
      async function submitRegister() {
        try {
          const phone = $("r-phone").value.trim();
          if (phone.replace(/\D/g, "").length < 6) { $("auth-err").textContent = "Ingresá un teléfono válido (mínimo 6 dígitos)."; return; }
          const body = { fullName: $("r-name").value.trim(), email: $("r-email").value.trim(), phone, password: $("r-pass").value };
          const data = await api("/users/register", { method: "POST", body: JSON.stringify(body) });
          saveSession(data);
          await redeemPendingInvites();
          toast("¡Cuenta creada! Bienvenido/a", "ok");
          go("home");
        } catch (e) { $("auth-err").textContent = e.message; }
      }

      // ---------- HOME (clubs) ----------
      async function renderHome(page) {
        page.innerHTML = `
          <div class="section-title">Explorá boliches</div>
          <div class="section-sub">Elegí un local, una fecha y reservá tu mesa desde el mapa.</div>
          <div class="row-between" style="margin-bottom:18px">
            <input id="q" placeholder="Buscar por nombre..." style="max-width:320px" oninput="debouncedClubs()" />
            <input id="genre" placeholder="Filtrar por género musical" style="max-width:260px" oninput="debouncedClubs()" />
          </div>
          <div id="clubs"><div class="empty">Cargando...</div></div>`;
        loadClubs();
      }
      let clubsTimer;
      function debouncedClubs() { clearTimeout(clubsTimer); clubsTimer = setTimeout(loadClubs, 300); }
      async function loadClubs() {
        const q = $("q")?.value.trim() || ""; const g = $("genre")?.value.trim() || "";
        const qs = new URLSearchParams(); if (q) qs.set("search", q); if (g) qs.set("genre", g);
        try {
          const clubs = await api("/clubs" + (qs.toString() ? "?" + qs : ""));
          const el = $("clubs"); if (!el) return;
          if (!clubs.length) { el.innerHTML = `<div class="empty">No se encontraron boliches.</div>`; return; }
          el.className = "grid-cards";
          el.innerHTML = clubs.map((c) => `
            <div class="card club-card" onclick="go('club',{id:'${c.id}'})">
              <div class="club-cover${c.imageUrl ? " has-img" : ""}">${c.imageUrl ? `<img src="${esc(c.imageUrl)}" alt="${attr(c.name)}" data-fallback="${attr(c.name)}" onerror="imgFallback(this)" />` : esc(c.name)}</div>
              <div class="club-body">
                <div class="meta">📍 ${esc(c.address)}, ${esc(c.city)}</div>
                ${c.musicGenre ? `<div class="chips" style="margin-top:8px"><span class="badge violet">${esc(c.musicGenre)}</span></div>` : ""}
              </div>
            </div>`).join("");
        } catch (e) { toast(e.message, "err"); }
      }

      // ---------- CLUB (events) ----------
      async function renderClub(page) {
        page.innerHTML = `<div class="empty">Cargando...</div>`;
        try {
          const club = await api("/clubs/" + state.params.id);
          const events = (club.events || []).filter((e) => e.isActive);
          page.innerHTML = `
            <button class="ghost btn-sm" onclick="go('home')">← Volver</button>
            <div class="section-title" style="margin-top:14px">${esc(club.name)}</div>
            <div class="section-sub">📍 ${esc(club.address)}, ${esc(club.city)} ${club.musicGenre ? "· 🎵 " + esc(club.musicGenre) : ""}</div>
            ${club.description ? `<p class="meta" style="margin-bottom:20px">${esc(club.description)}</p>` : ""}
            ${club.contactEmail ? `
            <div class="card contact-card">
              <h4>Contacto</h4>
              <div class="contact-row">
                <span class="contact-icon">✉️</span>
                <a href="mailto:${esc(club.contactEmail)}">${esc(club.contactEmail)}</a>
              </div>
              ${club.contactPhone ? `
              <div class="contact-row">
                <span class="contact-icon">📞</span>
                <a href="tel:${esc(club.contactPhone.replace(/\s/g, ""))}">${esc(club.contactPhone)}</a>
              </div>` : ""}
            </div>` : ""}
            <h3 style="margin:10px 0 14px">Próximas fechas</h3>
            <div id="events" class="grid-cards"></div>`;
          const fut = events.filter((e) => new Date(e.date) >= new Date(Date.now() - 6 * 3600 * 1000)).sort((a, b) => new Date(a.date) - new Date(b.date));
          const list = fut.length ? fut : events;
          $("events").innerHTML = list.length ? list.map((e) => `
            <div class="card list-card">
              <div class="title">${esc(e.name)}</div>
              <div class="meta">🗓️ ${fdatetime(e.date)} ${e.musicGenre ? "· " + esc(e.musicGenre) : ""}</div>
              <button class="btn-sm" onclick="go('event',{id:'${e.id}',club:'${club.id}'})">Ver mapa de mesas</button>
            </div>`).join("") : `<div class="empty">Este boliche aún no tiene fechas publicadas.</div>`;
        } catch (e) { page.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
      }

      // ---------- EVENT (table map + reserve) ----------
      async function renderEvent(page) {
        page.innerHTML = `<div class="empty">Cargando mapa...</div>`;
        try {
          const [data, products] = await Promise.all([
            api("/events/" + state.params.id + "/availability"),
            api("/events/" + state.params.id + "/products").catch(() => []),
          ]);
          window._tables = data.tables;
          const header = `
            <button class="ghost btn-sm" onclick="go('club',{id:'${state.params.club}'})">← Volver</button>
            <div class="section-title" style="margin-top:14px">${esc(data.event.name)}</div>
            <div class="section-sub">🗓️ ${fdatetime(data.event.date)} · Tocá una mesa disponible para reservar</div>
            <div class="legend">
              <span><span class="dot" style="background:var(--accent)"></span>Disponible</span>
              <span><span class="dot" style="background:var(--red)"></span>Reservada</span>
            </div>`;

          const pinHtml = (t) => {
            const short = String(t.label).split(" ").pop();
            const av = t.status === "AVAILABLE";
            return `<div class="table-pin ${av ? "available" : "reserved"}"
                 style="left:${t.posX}%;top:${t.posY}%"
                 title="${esc(t.label)} · ${t.capacity}p · ${money(t.price)}${av ? "" : " · Reservada"}"
                 ${av ? `onclick="openReserve('${t.id}')"` : ""}>${esc(short)}</div>`;
          };
          const pins = data.tables.map(pinHtml).join("");
          const sectors = [...new Set(data.tables.map((t) => t.sector).filter(Boolean))];
          const mapBlock = data.event.backgroundImage
            ? `<div class="floor-map"><img src="${esc(data.event.backgroundImage)}" alt="Plano del salón" onerror="this.style.display='none'" />${pins}</div>`
            : `<div class="floor-map default-canvas"><span class="canvas-label">Espacio del salón · 1725 × 2490</span>${pins}</div>`;
          const emptyHint = data.tables.length === 0
            ? `<div class="empty" style="margin-top:14px">Todavía no hay mesas en este evento.</div>`
            : `<div class="sector-legend">${sectors.map((s) => `<span>📍 ${esc(s)}</span>`).join("")}</div>`;

          const bottlesBlock = renderBottlesSection(products);
          page.innerHTML = header + mapBlock + emptyHint + bottlesBlock;
        } catch (e) { page.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
      }
      function renderBottlesGrid(products) {
        let html = `<div class="bottles-grid">`;
        let lastCat = null;
        for (const p of products) {
          const cat = p.category || "General";
          if (cat !== lastCat) {
            html += `<div style="grid-column:1/-1;font-size:12px;color:var(--muted);font-weight:700;margin:${lastCat ? "10px" : "0"} 0 4px;text-transform:uppercase;letter-spacing:.5px">🍾 ${esc(cat)}</div>`;
            lastCat = cat;
          }
          html += `<div class="bottle-item">
            <div class="bi-name">${esc(p.name)}</div>
            ${p.description ? `<div class="bi-desc">${esc(p.description)}</div>` : ""}
            <div class="bi-price">${money(p.price)}</div>
          </div>`;
        }
        html += "</div>";
        return html;
      }
      function renderBottlesSection(products) {
        if (!products.length) return "";
        return `<div class="bottles-section"><h3>Carta de botellas</h3><p class="section-sub">Precios para este evento</p>${renderBottlesGrid(products)}</div>`;
      }
      async function openBottleMenu(eventId, eventName) {
        openModal('<div class="empty">Cargando carta...</div>');
        try {
          const products = await api("/events/" + eventId + "/products");
          if (!products.length) {
            openModal(`
              <h3>Carta de botellas</h3>
              <p class="sub">${esc(eventName)}</p>
              <div class="empty">Todavía no hay botellas cargadas para este evento.</div>
              <button class="btn-full ghost" style="margin-top:16px" onclick="closeModal()">Cerrar</button>`);
            return;
          }
          openModal(`
            <h3>Carta de botellas</h3>
            <p class="sub">${esc(eventName)} · Precios del evento</p>
            ${renderBottlesGrid(products)}
            <button class="btn-full ghost" style="margin-top:16px" onclick="closeModal()">Cerrar</button>`);
        } catch (e) {
          openModal(`<div class="empty">${esc(e.message)}</div><button class="btn-full ghost" onclick="closeModal()">Cerrar</button>`);
        }
      }

      let _reserveSel = "DEPOSIT_ONLY";
      function openReserve(tableId) {
        const t = (window._tables || []).find((x) => x.id === tableId);
        if (!t) return;
        const deposit = Math.round(Number(t.price) * (t.depositPercent / 100));
        _reserveSel = "DEPOSIT_ONLY";
        openModal(`
          <h3>Reservar ${esc(t.label)}</h3>
          <p class="hint">${esc(t.sector || "")} · Capacidad ${t.capacity} personas</p>
          <div class="reserve-info">
            <div class="stat"><small>Precio total</small><b>${money(t.price)}</b></div>
            <div class="stat"><small>Seña (${t.depositPercent}%)</small><b>${money(deposit)}</b></div>
          </div>
          <label>¿Cómo querés pagar?</label>
          <div class="pay-opt">
            <div class="opt sel" id="opt-dep" onclick="selPay('DEPOSIT_ONLY')"><b>Seña</b><small>${money(deposit)} ahora, resto en el local</small></div>
            <div class="opt" id="opt-full" onclick="selPay('FULL_PAYMENT')"><b>Total</b><small>${money(t.price)} ahora</small></div>
          </div>
          <div class="btn-row" style="margin-top:22px">
            <button class="ghost" onclick="closeModal()">Cancelar</button>
            <button id="reserve-btn" style="flex:1" onclick="confirmReserve('${t.id}')">Confirmar y pagar</button>
          </div>
          <div class="error" id="reserve-err"></div>`);
      }
      function selPay(opt) {
        _reserveSel = opt;
        $("opt-dep").classList.toggle("sel", opt === "DEPOSIT_ONLY");
        $("opt-full").classList.toggle("sel", opt === "FULL_PAYMENT");
      }
      async function confirmReserve(tableId) {
        const btn = $("reserve-btn"); btn.disabled = true; btn.textContent = "Procesando...";
        try {
          const r = await api("/reservations", { method: "POST", body: JSON.stringify({
            eventId: state.params.id, tableId, hostId: state.user.id, paymentOption: _reserveSel, mode: "STANDARD",
          }) });
          const paid = await api("/reservations/" + r.id + "/pay", { method: "POST", body: JSON.stringify({ provider: "demo" }) });
          showTicket(paid);
        } catch (e) { $("reserve-err").textContent = e.message; btn.disabled = false; btn.textContent = "Confirmar y pagar"; }
      }
      function showTicket(r) {
        const qr = "https://api.qrserver.com/v1/create-qr-code/?size=190x190&data=" + encodeURIComponent(r.code);
        openModal(`
          <div class="ticket">
            <h3>¡Reserva confirmada! 🎉</h3>
            <p class="hint">${esc(r.table.label)} · ${fdate(r.event.date)}</p>
            <div class="qr"><img src="${qr}" alt="${esc(r.code)}" width="190" height="190" /></div>
            <p class="code">${esc(r.code)}</p>
            <p class="hint">Mostrá este QR en la puerta. Pagado: <b>${money(r.amountPaid)}</b></p>
            <button class="btn-full" onclick="closeModal();go('mine')">Ver mis reservas</button>
          </div>`);
      }

      // ---------- MY RESERVATIONS ----------
      async function renderMine(page) {
        page.innerHTML = `<div class="section-title">Mis reservas</div><div class="section-sub">Gestioná tus mesas, abrilas a la comunidad o mostrá tu QR.</div><div id="list"><div class="empty">Cargando...</div></div><div id="past-wrap"></div>`;
        try {
          const rs = await api("/users/" + state.user.id + "/reservations");
          const now = Date.now();
          const upcoming = rs.filter((r) => new Date(r.event.date).getTime() >= now)
            .sort((a, b) => new Date(a.event.date) - new Date(b.event.date));
          const past = rs.filter((r) => new Date(r.event.date).getTime() < now)
            .sort((a, b) => new Date(b.event.date) - new Date(a.event.date));

          const el = $("list");
          if (!upcoming.length) {
            el.className = "";
            el.innerHTML = `<div class="empty">No tenés reservas para próximos eventos. ¡Explorá boliches!</div>`;
          } else {
            el.className = "grid-cards";
            el.innerHTML = upcoming.map(upcomingCard).join("");
          }
          renderPast(past);
        } catch (e) { toast(e.message, "err"); }
      }
      function upcomingCard(r) {
        const actions = [];
        if (r.status === "PENDING_PAYMENT") actions.push(`<button class="btn-sm" onclick="payReservation('${r.id}')">Pagar seña</button>`);
        if (r.status === "CONFIRMED" && r.mode === "STANDARD") actions.push(`<button class="btn-sm btn-accent" onclick="openTableModal('${r.id}',${r.table.capacity})">Abrir mesa 👥</button>`);
        if (r.mode === "OPEN_TABLE") actions.push(`<button class="btn-sm" onclick="go('detail',{id:'${r.id}'})">Invitados</button>`);
        if (r.status === "CONFIRMED" || r.status === "CHECKED_IN") actions.push(`<button class="btn-sm ghost" onclick="showTicketById('${r.id}')">Ver QR</button>`);
        actions.push(`<button class="btn-sm ghost" onclick='openBottleMenu(${JSON.stringify(r.event.id)}, ${JSON.stringify(r.event.name)})'>Ver carta 🍾</button>`);
        if (r.status === "PENDING_PAYMENT" || r.status === "CONFIRMED") actions.push(`<button class="btn-sm btn-danger" onclick="cancelReservation('${r.id}')">Cancelar</button>`);
        return `<div class="card list-card">
          <div class="head"><div class="title">${esc(r.table.label)}</div>${statusBadge(r.status)}</div>
          <div class="meta">🏢 ${esc(r.club.name)}<br/>🗓️ ${fdatetime(r.event.date)}${r.mode === "OPEN_TABLE" ? `<br/>👥 Mesa abierta (${r.maxGuests} cupos)` : ""}</div>
          <div class="amount-row"><span>Total: <b>${money(r.totalAmount)}</b></span><span>Pagado: <b>${money(r.amountPaid)}</b></span></div>
          <div class="btn-row">${actions.join("")}</div>
        </div>`;
      }
      function renderPast(past) {
        const wrap = $("past-wrap");
        if (!past.length) { wrap.innerHTML = ""; return; }
        if (!state.showPast) {
          wrap.innerHTML = `<div style="text-align:center;margin-top:22px"><button class="ghost btn-sm" onclick="state.showPast=true;renderMine($('page'))">Ver eventos pasados (${past.length})</button></div>`;
          return;
        }
        const cards = past.map((r) => `<div class="card list-card" style="opacity:.7">
            <div class="head"><div class="title">${esc(r.table.label)}</div><span class="badge muted">Finalizado</span></div>
            <div class="meta">🗓️ ${fdatetime(r.event.date)}</div>
          </div>`).join("");
        wrap.innerHTML = `<div class="section-sub" style="margin-top:26px;display:flex;justify-content:space-between;align-items:center"><span>Eventos pasados</span><button class="ghost btn-sm" onclick="state.showPast=false;renderMine($('page'))">Ocultar</button></div><div class="grid-cards">${cards}</div>`;
      }
      async function payReservation(id) {
        try { await api("/reservations/" + id + "/pay", { method: "POST", body: JSON.stringify({ provider: "demo" }) }); toast("¡Pago confirmado!", "ok"); renderMine($("page")); }
        catch (e) { toast(e.message, "err"); }
      }
      async function cancelReservation(id) {
        if (!confirm("¿Seguro que querés cancelar esta reserva?")) return;
        try { const r = await api("/reservations/" + id + "/cancel", { method: "POST" }); toast("Reserva cancelada. Reembolso: " + r.refundPercent + "%", "ok"); renderMine($("page")); }
        catch (e) { toast(e.message, "err"); }
      }
      async function showTicketById(id) {
        try { const r = await api("/reservations/" + id); showTicket(r); } catch (e) { toast(e.message, "err"); }
      }
      function openTableModal(id, capacity) {
        openModal(`
          <h3>Abrir mesa a la comunidad</h3>
          <p class="hint">Otros usuarios podrán pedir sumarse y dividir el costo. Vos aprobás quién entra.</p>
          <label>Cupos totales (vos + invitados, máx ${capacity})</label>
          <input id="max-guests" type="number" min="2" max="${capacity}" value="${Math.min(4, capacity)}" />
          <div class="btn-row" style="margin-top:20px">
            <button class="ghost" onclick="closeModal()">Cancelar</button>
            <button style="flex:1" onclick="confirmOpen('${id}')">Abrir mesa</button>
          </div>
          <div class="error" id="open-err"></div>`);
      }
      async function confirmOpen(id) {
        try {
          const max = parseInt($("max-guests").value, 10);
          await api("/reservations/" + id + "/open", { method: "POST", body: JSON.stringify({ maxGuests: max }) });
          closeModal(); toast("¡Mesa abierta! Ya aparece en el muro.", "ok"); renderMine($("page"));
        } catch (e) { $("open-err").textContent = e.message; }
      }

      // ---------- RESERVATION DETAIL (host manages guests) ----------
      async function renderDetail(page) {
        page.innerHTML = `<div class="empty">Cargando...</div>`;
        try {
          const r = await api("/reservations/" + state.params.id);
          const guests = await api("/reservations/" + state.params.id + "/guests");
          const share = r.maxGuests ? money(Number(r.totalAmount) / r.maxGuests) : "-";
          page.innerHTML = `
            <button class="ghost btn-sm" onclick="go('mine')">← Volver</button>
            <div class="section-title" style="margin-top:14px">${esc(r.table.label)} · Mesa abierta</div>
            <div class="section-sub">🗓️ ${fdatetime(r.event.date)} · ${r.maxGuests} cupos · Parte por persona: <b>${share}</b></div>
            <h3 style="margin:8px 0 14px">Postulaciones</h3>
            <div id="guests" class="grid-cards"></div>`;
          const el = $("guests");
          if (!guests.length) { el.innerHTML = `<div class="empty">Todavía nadie se postuló a tu mesa.</div>`; return; }
          el.innerHTML = guests.map((g) => {
            const acts = [];
            if (g.status === "REQUESTED") {
              acts.push(`<button class="btn-sm btn-accent" onclick="guestAction('${g.id}','accept')">Aceptar</button>`);
              acts.push(`<button class="btn-sm btn-danger" onclick="guestAction('${g.id}','reject')">Rechazar</button>`);
            }
            const contact = `<br/>📧 ${esc(g.user.email)}${g.user.phone ? `<br/>📱 ${esc(g.user.phone)}` : ""}`;
            return `<div class="card list-card">
              <div class="head"><div class="title">${esc(g.user.fullName)}</div>${statusBadge(g.status)}</div>
              <div class="meta">Parte: <b>${money(g.shareAmount)}</b>${contact}</div>
              <div class="btn-row">${acts.join("") || '<span class="hint">Sin acciones</span>'}</div>
            </div>`;
          }).join("");
        } catch (e) { page.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
      }
      async function guestAction(guestId, action) {
        try { await api("/guests/" + guestId + "/" + action, { method: "POST" }); toast(action === "accept" ? "Invitado aceptado" : "Postulación rechazada", "ok"); renderDetail($("page")); }
        catch (e) { toast(e.message, "err"); }
      }

      // ---------- OPEN TABLES WALL ----------
      async function renderOpen(page) {
        page.innerHTML = `<div class="section-title">Mesas abiertas</div><div class="section-sub">Sumate a una mesa y dividí el costo. El anfitrión aprueba tu ingreso.</div><div id="wall"><div class="empty">Cargando...</div></div>`;
        try {
          const wall = await api("/reservations/open");
          const el = $("wall");
          if (!wall.length) { el.innerHTML = `<div class="empty">No hay mesas abiertas por ahora.</div>`; return; }
          el.className = "grid-cards";
          el.innerHTML = wall.map((w) => `
            <div class="card list-card">
              <div class="head"><div class="title">${esc(w.table.label)}</div><span class="badge green">${w.availableSlots} cupos</span></div>
              <div class="meta">🏢 ${esc(w.club.name)}<br/>🗓️ ${fdatetime(w.event.date)}<br/>👤 Anfitrión: ${esc(w.host.fullName)}</div>
              <div class="amount-row"><span>Tu parte: <b>${money(w.sharePerPerson)}</b></span></div>
              ${w.host.id === state.user.id ? '<span class="hint">Es tu mesa</span>' : `<button class="btn-sm" onclick="joinTable('${w.reservationId}')">Pedir sumarme</button>`}
            </div>`).join("");
        } catch (e) { toast(e.message, "err"); }
      }
      async function joinTable(reservationId) {
        try { await api("/reservations/" + reservationId + "/guests", { method: "POST", body: JSON.stringify({ userId: state.user.id }) }); toast("¡Postulación enviada! Esperá la aprobación.", "ok"); go("joins"); }
        catch (e) { toast(e.message, "err"); }
      }

      // ---------- MY JOINS ----------
      async function renderJoins(page) {
        page.innerHTML = `<div class="section-title">Mis postulaciones</div><div class="section-sub">Seguí el estado de las mesas a las que pediste sumarte.</div><div id="list"><div class="empty">Cargando...</div></div>`;
        try {
          const entries = await api("/users/" + state.user.id + "/guest-entries");
          const el = $("list");
          if (!entries.length) { el.innerHTML = `<div class="empty">No te postulaste a ninguna mesa. Mirá el muro de <a onclick="go('open')">mesas abiertas</a>.</div>`; return; }
          el.className = "grid-cards";
          el.innerHTML = entries.map((g) => {
            const r = g.reservation;
            const act = g.status === "ACCEPTED_PENDING_PAYMENT" ? `<button class="btn-sm btn-accent" onclick="payShare('${g.id}')">Pagar mi parte (${money(g.shareAmount)})</button>` : "";
            return `<div class="card list-card">
              <div class="head"><div class="title">${esc(r.table.label)}</div>${statusBadge(g.status)}</div>
              <div class="meta">🏢 ${esc(r.club.name)}<br/>🗓️ ${fdatetime(r.event.date)}<br/>👤 ${esc(r.host.fullName)}</div>
              <div class="amount-row"><span>Tu parte: <b>${money(g.shareAmount)}</b></span></div>
              <div class="btn-row">${act}</div>
            </div>`;
          }).join("");
        } catch (e) { toast(e.message, "err"); }
      }
      async function payShare(guestId) {
        try { await api("/guests/" + guestId + "/pay", { method: "POST", body: JSON.stringify({ provider: "demo" }) }); toast("¡Pago confirmado! Ya sos parte de la mesa.", "ok"); renderJoins($("page")); }
        catch (e) { toast(e.message, "err"); }
      }

      // ---------- MI PERFIL ----------
      let _profileImage = null;
      const PROFILE_CROP = { size: 280, output: 400, frame: 248, zoomMin: 1, zoomMax: 3 };
      let _pc = null;

      function profileCropClamp() {
        if (!_pc) return;
        const s = _pc.baseScale * _pc.zoom;
        const dw = _pc.nw * s;
        const dh = _pc.nh * s;
        const maxX = Math.max(0, (dw - _pc.frame) / 2);
        const maxY = Math.max(0, (dh - _pc.frame) / 2);
        _pc.panX = Math.min(maxX, Math.max(-maxX, _pc.panX));
        _pc.panY = Math.min(maxY, Math.max(-maxY, _pc.panY));
      }

      function profileCropDraw(ctx, destSize) {
        const s = _pc.baseScale * _pc.zoom;
        const srcSize = _pc.frame / s;
        const srcX = _pc.nw / 2 - srcSize / 2 - _pc.panX / s;
        const srcY = _pc.nh / 2 - srcSize / 2 - _pc.panY / s;
        ctx.drawImage(_pc.image, srcX, srcY, srcSize, srcSize, 0, 0, destSize, destSize);
      }

      function profileCropUpdate() {
        if (!_pc?.imgEl) return;
        const s = _pc.baseScale * _pc.zoom;
        _pc.imgEl.style.transform = `translate(calc(-50% + ${_pc.panX}px), calc(-50% + ${_pc.panY}px)) scale(${s})`;
        const prev = document.getElementById("profile-crop-preview-cv");
        if (prev) {
          const pctx = prev.getContext("2d");
          pctx.clearRect(0, 0, prev.width, prev.height);
          profileCropDraw(pctx, prev.width);
        }
        const zoomLbl = document.getElementById("profile-crop-zoom-val");
        if (zoomLbl) zoomLbl.textContent = Math.round(_pc.zoom * 100) + "%";
      }

      function profileCropExportDataUrl() {
        const canvas = document.createElement("canvas");
        canvas.width = PROFILE_CROP.output;
        canvas.height = PROFILE_CROP.output;
        profileCropDraw(canvas.getContext("2d"), PROFILE_CROP.output);
        return canvas.toDataURL("image/jpeg", 0.92);
      }

      function profileCropBindEvents() {
        const vp = document.getElementById("profile-crop-vp");
        const zoomEl = document.getElementById("profile-crop-zoom");
        if (!vp || !zoomEl) return;
        let startX = 0, startY = 0, startPanX = 0, startPanY = 0, dragging = false;

        vp.onpointerdown = (e) => {
          dragging = true;
          vp.setPointerCapture(e.pointerId);
          vp.classList.add("dragging");
          startX = e.clientX;
          startY = e.clientY;
          startPanX = _pc.panX;
          startPanY = _pc.panY;
        };
        vp.onpointermove = (e) => {
          if (!dragging) return;
          _pc.panX = startPanX + (e.clientX - startX);
          _pc.panY = startPanY + (e.clientY - startY);
          profileCropClamp();
          profileCropUpdate();
        };
        const endDrag = () => { dragging = false; vp.classList.remove("dragging"); };
        vp.onpointerup = endDrag;
        vp.onpointercancel = endDrag;
        vp.onwheel = (e) => {
          e.preventDefault();
          _pc.zoom = Math.min(PROFILE_CROP.zoomMax, Math.max(PROFILE_CROP.zoomMin, _pc.zoom - e.deltaY * 0.002));
          zoomEl.value = String(_pc.zoom);
          profileCropClamp();
          profileCropUpdate();
        };
        zoomEl.oninput = () => {
          _pc.zoom = Number(zoomEl.value);
          profileCropClamp();
          profileCropUpdate();
        };
      }

      function openProfileCropper(file) {
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          const frame = PROFILE_CROP.frame;
          const baseScale = Math.max(frame / image.width, frame / image.height);
          _pc = {
            image,
            imgEl: null,
            nw: image.width,
            nh: image.height,
            baseScale,
            zoom: 1,
            panX: 0,
            panY: 0,
            frame,
            blobUrl: url,
          };
          openModal(`
            <div class="profile-crop-modal">
              <h3>Ajustar foto de perfil</h3>
              <p class="sub">Arrastrá la imagen para moverla · usá el zoom o la rueda del mouse</p>
              <div class="profile-crop-layout">
                <div class="profile-crop-viewport" id="profile-crop-vp">
                  <img id="profile-crop-img" src="${esc(url)}" alt="" draggable="false" />
                  <div class="profile-crop-frame" title="Área visible"></div>
                </div>
                <div class="profile-crop-side">
                  <span class="hint" style="margin:0">Vista previa</span>
                  <div class="profile-crop-preview">
                    <canvas id="profile-crop-preview-cv" width="176" height="176"></canvas>
                  </div>
                </div>
              </div>
              <div class="profile-crop-zoom-row">
                <span class="hint" style="margin:0">Zoom</span>
                <input type="range" id="profile-crop-zoom" min="${PROFILE_CROP.zoomMin}" max="${PROFILE_CROP.zoomMax}" step="0.01" value="1" />
                <span id="profile-crop-zoom-val">100%</span>
              </div>
              <div class="btn-row" style="margin-top:18px">
                <button type="button" class="ghost" onclick="cancelProfileCrop()">Cancelar</button>
                <button type="button" style="flex:1" id="profile-crop-ok" onclick="confirmProfileCrop()">Usar esta foto</button>
              </div>
              <div class="error" id="profile-crop-err"></div>
            </div>`);
          $("modal-content").classList.add("profile-crop-modal");
          _pc.imgEl = document.getElementById("profile-crop-img");
          _pc.imgEl.style.width = image.width + "px";
          _pc.imgEl.style.height = image.height + "px";
          profileCropBindEvents();
          profileCropUpdate();
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          toast("No se pudo leer la imagen", "err");
        };
        image.src = url;
      }

      function cancelProfileCrop() {
        closeModal();
      }

      async function confirmProfileCrop() {
        const errEl = document.getElementById("profile-crop-err");
        const btn = document.getElementById("profile-crop-ok");
        if (!_pc) return;
        btn.disabled = true;
        btn.textContent = "Subiendo...";
        errEl.textContent = "";
        try {
          const dataUrl = profileCropExportDataUrl();
          const res = await api("/uploads/profile", { method: "POST", body: JSON.stringify({ image: dataUrl }) });
          _profileImage = res.url;
          const av = document.getElementById("profile-av");
          if (av) {
            const img = document.createElement("img");
            img.id = "profile-av";
            img.className = "profile-avatar";
            img.src = _profileImage;
            img.alt = "Foto de perfil";
            av.replaceWith(img);
          }
          const hint = document.getElementById("profile-photo-hint");
          if (hint) {
            hint.textContent = "Foto lista. Guardá para aplicar.";
            hint.style.color = "var(--accent)";
          }
          cancelProfileCrop();
          toast("Foto recortada y lista", "ok");
        } catch (err) {
          errEl.textContent = err.message;
          btn.disabled = false;
          btn.textContent = "Usar esta foto";
        }
      }

      async function renderProfile(page) {
        page.innerHTML = `<div class="section-title">Mi perfil</div><div class="section-sub">Actualizá tu foto, nombre y teléfono.</div><div id="profile-form"><div class="empty">Cargando...</div></div>`;
        try {
          const user = await api("/users/" + state.user.id);
          state.user = user;
          localStorage.setItem("kluby_user", JSON.stringify(user));
          _profileImage = user.profileImageUrl || null;
          const av = _profileImage
            ? `<img id="profile-av" class="profile-avatar" src="${esc(_profileImage)}" alt="Foto de perfil" />`
            : `<div id="profile-av" class="profile-avatar placeholder">${esc((user.fullName || "U").charAt(0).toUpperCase())}</div>`;
          $("profile-form").innerHTML = `
            <div class="card profile-card">
              <div class="profile-avatar-wrap">
                ${av}
                <label class="btn-sm ghost" style="cursor:pointer;margin:0">
                  Cambiar foto
                  <input id="profile-file" type="file" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="onProfilePhoto(event)" />
                </label>
                <span class="hint" id="profile-photo-hint">PNG, JPG o WebP · cualquier tamaño</span>
              </div>
              <label>Nombre completo</label>
              <input id="pf-name" value="${attr(user.fullName)}" placeholder="Tu nombre" />
              <label>Teléfono</label>
              <input id="pf-phone" value="${attr(user.phone || "")}" placeholder="11 1234 5678" />
              <label>Email</label>
              <input class="readonly-field" value="${attr(user.email)}" readonly title="El email no se puede modificar" />
              <p class="hint" style="margin-top:-6px">El email no se puede cambiar.</p>
              <button class="btn-full" style="margin-top:18px" id="pf-save" onclick="saveProfile()">Guardar cambios</button>
              <div class="spacer"></div>
              <label>Código de invitación a evento</label>
              <div class="btn-row">
                <input id="pf-event-code" placeholder="EVENTO-XXXX-XXXX" style="flex:1" />
                <button type="button" class="btn-sm" onclick="redeemEventCode(document.getElementById('pf-event-code').value).catch(e=>toast(e.message,'err'))">Canjear</button>
              </div>
              <label style="margin-top:14px">Código de equipo (publi / puerta)</label>
              <div class="btn-row">
                <input id="pf-team-code" placeholder="EQUIPO-XXXX-XXXX" style="flex:1" />
                <button type="button" class="btn-sm" onclick="redeemTeamCode(document.getElementById('pf-team-code').value).catch(e=>toast(e.message,'err'))">Canjear</button>
              </div>
              <div class="error" id="pf-err"></div>
            </div>`;
        } catch (e) {
          $("profile-form").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
        }
      }
      function onProfilePhoto(e) {
        const file = e.target.files[0];
        e.target.value = "";
        if (!file) return;
        const hint = document.getElementById("profile-photo-hint");
        if (!/^image\/(png|jpeg|webp)$/i.test(file.type)) {
          if (hint) { hint.textContent = "Formato no soportado. Usá PNG, JPG o WebP."; hint.style.color = "var(--pink)"; }
          return;
        }
        if (file.size > 12 * 1024 * 1024) {
          if (hint) { hint.textContent = "La imagen es demasiado grande (máx. 12 MB)."; hint.style.color = "var(--pink)"; }
          return;
        }
        if (hint) { hint.style.color = ""; }
        openProfileCropper(file);
      }
      async function saveProfile() {
        const errEl = document.getElementById("pf-err");
        const btn = document.getElementById("pf-save");
        const name = document.getElementById("pf-name").value.trim();
        const phone = document.getElementById("pf-phone").value.trim();
        if (!name) { errEl.textContent = "El nombre es obligatorio."; return; }
        const body = { fullName: name, phone };
        if (_profileImage) body.profileImageUrl = _profileImage;
        btn.disabled = true;
        btn.textContent = "Guardando...";
        try {
          const user = await api("/users/" + state.user.id, { method: "PATCH", body: JSON.stringify(body) });
          state.user = user;
          localStorage.setItem("kluby_user", JSON.stringify(user));
          toast("Perfil actualizado", "ok");
          render();
        } catch (e) {
          errEl.textContent = e.message;
          btn.disabled = false;
          btn.textContent = "Guardar cambios";
        }
      }

      async function renderInvites(page) {
        page.innerHTML = `<div class="section-title">Mis invitaciones</div><div class="section-sub">Eventos a los que un publi te invitó.</div><div id="inv-list"><div class="empty">Cargando...</div></div>`;
        try {
          const rows = await api("/invites/my-events");
          if (!rows.length) {
            $("inv-list").innerHTML = '<div class="empty">Todavía no canjeaste invitaciones a eventos.</div>';
            return;
          }
          $("inv-list").innerHTML = rows.map((r) => `
            <div class="card" style="padding:18px;margin-bottom:12px;cursor:pointer" onclick="go('club',{clubId:'${r.club.id}',eventId:'${r.event.id}'})">
              <b>${esc(r.event.name)}</b>
              <div class="meta">${esc(r.club.name)} · ${fdatetime(r.event.date)}</div>
              <span class="role-pill">Canjeada ${fdatetime(r.redeemedAt)}</span>
            </div>`).join("");
        } catch (e) {
          $("inv-list").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
        }
      }

      // init
      captureInviteFromUrl();
      render();
    </script>
  </body>
</html>
