<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <link rel="icon" href="/brand/kluby-logo.png" type="image/png" />
    <title>Kluby · App</title>
    <link rel="stylesheet" href="/kluby.css" />
    <link rel="stylesheet" href="/kluby-public.css" />
    <link rel="stylesheet" href="/kluby-app.css" />
    <style>
      /* Mapa 2D de mesas */
      .floor {
        position: relative; width: 100%; min-width: 640px; height: 360px;
        background:
          linear-gradient(180deg, #10101a, #0c0c14);
        border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
        background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.04) 1px, transparent 0);
        background-size: 22px 22px;
      }
      .floor-wrap { overflow-x: auto; padding-bottom: 8px; }
      .stage-label {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        background: var(--surface-3); color: var(--muted); padding: 4px 18px;
        border-radius: 999px; font-size: 11px; letter-spacing: 2px; font-weight: 700;
      }
      .table-node {
        position: absolute; width: 78px; height: 60px; border-radius: 12px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-size: 11px; font-weight: 700; cursor: pointer; padding: 4px; text-align: center;
        border: 1.5px solid transparent; transition: transform 0.1s; color: #fff;
      }
      .table-node small { font-weight: 600; opacity: 0.85; font-size: 10px; }
      .table-node:hover { transform: scale(1.06); }
      .table-node.available { background: rgba(45,226,198,0.14); border-color: var(--accent); color: var(--accent); }
      .table-node.reserved { background: rgba(255,92,108,0.13); border-color: var(--red); color: #ff9aa3; cursor: not-allowed; }
      .table-node.reserved:hover { transform: none; }
      .legend { display: flex; gap: 18px; margin: 14px 0; font-size: 13px; color: var(--muted); }
      .legend .dot { width: 11px; height: 11px; border-radius: 4px; display: inline-block; margin-right: 6px; vertical-align: middle; }

      /* Mapa con imagen de fondo (plano del salon) */
      .floor-map { position: relative; width: 100%; max-width: 560px; margin: 0 auto; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); background: #0c0c14; }
      .floor-map.default-canvas {
        aspect-ratio: 1725 / 2490;
        background: linear-gradient(180deg, #14141f, #0c0c14);
        border: 2px dashed var(--border);
        min-height: 200px;
      }
      .floor-map img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
      .canvas-label {
        position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
        font-size: 11px; color: var(--muted); pointer-events: none; z-index: 1;
        background: rgba(0,0,0,0.35); padding: 4px 10px; border-radius: 6px;
      }
      .table-pin {
        position: absolute; transform: translate(-50%, -50%);
        min-width: 26px; height: 26px; padding: 0 5px; border-radius: 7px;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 800; border: 2px solid; cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,0.5); transition: transform 0.1s;
      }
      .table-pin.available { background: rgba(45,226,198,0.92); border-color: #ffffff; color: #04201c; }
      .table-pin.reserved { background: rgba(255,92,108,0.88); border-color: rgba(255,255,255,0.6); color: #fff; cursor: not-allowed; }
      .table-pin.available:hover { transform: translate(-50%, -50%) scale(1.18); z-index: 3; }
      .sector-legend { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 0; font-size: 12px; color: var(--muted); justify-content: center; }

      .bottles-section { margin-top: 28px; }
      .bottles-section h3 { margin: 0 0 6px; font-size: 18px; }
      .bottles-section .section-sub { margin-bottom: 14px; }
      .bottles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
      .bottle-item {
        background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px;
        padding: 14px; display: flex; flex-direction: column; gap: 6px;
      }
      .bottle-item .bi-name { font-weight: 700; font-size: 14px; }
      .bottle-item .bi-cat { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
      .bottle-item .bi-desc { font-size: 12px; color: var(--muted); line-height: 1.4; flex: 1; }
      .bottle-item .bi-price { font-size: 17px; font-weight: 800; color: var(--accent); margin-top: 4px; }

      .k-finance-block {
        background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px;
        padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
      }
      .k-fin-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; gap: 10px; }
      .k-fin-row span { color: var(--muted); }
      .k-fin-row b { font-size: 15px; }
      .k-fin-row.highlight span { color: var(--text); font-weight: 600; }
      .k-fin-row.highlight b { color: var(--amber); font-size: 17px; }
      .k-fin-row.ok b { color: var(--green); }
      .k-fin-note { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 2px; }

      .k-consumption-block {
        margin-top: 12px; background: rgba(45, 226, 198, 0.06); border: 1px solid rgba(45, 226, 198, 0.22);
        border-radius: 14px; padding: 14px 16px;
      }
      .k-consumption-head {
        display: flex; justify-content: space-between; align-items: center; font-size: 14px;
        font-weight: 700; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
      }
      .k-consumption-head b { color: var(--accent); font-size: 16px; }
      .k-consumption-item { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
      .k-consumption-item:last-child { border-bottom: none; padding-bottom: 0; }
      .k-consumption-items { font-size: 14px; font-weight: 600; line-height: 1.4; }
      .k-consumption-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }

      .k-calc-budget { margin: 14px 0; }
      .k-calc-budget label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
      .k-calc-budget input { width: 100%; padding: 12px 14px; border-radius: 10px; background: var(--surface-3); border: 1px solid var(--border); color: var(--text); font-size: 16px; font-weight: 700; }
      .k-calc-lines { display: flex; flex-direction: column; gap: 10px; max-height: min(38vh, 280px); overflow-y: auto; margin: 12px 0; padding-right: 4px; -webkit-overflow-scrolling: touch; }
      .k-calc-line {
        display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
        padding: 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border);
      }
      .k-calc-line .name { font-weight: 700; font-size: 14px; }
      .k-calc-line .price { font-size: 12px; color: var(--muted); }
      .k-calc-qty { display: flex; align-items: center; gap: 8px; }
      .k-calc-qty button {
        width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
        background: var(--surface-3); color: var(--text); font-size: 18px; cursor: pointer; line-height: 1;
      }
      .k-calc-qty span { min-width: 24px; text-align: center; font-weight: 800; }
      .k-calc-line-total { font-weight: 800; color: var(--accent); font-size: 14px; white-space: nowrap; }
      .k-calc-summary {
        padding: 14px; border-radius: 12px; background: rgba(124,92,255,0.08);
        border: 1px solid rgba(124,92,255,0.25); font-size: 14px; line-height: 1.5;
      }
      .k-calc-summary b { font-size: 16px; }
      .k-calc-summary.over { background: rgba(255,92,108,0.08); border-color: rgba(255,92,108,0.3); }
      .k-calc-summary.ok { background: rgba(45,226,198,0.08); border-color: rgba(45,226,198,0.25); }

      .reserve-info { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
      .reserve-info .stat { background: var(--surface-3); border-radius: 10px; padding: 10px 14px; }
      .reserve-info .stat small { display: block; color: var(--muted); font-size: 11px; }
      .reserve-info .stat b { font-size: 16px; }
      .pay-opt { display: flex; gap: 10px; margin-top: 8px; }
      .pay-opt .opt {
        flex: 1; border: 1.5px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer;
      }
      .pay-opt .opt.sel { border-color: var(--primary); background: rgba(124,92,255,0.08); }
      .pay-opt .opt b { display: block; font-size: 15px; }
      .pay-opt .opt small { color: var(--muted); }

      .ticket {
        text-align: center; padding: 10px;
      }
      .ticket .qr { background: #fff; padding: 12px; border-radius: 14px; display: inline-block; margin: 8px 0; }
      .ticket .code { font-family: monospace; font-size: 13px; color: var(--muted); word-break: break-all; }

      .list-card { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
      .list-card .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
      .list-card .title { font-size: 16px; font-weight: 700; }

      .contact-card {
        margin: 18px 0 24px; padding: 18px 20px;
        background: linear-gradient(135deg, rgba(45,226,198,0.08), rgba(45,226,198,0.02));
        border: 1px solid rgba(45,226,198,0.25);
      }
      .contact-card h4 { margin: 0 0 12px; font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .3px; }
      .contact-card .contact-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 14px; }
      .contact-card .contact-row:last-child { margin-bottom: 0; }
      .contact-card .contact-row a { color: var(--text); text-decoration: none; }
      .contact-card .contact-row a:hover { color: var(--accent); text-decoration: underline; }
      .contact-card .contact-icon { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }
      .meta { color: var(--muted); font-size: 13px; line-height: 1.6; }
      .amount-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; }
      .amount-row b { color: var(--text); }

      .user-avatar { border-radius: 50%; object-fit: cover; border: 2px solid var(--border); flex-shrink: 0; display: block; }
      .user-avatar.placeholder {
        display: inline-flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #2a1d5e, #3a1d52); font-weight: 800; color: #fff;
      }
      .profile-card { max-width: 480px; margin: 0 auto; padding: 28px; }
      .profile-avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 22px; }
      .profile-avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid var(--border); }
      .profile-avatar.placeholder { display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #2a1d5e, #3a1d52); color: #fff; }
      input.readonly-field { opacity: 0.7; cursor: not-allowed; background: var(--surface-3); }

      .profile-crop-modal { max-width: 420px !important; }
      .profile-crop-layout { display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
      .profile-crop-viewport {
        width: 280px; height: 280px; position: relative; overflow: hidden;
        background: #0a0a12; border-radius: 14px; border: 1px solid var(--border);
        cursor: grab; touch-action: none; flex-shrink: 0;
      }
      .profile-crop-viewport.dragging { cursor: grabbing; }
      .profile-crop-viewport img {
        position: absolute; left: 50%; top: 50%; transform-origin: center center;
        max-width: none; pointer-events: none; user-select: none; -webkit-user-drag: none;
      }
      .profile-crop-frame {
        position: absolute; inset: 16px; border: 2px solid var(--accent);
        box-shadow: 0 0 0 9999px rgba(0,0,0,0.58); border-radius: 12px;
        pointer-events: none; z-index: 2;
      }
      .profile-crop-side { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .profile-crop-preview {
        width: 88px; height: 88px; border-radius: 50%; overflow: hidden;
        border: 3px solid var(--border); background: var(--surface-3);
      }
      .profile-crop-preview canvas { display: block; width: 100%; height: 100%; }
      .profile-crop-zoom-row { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
      .profile-crop-zoom-row input[type=range] { flex: 1; accent-color: var(--accent); }
      .profile-crop-zoom-row span { font-size: 12px; color: var(--muted); min-width: 36px; text-align: right; }
      .k-loyalty-block {
        margin-top: 16px; padding: 14px 16px; border-radius: 12px;
        background: linear-gradient(135deg, rgba(124,92,255,0.12), rgba(45,226,198,0.08));
        border: 1px solid rgba(124,92,255,0.35);
      }
      .k-loyalty-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
      .k-loyalty-head span { font-size: 13px; color: var(--muted); }
      .k-loyalty-head b { font-size: 18px; color: var(--accent); }
      .k-loyalty-toggle { display: flex; align-items: center; gap: 8px; margin: 10px 0 6px; font-size: 14px; cursor: pointer; }
      .k-loyalty-slider { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
      .k-loyalty-slider input[type=range] { flex: 1; accent-color: var(--accent); }
      .k-loyalty-slider.hidden { display: none; }
      .k-loyalty-card { margin-top: 20px; }
      .k-loyalty-club { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
      .k-loyalty-club:last-child { border-bottom: none; }
      .k-loyalty-txn { font-size: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); color: var(--muted); }
      .k-loyalty-txn b { color: var(--text); }
      .k-loyalty-txn.earn b { color: var(--accent); }
      .k-loyalty-txn.redeem b { color: var(--pink); }
      .k-refund-policy {
        margin-top: 18px; padding: 14px 16px; border-radius: 12px;
        background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      }
      .k-refund-policy h4 { font-size: 14px; margin-bottom: 10px; color: var(--muted); font-weight: 600; }
      .k-refund-table { width: 100%; font-size: 13px; border-collapse: collapse; }
      .k-refund-table td { padding: 6px 0; border-bottom: 1px solid var(--border); }
      .k-refund-table tr:last-child td { border-bottom: none; }
      .k-refund-table td:last-child { text-align: right; color: var(--accent); }
      .k-refund-preview { font-size: 13px; margin-top: 10px; color: var(--text); }
      .k-policy-check {
        display: flex; align-items: flex-start; gap: 10px; margin-top: 14px;
        font-size: 13px; line-height: 1.45; cursor: pointer;
      }
      .k-policy-check input { margin-top: 3px; accent-color: var(--accent); }
    </style>
  </head>
  <body class="kluby-public kluby-app">
    <div id="k-bg"></div>
    <div id="root"></div>
    <div class="modal-overlay" id="modal"><div class="card modal" id="modal-content"></div></div>
    <div class="toast" id="toast"></div>

    <script src="/kluby-ui.js"></script>
    <script src="/kluby-offline.js"></script>
    <script>
      const API = "/api";
      const state = {
        token: localStorage.getItem("kluby_token") || "",
        user: JSON.parse(localStorage.getItem("kluby_user") || "null"),
        view: "home",
        params: {},
        mineFilter: "all",
        showPast: false,
      };

      // ---------- utils ----------
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const attr = (s) => esc(s).replace(/[\r\n]+/g, " ");
      function imgFallback(img) {
        img.style.display = "none";
        const fb = img.dataset.fallback;
        if (fb && img.parentElement) {
          img.parentElement.classList.remove("has-img");
          if (!img.parentElement.textContent.trim()) img.parentElement.appendChild(document.createTextNode(fb));
        }
      }
      const money = (n) => new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 }).format(Number(n) || 0);
      const num = (n) => Number(n) || 0;

      function reservationRemaining(r) {
        return Math.max(0, num(r.totalAmount) - num(r.amountPaid));
      }

      function reservationMinConsumption(r) {
        const t = r.table;
        if (!t) return 0;
        if (t.consumptionPercent != null && t.price != null) {
          return Math.round(num(t.price) * num(t.consumptionPercent) / 100);
        }
        return num(t.minConsumption);
      }

      function consumptionBudgetDefault(r) {
        const minCons = reservationMinConsumption(r);
        if (minCons > 0) return minCons;
        return reservationRemaining(r);
      }

      function reservationFinanceHtml(r, compact) {
        const remaining = reservationRemaining(r);
        const minCons = reservationMinConsumption(r);
        const paid = num(r.amountPaid);
        const total = num(r.totalAmount);
        const loyaltyDisc = num(r.loyaltyDiscount);
        const rows = [
          `<div class="k-fin-row"><span>Total mesa</span><b>${money(total)}</b></div>`,
        ];
        if (loyaltyDisc > 0) {
          rows.push(`<div class="k-fin-row"><span>Descuento Kluby Points</span><b>-${money(loyaltyDisc)}</b></div>`);
          if (r.loyaltyPointsRedeemed) {
            rows.push(`<div class="k-fin-row"><span>Puntos usados</span><b>${r.loyaltyPointsRedeemed} pts</b></div>`);
          }
        }
        rows.push(`<div class="k-fin-row"><span>Pagado</span><b>${money(paid)}</b></div>`);
        if (remaining > 0) {
          rows.push(`<div class="k-fin-row highlight"><span>Saldo pendiente</span><b>${money(remaining)}</b></div>`);
          rows.push(`<p class="k-fin-note">${r.paymentOption === "FULL_PAYMENT" ? "Completá el pago de la mesa." : "Resto de la mesa a abonar en el boliche (después de la seña)."}</p>`);
        } else if (r.status !== "PENDING_PAYMENT") {
          rows.push(`<div class="k-fin-row ok"><span>Saldo mesa</span><b>¡Pagada!</b></div>`);
        }
        if (minCons > 0 && !compact) {
          rows.push(`<div class="k-fin-row"><span>Consumición mínima</span><b>${money(minCons)}</b></div>`);
          rows.push(`<p class="k-fin-note">Monto mínimo en botellas/combos en el local (planificá con la calculadora).</p>`);
        }
        return `<div class="k-finance-block">${rows.join("")}</div>`;
      }

      function reservationConsumptionHtml(r) {
        const orders = (r.orders || []).filter(
          (o) => o.status !== "CANCELLED" && o.status !== "PENDING_PAYMENT"
        );
        if (!orders.length) return "";
        const STATUS = {
          PAID: "Pagado",
          PREPARING: "En preparación",
          READY: "Listo para retirar",
          DELIVERED: "Entregado",
        };
        const total = orders.reduce((acc, o) => acc + num(o.total), 0);
        const lines = orders.map((o) => {
          const items = (o.items || [])
            .map((i) => `${i.quantity}× ${i.product?.name || "Producto"}`)
            .join(", ");
          const when = o.createdAt
            ? new Date(o.createdAt).toLocaleString("es-AR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })
            : "";
          return `<div class="k-consumption-item">
            <div class="k-consumption-items">${esc(items)}</div>
            <div class="k-consumption-meta">${money(o.total)} · ${STATUS[o.status] || o.status}${when ? " · " + when : ""}</div>
          </div>`;
        }).join("");
        return `<div class="k-consumption-block">
          <div class="k-consumption-head"><span>🍾 Consumo en la mesa</span><b>${money(total)}</b></div>
          ${lines}
        </div>`;
      }

      let _loyaltyRules = null;
      let _wizardLoyalty = null;
      let _wizardPolicyAccepted = false;

      const DEFAULT_REFUND_TIERS = [
        { minHours: 72, percent: 100, label: "Más de 72 horas antes del evento" },
        { minHours: 48, percent: 75, label: "Entre 48 y 72 horas" },
        { minHours: 24, percent: 50, label: "Entre 24 y 48 horas" },
        { minHours: 0, percent: 0, label: "Menos de 24 horas" },
      ];

      function wizardRefundPayAmount(t) {
        const deposit = Math.round(Number(t.price) * (t.depositPercent / 100));
        let base = _reserveSel === "FULL_PAYMENT" ? num(t.price) : deposit;
        if (_wizardLoyalty?.pointsToUse > 0) {
          base = Math.max(0, base - _wizardLoyalty.pointsToUse * (_wizardLoyalty.pointValue || 1));
        }
        return base;
      }

      function refundPolicyBlockHtml(policy) {
        const tiers = (policy.tiers || []).map((tier) =>
          `<tr><td>${esc(tier.label)}</td><td><b>${tier.percent}%</b></td></tr>`
        ).join("");
        const preview = policy.amountPreview || policy.preview;
        let previewLine = "";
        if (preview?.refundAmount !== undefined) {
          previewLine = `<p class="k-refund-preview">Si cancelás ahora: <b>${preview.refundPercent}%</b> → ${money(preview.refundAmount)} de devolución estimada.</p>`;
        } else if (preview?.refundPercent !== undefined) {
          previewLine = `<p class="k-refund-preview">Franja actual: <b>${preview.refundPercent}%</b> (${esc(preview.tierLabel || "")})</p>`;
        }
        return `
          <div class="k-refund-policy">
            <h4>Política de cancelación</h4>
            <table class="k-refund-table"><tbody>${tiers}</tbody></table>
            ${previewLine}
            <p class="hint" style="margin-top:8px"><a href="#" onclick="event.preventDefault();go('cancelacion')">Ver política completa</a></p>
          </div>
          <label class="k-policy-check"><input type="checkbox" id="wizard-policy-accept" onchange="onWizardPolicyAccept()" /> Acepto la política de cancelación y devoluciones de Kluby</label>`;
      }

      function onWizardPolicyAccept() {
        _wizardPolicyAccepted = !!document.getElementById("wizard-policy-accept")?.checked;
        updateReserveBtnState();
      }

      function updateReserveBtnState() {
        const btn = $("reserve-btn");

      function maxRedeemPoints(balance, payAmount, pointValue, rules) {
        if (!balance || balance < rules.minRedeemPoints) return 0;
        const pv = Number(pointValue) || 1;
        const maxDiscount = payAmount * (rules.maxRedeemPercent / 100);
        const maxByPct = Math.floor(maxDiscount / pv);
        const cap = rules.maxRedeemPointsCap ?? 3000;
        return Math.min(balance, Math.max(0, maxByPct), cap);
      }

      function wizardPayPreviewHtml(t) {
        const total = num(t.price);
        const deposit = Math.round(total * (t.depositPercent / 100));
        const minCons = num(t.minConsumption);
        const isFull = _reserveSel === "FULL_PAYMENT";
        let payNow = isFull ? total : deposit;
        const remaining = Math.max(0, total - (isFull ? total : deposit));
        let loyaltyLine = "";
        if (_wizardLoyalty?.pointsToUse > 0) {
          const disc = _wizardLoyalty.pointsToUse * (_wizardLoyalty.pointValue || 1);
          payNow = Math.max(0, payNow - disc);
          loyaltyLine = `<div class="k-fin-row"><span>Kluby Points</span><b>-${money(disc)}</b></div>`;
        }
        return `
          <div class="k-finance-block" style="margin-top:14px">
            <div class="k-fin-row"><span>Pagás ahora</span><b>${money(payNow)}</b></div>
            ${loyaltyLine}
            <div class="k-fin-row highlight"><span>Saldo en el boliche</span><b>${money(remaining)}</b></div>
            ${minCons ? `<div class="k-fin-row"><span>Consumición mínima</span><b>${money(minCons)}</b></div>` : ""}
          </div>`;
      }

            <p class="hint" style="margin:0">Necesitás al menos <b>${rules.minRedeemPoints} pts</b> para canjear en esta reserva${balance > 0 ? ` (tenés ${balance})` : ""}. Sumás 1 pt cada $${rules.currencyPerPoint} pagados en el boliche.</p>
          </div>`;
        }
        return `
          <div class="k-loyalty-block" id="wizard-loyalty">

      function refreshWizardLoyaltyUi() {
        if (!_wizardLoyalty || !window._wizardTable) return;
        const t = window._wizardTable;
        const total = num(t.price);
        const deposit = Math.round(total * (t.depositPercent / 100));
        const payBase = _reserveSel === "FULL_PAYMENT" ? total : deposit;
        _wizardLoyalty.payBase = payBase;
        const maxPts = maxRedeemPoints(_wizardLoyalty.balance, payBase, _wizardLoyalty.pointValue, _wizardLoyalty.rules);
        const range = document.getElementById("wizard-loyalty-range");
        const useCb = document.getElementById("wizard-loyalty-use");
        if (!range || !useCb?.checked) {
          _wizardLoyalty.pointsToUse = 0;
        } else {
          range.max = String(Math.max(maxPts, _wizardLoyalty.rules.minRedeemPoints));
          if (Number(range.value) > maxPts) range.value = String(maxPts);
          if (Number(range.value) < _wizardLoyalty.rules.minRedeemPoints) range.value = String(_wizardLoyalty.rules.minRedeemPoints);
          _wizardLoyalty.pointsToUse = maxPts >= _wizardLoyalty.rules.minRedeemPoints ? Number(range.value) : 0;
          onWizardLoyaltyChange();
        }
        const preview = $("wizard-pay-preview");
        if (preview) preview.innerHTML = wizardPayPreviewHtml(t);
        void refreshWizardRefundPolicy();

      async function api(path, options = {}) {
        const res = await fetch(API + path, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(state.token ? { Authorization: "Bearer " + state.token } : {}),
            ...(options.headers || {}),
          },
        });
        const json = await res.json().catch(() => ({ success: false, error: "Respuesta invalida" }));
        if (res.status === 401 && state.token) { doLogout(); throw new Error(KlubyUI.friendlyError("Sesion expirada", 401)); }
        if (!res.ok || !json.success) throw new Error(KlubyUI.friendlyError(json.error || "Error " + res.status, res.status));

      function captureInviteFromUrl() {
        const p = new URLSearchParams(location.search);
        const inv = p.get("invitacion");
        const eq = p.get("equipo");
        if (inv) localStorage.setItem("kluby_pending_event", inv.trim());

      async function redeemPendingInvites() {
        const eventCode = localStorage.getItem("kluby_pending_event");
        const teamCode = localStorage.getItem("kluby_pending_equipo");
        if (eventCode && state.user?.role === "CLIENT") {
          try {
            const r = await api("/invites/event/redeem", { method: "POST", body: JSON.stringify({ code: eventCode }) });
            localStorage.removeItem("kluby_pending_event");
            toast(r.message, "ok");
            if (r.club?.id && r.event?.id) go("event", { id: r.event.id, club: r.club.id });
            return;
          } catch (e) { toast(e.message, "err"); }
        }
        if (teamCode && state.token) {
          try {
            const r = await api("/invites/club/redeem", { method: "POST", body: JSON.stringify({ code: teamCode }) });
            localStorage.removeItem("kluby_pending_equipo");
            if (r.token && r.user) {
              saveSession({ token: r.token, user: r.user });
            }
            toast(r.message, "ok");
            if (r.user?.role === "STAFF") { location.href = "/publi.html"; return; }
            if (r.user?.role === "PUERTA") { location.href = "/staff.html"; return; }
          } catch (e) { toast(e.message, "err"); }
        }
      }
      async function redeemEventCode(code) {
        const r = await api("/invites/event/redeem", { method: "POST", body: JSON.stringify({ code: code.trim() }) });
        toast(r.message, "ok");
        if (r.club?.id && r.event?.id) go("event", { id: r.event.id, club: r.club.id });
      }
      async function redeemTeamCode(code) {
        const r = await api("/invites/club/redeem", { method: "POST", body: JSON.stringify({ code: code.trim() }) });
        if (r.token && r.user) saveSession({ token: r.token, user: r.user });
        toast(r.message, "ok");
        if (r.user?.role === "STAFF") { location.href = "/publi.html"; return; }
        if (r.user?.role === "PUERTA") { location.href = "/staff.html"; return; }
        render();

      function doLogout() {
        stopNotifPoll();
        state.token = ""; state.user = null;
        KlubyUI.clearClientAppVisit();
        localStorage.removeItem("kluby_token"); localStorage.removeItem("kluby_user");
        location.href = "/login.html";

      function requireAuth() {
        if (!state.token || !state.user) {
          location.href = "/login.html?next=" + encodeURIComponent("/app.html" + location.search);
          return false;

        const away = KlubyUI.resolveAppEntry(state.user);

      function go(view, params = {}) {
        clearTimeout(homeTimer);
        clearTimeout(wzClubsTimer);

        if (view === "joins") {
          view = "mine";
          params = { ...params, filter: params.filter || "guest" };
        }
        if (view === "mine" && params.filter) state.mineFilter = params.filter;
        state.view = view;
        state.params = params;

      // ---------- Fase 2: wizard, QR, timeline, alertas ----------
      const WIZARD_LABELS = ["Boliche", "Fecha", "Mesa", "Pago"];
      let _wizardTables = null;
      let _wizardEventDate = null;
      let _wizardEventId = null;
      let _wizardHoldId = null;
      let _wizardHoldTableId = null;
      let _wizardHoldExpiresAt = null;
      let _alertsCache = null;
      let _alertsAt = 0;
      let _notifPollTimer = null;
      let _notifOutsideBound = false;
      let _knownChatAlertIds = new Set();
      let _notifWarm = false;
      const NOTIF_DISMISS_KEY = "kluby_notif_dismissed";
      const CHAT_SEEN_KEY = "kluby_chat_seen";
      const CHAT_ACTIVE_MS = 24 * 60 * 60 * 1000;
      let _reserveSel = "DEPOSIT_ONLY";

      function wizardGo(step, extra = {}) {
        const nextStep = Number(step) || 1;
        if (nextStep < 4) void releaseWizardHold();
        const p = { ...state.params, ...extra, step: nextStep };
        if (p.eventId && p.eventId !== state.params.eventId) {
          _wizardTables = null;
          _wizardEventDate = null;
          _wizardEventId = null;
        }
        if (p.tableId && p.tableId !== state.params.tableId) void releaseWizardHold();
        const clean = { step: p.step };
        if (p.step >= 2 && p.clubId) clean.clubId = p.clubId;
        if (p.step >= 3 && p.eventId) clean.eventId = p.eventId;
        if (p.step >= 4 && p.tableId) clean.tableId = p.tableId;
        go("wizard", clean);
      }

      async function releaseWizardHold() {
        if (!_wizardHoldId) return;
        const id = _wizardHoldId;
        _wizardHoldId = null;
        _wizardHoldTableId = null;
        _wizardHoldExpiresAt = null;
        try {
          await api("/reservations/" + id + "/release-hold", { method: "POST" });
        } catch { /* ya expiró, se confirmó o no existe */ }
      }

      async function ensureWizardHold(tableId, eventId) {
        if (_wizardHoldId && _wizardHoldTableId === tableId) return _wizardHoldId;
        await releaseWizardHold();
        const r = await api("/reservations", {
          method: "POST",
          body: JSON.stringify({
            eventId,
            tableId,
            hostId: state.user.id,
            paymentOption: _reserveSel,
            mode: "STANDARD",
          }),
        });
        _wizardHoldId = r.id;
        _wizardHoldTableId = tableId;
        _wizardHoldExpiresAt = r.expiresAt || null;
        return r.id;
      }

      function tableAvailableForUser(t) {
        if (!t) return false;
        if (t.status === "AVAILABLE") return true;
        const hostId = t.reservation?.host?.id || t.reservation?.hostId;
        return hostId === state.user.id && t.reservation?.status === "PENDING_PAYMENT";
      }

      function wizardChrome(step) {
        const pct = ((step - 1) / (WIZARD_LABELS.length - 1)) * 100;
        const steps = WIZARD_LABELS.map((lbl, i) => {
          const n = i + 1;
          const cls = n < step ? "done" : n === step ? "active" : "";
          return `<div class="k-wizard-step ${cls}"><span class="dot">${n < step ? "✓" : n}</span><span class="lbl">${lbl}</span></div>`;
        }).join("");
        return `<div class="k-wizard-steps">${steps}</div><div class="k-wizard-bar"><div class="k-wizard-bar-fill" style="width:${pct}%"></div></div>`;
      }

      function reservationTimelineHtml(r) {
        if (r.status === "CANCELLED" || r.status === "EXPIRED" || r.status === "NO_SHOW") {
          const labels = { CANCELLED: "Cancelada", EXPIRED: "Expirada", NO_SHOW: "No-show" };
          return `<div class="k-timeline cancelled"><div class="k-timeline-step done"><span>${labels[r.status] || r.status}</span></div></div>`;
        }
        const paid = r.status !== "PENDING_PAYMENT" && (Number(r.amountPaid) > 0 || r.status === "CONFIRMED" || r.status === "CHECKED_IN" || r.status === "COMPLETED");
        const checked = r.status === "CHECKED_IN" || r.status === "COMPLETED";
        const done = r.status === "COMPLETED";
        const steps = [
          { label: "Reservada", state: "done" },
          { label: "Pagada", state: paid ? (r.status === "PENDING_PAYMENT" ? "current" : "done") : (r.status === "PENDING_PAYMENT" ? "current" : "") },
          { label: "Ingreso", state: checked ? "done" : paid ? "current" : "" },
          { label: "Finalizada", state: done ? "done" : checked ? "current" : "" },
        ];
        if (r.status === "PENDING_PAYMENT") steps[1].state = "current";
        else if (r.status === "CONFIRMED") steps[2].state = steps[2].state || "current";
        return `<div class="k-timeline">${steps.map((s) => `<div class="k-timeline-step ${s.state}"><span>${s.label}</span></div>`).join("")}</div>`;
      }

      function buildEventMapHtml(event, tables, onPick) {
        window._tables = tables;

          _wizardEventDate = event.date;
          _wizardEventId = event.id || state.params.eventId || null;

               style="left:${t.posX}%;top:${t.posY}%"

               ${av ? `onclick="${onPick(t.id)}"` : ""}>${esc(short)}</div>`;
        };
        const pins = tables.map(pinHtml).join("");

          : `<div class="sector-legend">${sectors.map((s) => `<span>📍 ${esc(s)}</span>`).join("")}</div>`;

      function notifLoadJson(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      }

      function notifUserKey(base) {
        return state.user?.id ? `${base}_${state.user.id}` : base;
      }

      function getDismissedNotifs() {
        return notifLoadJson(notifUserKey(NOTIF_DISMISS_KEY), {});
      }

      function invalidateNotifications() {
        _alertsCache = null;
        _alertsAt = 0;
      }

      function dismissNotif(id) {
        const d = getDismissedNotifs();
        d[id] = Date.now();
        localStorage.setItem(notifUserKey(NOTIF_DISMISS_KEY), JSON.stringify(d));
        invalidateNotifications();
        void refreshNotifications();
      }

      function getChatSeen() {
        return notifLoadJson(notifUserKey(CHAT_SEEN_KEY), {});
      }

      function getChatSeenEntry(reservationId) {
        const raw = getChatSeen()[reservationId];
        if (!raw) return null;
        if (typeof raw === "string") return { messageId: raw, at: 0 };
        return raw;
      }

      function isChatAlertSeen(alert) {
        const entry = getChatSeenEntry(alert.reservationId);
        if (!entry) return false;
        if (entry.messageId === alert.messageId) return true;
        if (entry.at && alert.messageAt && new Date(alert.messageAt).getTime() <= entry.at) return true;
        return false;
      }

      function setChatSeen(reservationId, messageId) {
        if (!reservationId || !messageId) return;
        const seen = getChatSeen();
        seen[reservationId] = { messageId, at: Date.now() };
        localStorage.setItem(notifUserKey(CHAT_SEEN_KEY), JSON.stringify(seen));
        invalidateNotifications();
      }

      function chatMessageAuthorId(m) {
        return String(m?.userId || m?.user?.id || "");
      }

      function isUpcomingEventDate(date) {
        if (!date) return false;
        return new Date(date).getTime() >= Date.now();
      }

      /** RN12: chat activo hasta 24 h después del evento. */
      function isChatActiveEventDate(date) {
        if (!date) return false;
        return new Date(date).getTime() + CHAT_ACTIVE_MS > Date.now();
      }

      async function loadUserReservations() {
        try {
          return await api("/users/" + state.user.id + "/reservations");
        } catch {

      async function loadUserGuestEntries() {

          return await api("/users/" + state.user.id + "/guest-entries");

      async function fetchChatNotificationAlerts() {
        const alerts = [];
        try {
          const rows = await api("/users/" + state.user.id + "/chat-alerts");
          for (const row of rows || []) {
            if (state.view === "chat" && state.params.id === row.reservationId) continue;
            if (isChatAlertSeen(row)) continue;
            alerts.push({
              id: `chat-${row.reservationId}-${row.messageId}`,
              reservationId: row.reservationId,
              kind: "green",
              text: `${row.authorName || "Alguien"} te escribió en ${row.tableLabel || "mesa"}`,
              label: "Abrir chat",
              action: `setChatSeen('${row.reservationId}','${row.messageId}');openTableChat('${row.reservationId}','mine');closeNotifPanel()`,
            });
          }
        } catch { /* sin alertas de chat */ }
        return alerts;
      }

      async function fetchNotificationsData() {
        const alerts = [];
        const dismissed = getDismissedNotifs();
        const [rs, joins] = await Promise.all([
          loadUserReservations(),
          loadUserGuestEntries(),
        ]);
        const hostIds = new Set(rs.map((r) => r.id));

        for (const r of rs) {
          if (r.status === "PENDING_PAYMENT" && isUpcomingEventDate(r.event?.date)) {
            alerts.push({
              id: `pay-host-${r.id}`,
              kind: "amber",
              text: `Pago pendiente · ${r.table.label} · ${r.club.name}`,
              label: "Pagar ahora",
              action: `payReservation('${r.id}');closeNotifPanel()`,
            });
          }
        }

        for (const g of joins) {
          const r = g.reservation;
          if (!r || hostIds.has(r.id)) continue;
          if (g.status === "ACCEPTED_PENDING_PAYMENT" && r.paymentOption !== "FULL_PAYMENT") {
            alerts.push({
              id: `pay-guest-${g.id}`,
              kind: "green",
              text: `¡Te aceptaron! Pagá tu parte en ${r.table.label}`,
              label: "Pagar parte",
              action: `payShare('${g.id}');closeNotifPanel()`,
            });
          }
          if (g.status === "CONFIRMED" && isUpcomingEventDate(r.event?.date)) {
            const nid = `guest-confirmed-${g.id}`;
            if (!dismissed[nid]) {
              alerts.push({
                id: nid,
                kind: "cyan",
                text: `Quedaste confirmado en ${r.table.label} · ${r.club.name}`,
                label: "Ver QR",
                action: `dismissNotif('${nid}');go('ticket',{id:'${r.id}'});closeNotifPanel()`,
              });
            }
          }
        }

        const openHost = rs.filter((r) => (
          r.mode === "OPEN_TABLE"
          && !["CANCELLED", "EXPIRED"].includes(r.status)
          && isUpcomingEventDate(r.event?.date)
        ));
        if (openHost.length) {
          const guestLists = await Promise.all(
            openHost.map((r) => api("/reservations/" + r.id + "/guests").catch(() => []))
          );
          openHost.forEach((r, i) => {
            const pending = (guestLists[i] || []).filter((g) => g.status === "REQUESTED").length;
            if (pending > 0) {
              alerts.push({
                id: `host-pending-${r.id}`,
                kind: "violet",
                text: `${pending} postulación${pending > 1 ? "es" : ""} en ${r.table.label}`,
                label: "Ver invitados",
                action: `go('detail',{id:'${r.id}'});closeNotifPanel()`,
              });
            }
          });
        }

        const chatAlerts = await fetchChatNotificationAlerts();
        return [...alerts, ...chatAlerts];
      }

      function renderNotifPanelBody(alerts) {
        const body = document.getElementById("k-notif-panel-body");
        if (!body) return;
        if (!alerts.length) {
          body.innerHTML = `<div class="k-notif-empty">No tenés notificaciones pendientes.</div>`;
          return;
        }
        body.innerHTML = alerts.map((a) => `
          <div class="k-notif-item ${a.kind}">
            <p>${esc(a.text)}</p>
            <button type="button" class="btn-sm ${a.kind === "green" || a.kind === "cyan" ? "btn-accent" : ""}" onclick="${a.action}">${esc(a.label)}</button>
          </div>`).join("");
      }

      function getChatAlerts(alerts) {
        return (alerts || _alertsCache || []).filter((a) => a.id?.startsWith("chat-"));
      }

      function updateMineChatBadges() {
        const chatAlerts = getChatAlerts(_alertsCache);
        const count = chatAlerts.length;
        const show = count > 0;
        const label = count > 9 ? "9+" : String(count);
        for (const id of ["k-mine-nav-badge", "k-bnav-mine-badge"]) {
          const el = document.getElementById(id);
          if (!el) continue;
          if (show) {
            el.style.display = "";
            el.textContent = label;
          } else {
            el.style.display = "none";
          }
        }
        const prev = window._prevMineChatCount ?? -1;
        if (count !== prev && stillOn("mine")) {
          const live = livePage("mine");
          if (live) renderMine(live);
        }
        window._prevMineChatCount = count;
      }

      function mineChatDot(reservationId) {
        if (!reservationId) return "";
        const unread = getChatAlerts(_alertsCache).some((a) => a.reservationId === reservationId);
        return unread ? `<span class="k-chat-unread-dot" title="Mensaje nuevo"></span>` : "";
      }

      function notifyNewChatAlerts(alerts) {
        if (!_notifWarm) return;
        for (const a of alerts) {
          if (!a.id?.startsWith("chat-")) continue;
          if (_knownChatAlertIds.has(a.id)) continue;
          if (state.view === "chat" && state.params.id === a.reservationId) continue;
          toast(a.text, "ok");
        }
      }

      function syncChatAlertIds(alerts) {
        _knownChatAlertIds = new Set(alerts.filter((a) => a.id?.startsWith("chat-")).map((a) => a.id));
        _notifWarm = true;
      }

      async function refreshNotifications() {
        if (!state.user) return;
        try {
          _alertsCache = await fetchNotificationsData();
          _alertsAt = Date.now();
        } catch {
          _alertsCache = [];
        }
        const alerts = _alertsCache || [];
        notifyNewChatAlerts(alerts);
        syncChatAlertIds(alerts);
        const badge = document.getElementById("k-notif-badge");
        const btn = document.getElementById("k-notif-btn");
        if (badge) {
          if (alerts.length > 0) {
            badge.style.display = "";
            badge.textContent = alerts.length > 9 ? "9+" : String(alerts.length);
          } else {
            badge.style.display = "none";
          }
        }
        if (btn) btn.classList.toggle("has-notif", alerts.length > 0);
        updateMineChatBadges();
        const panel = document.getElementById("k-notif-panel");
        if (panel && !panel.hidden) renderNotifPanelBody(alerts);
      }

      function toggleNotifPanel(ev) {
        ev?.stopPropagation();
        const panel = document.getElementById("k-notif-panel");
        if (!panel) return;
        const open = panel.hidden;
        panel.hidden = !open;
        if (open) {
          void refreshNotifications().then(() => {
            renderNotifPanelBody(_alertsCache || []);
          });
        }
      }

      function closeNotifPanel() {
        const panel = document.getElementById("k-notif-panel");
        if (panel) panel.hidden = true;
      }

      function bindNotifOutsideClick() {
        if (_notifOutsideBound) return;
        _notifOutsideBound = true;
        document.addEventListener("click", (e) => {
          const wrap = document.getElementById("k-notif-wrap");
          if (wrap && !wrap.contains(e.target)) closeNotifPanel();
        });
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            invalidateNotifications();
            void refreshNotifications();
          }
        });
      }

      function startNotifPoll() {
        stopNotifPoll();
        _notifPollTimer = setInterval(() => { void refreshNotifications(); }, 4000);
      }

      function stopNotifPoll() {
        if (_notifPollTimer) {
          clearInterval(_notifPollTimer);
          _notifPollTimer = null;
        }
      }

      async function refreshAlerts() {
        return refreshNotifications();
      }

      async function confirmWizardReserve(tableId, eventId) {
        if (!_wizardPolicyAccepted) {
          toast("Aceptá la política de cancelación para continuar", "err");
          return;
        }
        const btn = $("reserve-btn");
        if (btn) { btn.disabled = true; btn.textContent = "Procesando..."; }
        try {
          let reservationId = _wizardHoldId;
          if (!reservationId || _wizardHoldTableId !== tableId) {
            reservationId = await ensureWizardHold(tableId, eventId);
          }
          if (_reserveSel) {
            await api("/reservations/" + reservationId + "/pending", {
              method: "PATCH",
              body: JSON.stringify({ paymentOption: _reserveSel }),
            });
          }
          const payBody = { provider: "demo" };
          if (_wizardLoyalty?.pointsToUse > 0) payBody.loyaltyPointsToRedeem = _wizardLoyalty.pointsToUse;
          const paid = await api("/reservations/" + reservationId + "/pay", { method: "POST", body: JSON.stringify(payBody) });
          _wizardHoldId = null;
          _wizardHoldTableId = null;
          _wizardHoldExpiresAt = null;
          _alertsCache = null;
          go("ticket", { id: paid.id });
        } catch (e) {
          const err = document.getElementById("reserve-err");
          if (err) err.textContent = e.message;
          if (btn) { btn.disabled = false; btn.textContent = "Confirmar y pagar"; }
        }
      }

      let _loyaltyTotalCache = null;

      function renderBottlesGrid(products) {
        let html = `<div class="bottles-grid">`;
        let lastCat = null;
        for (const p of products) {
          const cat = p.category || "General";
          if (cat !== lastCat) {
            html += `<div style="grid-column:1/-1;font-size:12px;color:var(--muted);font-weight:700;margin:${lastCat ? "10px" : "0"} 0 4px;text-transform:uppercase;letter-spacing:.5px">🍾 ${esc(cat)}</div>`;

          }
          html += `<div class="bottle-item">
            <div class="bi-name">${esc(p.name)}</div>
            ${p.description ? `<div class="bi-desc">${esc(p.description)}</div>` : ""}

      function renderBottlesSection(products) {
        if (!products.length) return "";

      }
      async function openConsumptionPlanner(opts = {}) {
        openModal('<div class="empty">Cargando...</div>');
        try {
          if (opts.guestView && !opts.reservationId) {
            throw new Error("Solo podés usar la calculadora si formás parte de la mesa.");
          }
          let r = null;
          if (opts.reservationId) {
            r = await api("/reservations/" + opts.reservationId);
            const uid = state.user?.id;
            if (uid) {
              const isHost = r.hostId === uid || r.host?.id === uid;
              const isGuest = (r.guests || []).some(
                (g) => g.userId === uid && (g.status === "CONFIRMED" || g.status === "ACCEPTED_PENDING_PAYMENT")
              );
              if (!isHost && !isGuest) {
                throw new Error("Solo podés usar la calculadora si sos anfitrión o invitado confirmado de esta mesa.");
              }
            }
          }
          const eventId = r?.eventId || r?.event?.id || opts.eventId;
          let eventName = r?.event?.name || opts.eventName || "";
          if (!eventId) throw new Error("No se encontró el evento");
          if (!eventName) {
            const av = await api("/events/" + eventId + "/availability");
            eventName = av.event?.name || "Evento";
          }
          const products = await api("/events/" + eventId + "/products");
          const defaultBudget = opts.defaultBudget ?? (opts.guestView
            ? guestBudgetDefault(opts.guestView)
            : (r ? consumptionBudgetDefault(r) : (opts.minConsumption > 0 ? opts.minConsumption : Math.max(0, num(opts.tablePrice) - Math.round(num(opts.tablePrice) * (opts.depositPercent || 10) / 100)))));
          window._calcCtx = { r, eventId, eventName, products, budget: defaultBudget, qty: {}, guestView: opts.guestView || null, orders: [] };
          if (r?.id) await loadCalcOrders();
          paintConsumptionPlanner();
        } catch (e) {
          openModal(`<div class="empty">${esc(e.message)}</div><button class="btn-full ghost" style="margin-top:16px" onclick="closeModal()">Cerrar</button>`);
        }
      }

      function calcLineTotal(productId) {
        const ctx = window._calcCtx;
        if (!ctx) return 0;
        const p = ctx.products.find((x) => x.id === productId);
        const q = ctx.qty[productId] || 0;
        return p ? num(p.price) * q : 0;
      }

      function calcCartTotal() {
        const ctx = window._calcCtx;
        if (!ctx) return 0;
        return ctx.products.reduce((acc, p) => acc + calcLineTotal(p.id), 0);
      }

      function setCalcQty(productId, delta) {
        const ctx = window._calcCtx;
        if (!ctx) return;
        const next = Math.max(0, (ctx.qty[productId] || 0) + delta);
        if (next === 0) delete ctx.qty[productId];
        else ctx.qty[productId] = next;
        refreshCalcPlannerUi();
      }

      function refreshCalcSummaryOnly() {
        const ctx = window._calcCtx;
        const el = document.getElementById("calc-summary");
        if (!ctx || !el) return;
        el.innerHTML = calcSummaryHtml(calcCartTotal(), ctx.budget);
      }

      function calcLinesHtml(ctx) {
        const products = ctx.products || [];
        if (!products.length) return `<div class="empty">Todavía no hay botellas cargadas para este evento.</div>`;
        return products.map((p) => {
          const q = ctx.qty[p.id] || 0;
          const lineTotal = calcLineTotal(p.id);
          return `<div class="k-calc-line">
            <div>
              <div class="name">${esc(p.name)}</div>
              <div class="price">${esc(p.category || "General")} · ${money(p.price)} c/u</div>
          </div>
            <div class="k-calc-qty">
              <button type="button" onclick="setCalcQty('${p.id}', -1)">−</button>
              <span>${q}</span>
              <button type="button" onclick="setCalcQty('${p.id}', 1)">+</button>
          </div>
            <div class="k-calc-line-total">${q ? money(lineTotal) : "—"}</div>
          </div>`;
        }).join("");
      }

      function refreshCalcPlannerUi() {
        const ctx = window._calcCtx;
        if (!ctx) return;
        const linesEl = document.getElementById("calc-lines");
        if (linesEl) linesEl.innerHTML = calcLinesHtml(ctx);
        refreshCalcSummaryOnly();
      }

      function bindCalcBudgetInput() {
        const inp = document.getElementById("calc-budget-input");
        const ctx = window._calcCtx;
        if (!inp || !ctx || inp.dataset.bound) return;
        inp.dataset.bound = "1";
        inp.addEventListener("input", () => {
          ctx.budget = Math.max(0, num(inp.value));
          refreshCalcSummaryOnly();
        });
      }

      function calcSummaryHtml(cartTotal, budget) {
        const diff = budget - cartTotal;
        if (!budget && !cartTotal) {
          return `<div class="k-calc-summary">Elegí un presupuesto y agregá botellas para ver cuánto podés llevar.</div>`;
        }
        if (cartTotal === 0) {
          return `<div class="k-calc-summary">Presupuesto: <b>${money(budget)}</b><br/>Agregá productos de la carta para armar tu noche.</div>`;
        }
        if (diff >= 0) {
          return `<div class="k-calc-summary ok">Armado: <b>${money(cartTotal)}</b> · Presupuesto: <b>${money(budget)}</b><br/>Te sobran <b>${money(diff)}</b> dentro de tu presupuesto.</div>`;
        }
        return `<div class="k-calc-summary over">Armado: <b>${money(cartTotal)}</b> · Presupuesto: <b>${money(budget)}</b><br/>Te faltan <b>${money(-diff)}</b> para cubrir lo seleccionado.</div>`;
      }

      async function loadCalcOrders() {
        const ctx = window._calcCtx;
        if (!ctx?.r?.id) return;
        ctx.orders = ctx.r.orders || (await api("/reservations/" + ctx.r.id + "/orders").catch(() => []));
      }

      function calcOrdersHtml(orders) {
        if (!orders?.length) return "";
        return reservationConsumptionHtml({ orders: orders.filter((o) => o.status !== "CANCELLED" && o.status !== "PENDING_PAYMENT") });
      }

      function paintConsumptionPlanner() {
        const ctx = window._calcCtx;
        if (!ctx) return;
        const { r, eventName, budget, guestView, orders = [] } = ctx;
        const cartTotal = calcCartTotal();
        const financeBlock = guestView
          ? guestFinanceHtml(guestView)
          : (r ? reservationFinanceHtml(r) : "");

        openModal(`
          <h3>Calculadora de consumo</h3>
          <p class="sub">${esc(eventName)} · Armá un presupuesto de botellas antes de ir (sin pago online acá)</p>
          ${financeBlock}

            <p class="k-fin-note" style="margin-top:6px">Por defecto usamos la consumición mínima de la mesa. El pago de botellas se hace en el boliche; acá solo planificás.</p>
          </div>
          <div class="k-calc-lines" id="calc-lines">${calcLinesHtml(ctx)}</div>
          <div id="calc-summary">${calcSummaryHtml(cartTotal, budget)}</div>
          ${calcOrdersHtml(orders)}
          <button class="btn-full ghost" style="margin-top:16px" onclick="closeModal()">Cerrar</button>`);
        bindCalcBudgetInput();
      }

      function guestEntryCard(g) {
        const r = g.reservation;
        const prepaid = r.paymentOption === "FULL_PAYMENT";
        const guestView = {
          shareAmount: g.shareAmount,
          prepaid,
          minConsumption: reservationMinConsumption(r),
          status: g.status,
        };
        const actions = [];

          actions.push(`<button type="button" class="btn-sm btn-accent" onclick="payShare('${g.id}')">Pagar mi parte (${money(g.shareAmount)})</button>`);

        if (g.status === "CONFIRMED") {
          actions.push(`<button type="button" class="btn-sm btn-accent" onclick="openTableChat('${r.id}','mine')">💬 Chat${mineChatDot(r.id)}</button>`);
          actions.push(`<button type="button" class="btn-sm btn-accent" onclick="go('ticket',{id:'${r.id}'})">Ver QR</button>`);
        }
        if (g.status === "ACCEPTED_PENDING_PAYMENT" || g.status === "CONFIRMED") {
          actions.push(`<button type="button" class="btn-sm ghost" onclick='openConsumptionPlanner(${JSON.stringify({ reservationId: r.id, guestView })})'>Calculadora 🍾</button>`);
        }
        return `<div class="card list-card">
          <div class="head"><div class="title">${esc(r.table.label)}${mineChatDot(r.id)}</div>${mineBadgesHtml("guest", g.status)}</div>
          <div class="meta">🏢 ${esc(r.club.name)}<br/>🗓️ ${fdatetime(r.event.date)}<br/>👤 Anfitrión: ${esc(r.host.fullName)}</div>
          ${guestFinanceHtml(guestView)}
          <div class="btn-row">${actions.join("") || '<span class="hint">Esperando respuesta del anfitrión</span>'}</div>
        </div>`;

      function hostReservationCard(r) {
        const actions = [];
        if (r.status === "PENDING_PAYMENT") actions.push(`<button class="btn-sm" onclick="payReservation('${r.id}')">Pagar seña</button>`);
        if (r.status === "CONFIRMED" && r.mode === "STANDARD") actions.push(`<button class="btn-sm btn-accent" onclick="openTableModal('${r.id}',${r.table.capacity})">Abrir mesa 👥</button>`);
        if (r.mode === "OPEN_TABLE") {
          actions.push(`<button class="btn-sm" onclick="go('detail',{id:'${r.id}'})">Invitados</button>`);
          if (["CONFIRMED", "CHECKED_IN"].includes(r.status)) {
            actions.push(`<button class="btn-sm btn-accent" onclick="openTableChat('${r.id}','mine')">💬 Chat${mineChatDot(r.id)}</button>`);
          }
        }
        if (r.status === "CONFIRMED" || r.status === "CHECKED_IN") actions.push(`<button class="btn-sm btn-accent" onclick="go('ticket',{id:'${r.id}'})">Ver QR</button>`);
        actions.push(`<button class="btn-sm ghost" onclick="openConsumptionPlanner({ reservationId: '${r.id}' })">Calculadora 🍾</button>`);
        if (r.status === "PENDING_PAYMENT" || r.status === "CONFIRMED") actions.push(`<button class="btn-sm btn-danger" onclick="cancelReservation('${r.id}')">Cancelar</button>`);
        return `<div class="card list-card">
          <div class="head"><div class="title">${esc(r.table.label)}${mineChatDot(r.id)}</div>${mineBadgesHtml("host", r.status)}</div>
          <div class="meta">🏢 ${esc(r.club.name)}<br/>🗓️ ${fdatetime(r.event.date)}${r.mode === "OPEN_TABLE" ? `<br/>👥 Mesa abierta (vos + ${Math.max(0, (r.maxGuests || 1) - 1)} invitados)` : ""}</div>
          ${reservationFinanceHtml(r, true)}
          ${reservationConsumptionHtml(r)}
          ${reservationTimelineHtml(r)}
          <div class="btn-row">${actions.join("")}</div>
        </div>`;

      function pastGuestCard(g) {
        const r = g.reservation;
        return `<div class="card list-card" style="opacity:.7">
          <div class="head"><div class="title">${esc(r.table.label)}</div><div class="k-mine-badges"><span class="badge green">Invitado</span><span class="badge muted">Finalizado</span></div></div>
          <div class="meta">🏢 ${esc(r.club.name)}<br/>🗓️ ${fdatetime(r.event.date)}<br/>👤 ${esc(r.host.fullName)}</div>
        </div>`;

      function pastHostCard(r) {
        return `<div class="card list-card" style="opacity:.7">
          <div class="head"><div class="title">${esc(r.table.label)}</div><div class="k-mine-badges"><span class="badge violet">Anfitrión</span><span class="badge muted">Finalizado</span></div></div>
          <div class="meta">🏢 ${esc(r.club.name)}<br/>🗓️ ${fdatetime(r.event.date)}</div>
        </div>`;

      async function renderMine(page) {
        page.innerHTML = `<div class="k-page-head"><h1>Mis mesas</h1><p>Tus reservas como anfitrión y las mesas donde te invitaron o postulaste. <a href="#" onclick="event.preventDefault();go('cancelacion')" style="color:var(--accent)">Política de cancelación</a></p></div>${mineFilterTabsHtml()}<div id="list"><div class="empty">Cargando...</div></div><div id="past-wrap"></div>`;
        try {
          const [rs, entries] = await Promise.all([
            api("/users/" + state.user.id + "/reservations"),
            api("/users/" + state.user.id + "/guest-entries"),
          ]);
          if (!stillOn("mine")) return;
          const live = livePage("mine"); if (!live) return;
          const now = Date.now();
          const hostIds = new Set(rs.map((r) => r.id));
          const filter = state.mineFilter || "all";

          const visibleHost = (r) => isActiveReservation(r);
          const visibleGuest = (g) => (
            g.reservation
            && isActiveReservation(g.reservation)
            && !hostIds.has(g.reservation.id)
            && g.reservation.hostId !== state.user.id
          );

          const upcomingHost = rs.filter((r) => visibleHost(r) && isUpcomingEvent(r.event.date))
            .sort((a, b) => new Date(a.event.date) - new Date(b.event.date));
          const upcomingGuest = entries.filter((g) => visibleGuest(g) && isUpcomingEvent(g.reservation.event.date))
            .sort((a, b) => new Date(a.reservation.event.date) - new Date(b.reservation.event.date));

          const pastHost = rs.filter((r) => visibleHost(r) && ["COMPLETED", "CHECKED_IN", "NO_SHOW"].includes(r.status) && new Date(r.event.date).getTime() < now)
            .sort((a, b) => new Date(b.event.date) - new Date(a.event.date));
          const pastGuest = entries.filter((g) => visibleGuest(g) && g.status === "CONFIRMED" && new Date(g.reservation.event.date).getTime() < now)
            .sort((a, b) => new Date(b.reservation.event.date) - new Date(a.reservation.event.date));

          let upcoming = [];
          if (filter === "all" || filter === "host") {
            upcoming.push(...upcomingHost.map((r) => ({ kind: "host", date: r.event.date, card: hostReservationCard(r) })));
          }
          if (filter === "all" || filter === "guest") {
            upcoming.push(...upcomingGuest.map((g) => ({ kind: "guest", date: g.reservation.event.date, card: guestEntryCard(g) })));
          }
          upcoming.sort((a, b) => new Date(a.date) - new Date(b.date));

          let past = [];
          if (filter === "all" || filter === "host") {
            past.push(...pastHost.map((r) => ({ date: r.event.date, card: pastHostCard(r) })));
          }
          if (filter === "all" || filter === "guest") {
            past.push(...pastGuest.map((g) => ({ date: g.reservation.event.date, card: pastGuestCard(g) })));
          }
          past.sort((a, b) => new Date(b.date) - new Date(a.date));

          const el = live.querySelector("#list");
          if (!el) return;
          if (!upcoming.length) {
            el.className = "";
            const emptyByFilter = {
              all: {
                title: "Sin mesas próximas",
                hint: "Reservá tu mesa o sumate a una mesa abierta de la comunidad.",
                actionLabel: "Explorar boliches",
                actionOnclick: "go('home')",
              },
              host: {
                title: "Sin reservas propias",
                hint: "Explorá boliches y reservá tu mesa para el próximo evento.",
                actionLabel: "Explorar boliches",
                actionOnclick: "go('home')",
              },
              guest: {
                title: "Sin mesas como invitado",
                hint: "Pedí sumarte a una mesa abierta y seguí el estado acá.",
                actionLabel: "Ver mesas abiertas",
                actionOnclick: "go('open')",
              },
            };
            const opts = emptyByFilter[filter] || emptyByFilter.all;
            if (filter === "all") {
              el.innerHTML = emptyHtml(opts) + `<div style="text-align:center;margin-top:14px"><button type="button" class="ghost btn-sm" onclick="go('open')">Ver mesas abiertas</button></div>`;
            } else {
              el.innerHTML = emptyHtml(opts);
            }
          } else {
            el.className = "grid-cards";
            el.innerHTML = upcoming.map((item) => item.card).join("");
          }
          renderPast(past, live);
        } catch (e) {
          if (stillOn("mine")) toast(e.message, "err");
        }
      }

      function renderPast(pastItems, page = livePage("mine")) {
        if (!page || !stillOn("mine")) return;
        const wrap = page.querySelector("#past-wrap");
        if (!wrap) return;
        if (!pastItems.length) { wrap.innerHTML = ""; return; }
        if (!state.showPast) {
          wrap.innerHTML = `<div style="text-align:center;margin-top:22px"><button class="ghost btn-sm" onclick="state.showPast=true;renderMine($('page'))">Ver eventos pasados (${pastItems.length})</button></div>`;
          return;
        }
        const cards = pastItems.map((item) => item.card).join("");
        wrap.innerHTML = `<div class="section-sub" style="margin-top:26px;display:flex;justify-content:space-between;align-items:center"><span>Eventos pasados</span><button class="ghost btn-sm" onclick="state.showPast=false;renderMine($('page'))">Ocultar</button></div><div class="grid-cards">${cards}</div>`;
      }
      async function payReservation(id) {
        try {
          await api("/reservations/" + id + "/pay", { method: "POST", body: JSON.stringify({ provider: "demo" }) });
          _alertsCache = null;
          toast("¡Pago confirmado!", "ok");

      async function cancelReservation(id) {
        openModal('<div class="empty">Calculando devolución…</div>');
        try {
          const p = await api("/reservations/" + id + "/cancel-preview");
          const refundLine = p.status === "PENDING_PAYMENT"
            ? `<p class="hint">Todavía no pagaste; no hay reembolso en efectivo.</p>`
            : `<p>Devolución estimada: <b>${money(p.refundAmount)}</b> (${p.refundPercent}% de ${money(p.amountPaid)} pagado online).</p>`;
          const ptsLine = p.pointsRestored > 0
            ? `<p>Se te devolverán <b>${p.pointsRestored} Kluby Points</b>.</p>`
            : "";
          openModal(`
            <h3>Cancelar reserva</h3>
            <p class="hint">${esc(p.policy?.preview?.tierLabel || "Revisá el monto antes de confirmar.")}</p>
            ${refundLine}
            ${ptsLine}
            <p class="hint" style="margin-top:12px"><a href="#" onclick="event.preventDefault();go('cancelacion')">Política completa de cancelación</a></p>
            <div class="btn-row" style="margin-top:20px">
              <button type="button" class="ghost" onclick="closeModal()">Volver</button>
              <button type="button" class="btn-danger" style="flex:1" onclick="confirmCancelReservation('${id}')">Confirmar cancelación</button>
            </div>`);
        } catch (e) {
          openModal(`<div class="empty">${esc(e.message)}</div><button class="btn-full ghost" style="margin-top:16px" onclick="closeModal()">Cerrar</button>`);
        }
      }
      async function confirmCancelReservation(id) {
        try {
          const r = await api("/reservations/" + id + "/cancel", { method: "POST" });
          closeModal();
          let msg = "Reserva cancelada.";
          if (r.refundPercent > 0) msg += " Reembolso: " + r.refundPercent + "% (" + money(r.refundAmount) + ").";
          if (r.pointsRestored > 0) msg += " " + r.pointsRestored + " pts devueltos.";
          toast(msg, "ok");
          _alertsCache = null;
          renderMine($("page"));
        } catch (e) { toast(e.message, "err"); }
      }
      async function showTicketById(id) {
        go("ticket", { id });
      }
      function openTableModalInner(id, capacity) {
        const maxInvitees = Math.max(1, capacity - 1);
        const defaultInvitees = Math.min(3, maxInvitees);
        openModal(`
          <h3>Abrir mesa a la comunidad</h3>
          <p class="hint">Otros usuarios podrán pedir sumarse y dividir el costo. Vos aprobás quién entra. Vos ocupás 1 lugar; el resto son invitados.</p>
          <label>Invitados que pueden sumarse (máx. ${maxInvitees} en mesa de ${capacity})</label>
          <input id="max-guests" type="number" min="1" max="${maxInvitees}" value="${defaultInvitees}" />
          <p class="hint" style="margin-top:8px">Total en la mesa: <b id="open-total-preview">${1 + defaultInvitees}</b> personas (vos + invitados)</p>
          <div class="btn-row" style="margin-top:20px">
            <button type="button" class="ghost" onclick="closeModal()">Cancelar</button>
            <button type="button" style="flex:1" onclick="confirmOpen('${id}', ${capacity})">Abrir mesa</button>
          </div>
          <div class="error" id="open-err"></div>`);
        const input = document.getElementById("max-guests");
        const preview = document.getElementById("open-total-preview");
        if (input && preview) {
          input.addEventListener("input", () => {
            const n = Number(input.value) || 0;
            preview.textContent = String(1 + n);
          });
        }
      }
      function openTableModal(id, capacity) {
        if (capacity < 2) {
          toast("Esta mesa no tiene capacidad para invitados (mínimo 2 personas)", "err");
          return;
        }
        maybeOnboard("kluby_onboard_open_host", `
          <h3>¿Qué es abrir tu mesa?</h3>
          <p class="hint">Compartís la mesa con otros usuarios de Kluby y dividen el costo.</p>
          <ul>
            <li>Vos ocupás un lugar; el resto son invitados que pueden sumarse.</li>
            <li>En una mesa de 10, podés abrir hasta <b>9</b> cupos para invitados.</li>
            <li>La mesa aparece en <b>Mesas abiertas</b>.</li>
            <li>Aprobás quién se suma antes de que paguen su parte.</li>
          </ul>`, () => openTableModalInner(id, capacity));
      }
      async function confirmOpen(id, capacity) {
        try {
          const invitees = parseInt($("max-guests").value, 10);
          const maxInvitees = Math.max(1, capacity - 1);
          if (!Number.isFinite(invitees) || invitees < 1 || invitees > maxInvitees) {
            $("open-err").textContent = `Elegí entre 1 y ${maxInvitees} invitados (mesa de ${capacity}).`;
            return;
          }
          const maxGuests = 1 + invitees;
          await api("/reservations/" + id + "/open", { method: "POST", body: JSON.stringify({ maxGuests }) });
          closeModal(); toast("¡Mesa abierta! Ya aparece en el muro.", "ok"); renderMine($("page"));
        } catch (e) { $("open-err").textContent = e.message; }
      }

      async function guestAction(guestId, action) {
        try { await api("/guests/" + guestId + "/" + action, { method: "POST" }); toast(action === "accept" ? "Invitado aceptado" : "Postulación rechazada", "ok"); _alertsCache = null; void refreshNotifications(); renderDetail($("page")); }

      // ---------- TABLE CHAT (RN12) ----------
      let _chatPollTimer = null;
      let _chatStickBottom = true;
      let _chatLocked = false;

      function stopChatPoll() {
        if (_chatPollTimer) {
          clearInterval(_chatPollTimer);
          _chatPollTimer = null;
        }
      }

      function openTableChat(reservationId, back) {
        go("chat", { id: reservationId, back: back || "mine" });
      }

      function chatBackNav() {
        const back = state.params.back || "mine";
        if (back === "detail") go("detail", { id: state.params.id });
        else go(back);
      }

      function chatTime(d) {
        const dt = new Date(d);
        const now = new Date();
        const sameDay = dt.toDateString() === now.toDateString();
        return dt.toLocaleString("es-AR", sameDay
          ? { hour: "2-digit", minute: "2-digit" }
          : { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      }

      function chatMessagesHtml(messages) {
        if (!messages.length) {
          return `<div class="k-chat-empty"><p>Todavía no hay mensajes.</p><p class="hint">Coordiná horarios, consumo o punto de encuentro con tu mesa.</p></div>`;
        }
        return messages.map((m) => {
          const mine = m.userId === state.user.id;
          return `<div class="k-chat-msg ${mine ? "mine" : "theirs"}">
            <div class="k-chat-bubble">
              ${mine ? "" : `<div class="k-chat-author">${esc(m.user.fullName)}</div>`}
              <div class="k-chat-text">${esc(m.content)}</div>
              <div class="k-chat-time">${chatTime(m.createdAt)}</div>
            </div>
          </div>`;
        }).join("");
      }

      function scrollChatToBottom(force) {
        const el = document.getElementById("k-chat-scroll");
        if (!el) return;
        if (force || _chatStickBottom) {
          el.scrollTop = el.scrollHeight;
          _chatStickBottom = true;
        }
      }

      function bindChatScroll() {
        const el = document.getElementById("k-chat-scroll");
        if (!el || el._chatBound) return;
        el._chatBound = true;
        el.addEventListener("scroll", () => {
          const gap = el.scrollHeight - el.scrollTop - el.clientHeight;
          _chatStickBottom = gap < 48;
        });
      }

      async function refreshChatMessages(silent) {
        if (!stillOn("chat")) return;
        const id = state.params.id;
        if (!id) return;
        try {
          const messages = await api("/reservations/" + id + "/chat");
          _chatLocked = false;
          const prevCount = window._chatMsgCount || 0;
          window._chatMsgCount = messages.length;
          const live = livePage("chat");
          if (!live) return;
          const list = live.querySelector("#k-chat-messages");
          const status = live.querySelector("#k-chat-status");
          const form = live.querySelector("#k-chat-form");
          const input = live.querySelector("#k-chat-input");
          if (status) status.textContent = "En vivo";
          if (list) {
            list.innerHTML = chatMessagesHtml(messages);
            if (!silent || messages.length > prevCount) scrollChatToBottom(!silent);
          }
          if (form) form.style.display = "";
          if (input) input.disabled = false;
          if (messages.length && stillOn("chat") && _chatStickBottom) {
            const last = messages[messages.length - 1];
            setChatSeen(id, last.id);
          }
          if (!silent) void refreshNotifications();
        } catch (e) {
          _chatLocked = true;
          const live = livePage("chat");
          if (!live) return;
          const list = live.querySelector("#k-chat-messages");
          const status = live.querySelector("#k-chat-status");
          const form = live.querySelector("#k-chat-form");
          const input = live.querySelector("#k-chat-input");
          if (status) status.textContent = "No disponible";
          if (list) {
            list.innerHTML = `<div class="k-chat-locked"><p>${esc(e.message)}</p></div>`;
          }
          if (form) form.style.display = "none";
          if (input) input.disabled = true;
        }
      }

      async function sendChatMessage(ev) {
        ev.preventDefault();
        const input = document.getElementById("k-chat-input");
        if (!input || _chatLocked) return;
        const content = input.value.trim();
        if (!content) return;
        const id = state.params.id;
        const btn = document.getElementById("k-chat-send");
        try {
          if (btn) btn.disabled = true;
          input.disabled = true;
          await api("/reservations/" + id + "/chat", { method: "POST", body: JSON.stringify({ content }) });
          input.value = "";
          invalidateNotifications();
          await refreshChatMessages(true);
          void refreshNotifications();
        } catch (e) {
          toast(e.message, "err");
        } finally {
          if (btn) btn.disabled = false;
          if (input && !_chatLocked) input.disabled = false;
          input?.focus();
        }
      }

      function startChatPoll() {
        stopChatPoll();
        _chatPollTimer = setInterval(() => { void refreshChatMessages(true); }, 5000);
      }

      async function renderChat(page) {
        stopChatPoll();
        window._chatMsgCount = 0;
        _chatStickBottom = true;
        _chatLocked = false;
        const back = state.params.back || "mine";
        const backLabel = back === "detail" ? "← Volver a invitados" : "← Mis mesas";
        page.innerHTML = `<div class="empty">Cargando chat…</div>`;
        try {
          const r = await api("/reservations/" + state.params.id);
          if (!stillOn("chat")) return;
          const live = livePage("chat");
          if (!live) return;
          live.innerHTML = `
            <button type="button" class="ghost btn-sm" onclick="chatBackNav()">${backLabel}</button>
            <div class="k-page-head" style="margin-top:10px">
              <h1>Chat de mesa</h1>
              <p>${esc(r.table.label)} · ${esc(r.club.name)} · ${fdatetime(r.event.date)}</p>
            </div>
            <div class="k-chat-panel">
              <div class="k-chat-head">
                <span class="k-chat-live-dot"></span>
                <span id="k-chat-status">Conectando…</span>
              </div>
              <div class="k-chat-scroll" id="k-chat-scroll">
